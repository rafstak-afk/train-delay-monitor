<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Moje Pociągi V2</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2b;
  --border:#263653;
  --text:#f4f7fb;
  --muted:#91a0b7;
  --cyan:#22d3ee;
  --green:#34d399;
  --red:#fb7185;
  --gray:#64748b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

.app{
  width:min(100%,700px);
  margin:0 auto;
  padding:12px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0 16px;
}

h1{ margin:0; font-size:20px; }

.refresh{
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--cyan);
  font-weight:700;
  cursor:pointer;
}

.refresh:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:10px;
  align-items:center;
  cursor:pointer;
  transition:border-color 0.15s ease;
}

.card:hover{ border-color:var(--cyan); }

.time-box{
  text-align:center;
  background:#0b1220;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--border);
}

.plan-time{ font-size:14px; font-weight:800; color:var(--text); }
.delay-tag{ font-size:11px; font-weight:700; margin-top:2px; }
.delay-tag.ok{ color:var(--green); }
.delay-tag.bad{ color:var(--red); }
.delay-tag.off{ color:var(--gray); }

.info-box{ min-width:0; }
.train-num{ font-size:16px; font-weight:900; color:var(--cyan); }
.station-name{ font-size:13px; color:var(--muted); margin-top:2px; }
.status-text{ font-size:12px; color:var(--text); margin-top:4px; }
.last-loc{ font-size:12px; color:var(--cyan); margin-top:4px; font-weight:600; }

.actions{ display:flex; align-items:center; gap:6px; }
.btn-action{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
  width:32px;
  height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
}
.btn-action:hover{ background:rgba(255,255,255,0.15); }
.btn-del{
  background:rgba(251,113,133,0.15);
  border:1px solid rgba(251,113,133,0.4);
  color:var(--red);
}
.btn-del:hover{ background:rgba(251,113,133,0.3); }

.add-form{
  margin-top:20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}
.add-form h3{ margin:0 0 10px 0; font-size:15px; color:var(--cyan); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; }
.form-grid input{
  background:#0b1220;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  border-radius:8px;
  font-size:13px;
  width:100%;
}
.btn-add{
  background:var(--cyan);
  color:#0b1220;
  border:0;
  border-radius:8px;
  padding:8px 14px;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:600px){
  .form-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>🚆 Moje Pociągi V2</h1>
  </div>
  <button class="refresh" id="refreshBtn">↻ ODŚWIEŻ</button>
</header>

<main id="list" class="list"></main>

<section class="add-form">
  <h3>➕ Dodaj pociąg do listy</h3>
  <form id="addTrainForm" class="form-grid">
    <input type="text" id="addStation" placeholder="Stacja (np. Katowice)" required>
    <input type="text" id="addTrainNum" placeholder="Nr pociągu (np. 3815)" required>
    <input type="text" id="addPlanTime" placeholder="Godzina (np. 14:40)" required>
    <button type="submit" class="btn-add">Dodaj</button>
  </form>
</section>

</div>

<script>
const STORAGE_KEY = 'rafstakMojePociagiV4';

const DEFAULT_TRAINS = [
  { station: 'Miasteczko Śląskie', trainNum: '44226', planTime: '04:59' },
  { station: 'Tarnowskie Góry', trainNum: '40450', planTime: '05:21' },
  { station: 'Chorzów Batory', trainNum: '40658', planTime: '06:07' },
  { station: 'Tarnowskie Góry', trainNum: '40250', planTime: '05:46' },
  { station: 'Chorzów Batory', trainNum: '40660', planTime: '06:32' },
  { station: 'Katowice', trainNum: '40921', planTime: '14:59' },
  { station: 'Katowice', trainNum: '40621', planTime: '15:35' },
  { station: 'Chorzów Batory', trainNum: '40423', planTime: '15:12' },
  { station: 'Chorzów Batory', trainNum: '40468', planTime: '14:42' },
  { station: 'Chorzów Batory', trainNum: '40425', planTime: '16:06' },
  { station: 'Katowice', trainNum: '8330', planTime: '10:20' },
  { station: 'Katowice', trainNum: '3815', planTime: '14:40' }
];

function loadTrains() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return [...DEFAULT_TRAINS];
}

function saveTrains(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

let currentTrains = loadTrains();

async function fetchStationDepartures(station) {
  try {
    const res = await fetch('/api/departures?station=' + encodeURIComponent(station) + '&limit=300', { cache: 'no-store' });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.departures) ? data.departures : (Array.isArray(data) ? data : []);
  } catch (e) {
    return [];
  }
}

// Fallback: Pobieranie identyfikatorów i stanu biegu po samym numerze pociągu z PLK
async function fetchTrainByNumber(trainNum, station) {
  try {
    let scheduleId = "";
    let orderId = "";
    let trainOrderId = "";

    try {
      const lookupRes = await fetch(`/api/v2/smart-lookup?train=${encodeURIComponent(trainNum)}&station=${encodeURIComponent(station)}`, { cache: "no-store" });
      if (lookupRes.ok) {
        const lData = await lookupRes.json();
        if (lData && lData.ok) {
          scheduleId = lData.scheduleId || "";
          orderId = lData.orderId || "";
          trainOrderId = lData.trainOrderId || "";
        }
      }
    } catch (_) {}

    const query = new URLSearchParams({
      train: trainNum,
      station: station
    });
    if (scheduleId) query.set("scheduleId", scheduleId);
    if (orderId) query.set("orderId", orderId);
    if (trainOrderId) query.set("trainOrderId", trainOrderId);

    const res = await fetch(`/api/train-details?${query.toString()}`, { cache: "no-store" });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data) return null;

    let lastSt = data.lastConfirmedStation || data.lastStation || data.lastLocation;
    
    // Walidacja statusu - czy pociąg faktycznie zakończył bieg, czy dopiero czeka na odjazd
    const now = new Date();
    const parseTime = (timeStr) => {
      if (!timeStr) return null;
      const parts = timeStr.split(":");
      if (parts.length < 2) return null;
      const d = new Date();
      d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
      return d;
    };

    const depTime = parseTime(data.departureTime || data.scheduledDeparture);
    const arrTime = parseTime(data.arrivalTime || data.scheduledArrival);

    // Jeśli nie było jeszcze odjazdu i obecny czas jest przed/w okolicach planowego odjazdu, pociąg czeka na start
    if (depTime && now < depTime && (!data.delay || data.delay === 0) && !data.isFinished) {
      data.statusText = "Oczekuje na odjazd";
      data.isPending = true;
    }
    let lastTm = data.lastConfirmedTime || data.lastTime || data.arrivalTime;

    if (!lastSt && Array.isArray(data.timeline) && data.timeline.length > 0) {
      const confirmed = data.timeline.filter(t => t.confirmed || t.passed || t.actualTime);
      const lastPoint = confirmed.length > 0 ? confirmed[confirmed.length - 1] : data.timeline[data.timeline.length - 1];
      if (lastPoint) {
        lastSt = lastPoint.station || lastPoint.name;
        lastTm = lastPoint.actualTime || lastPoint.time || lastPoint.departureTime || lastPoint.arrivalTime;
      }
    }

    return {
      scheduleId: data.scheduleId || data.id,
      orderId: data.orderId,
      trainOrderId: data.trainOrderId,
      destination: data.destination || data.direction,
      lastConfirmedStation: lastSt,
      lastConfirmedTime: lastTm,
      delay: data.delay ?? 0,
      isFinished: data.isFinished ?? true
    };
  } catch (e) {
    return null;
  }
}

function extractCourseParams(row) {
  if (!row) return '';
  const sid = row.scheduleId || row.id || '';
  const oid = row.orderId || '';
  const toid = row.trainOrderId || '';
  
  let params = [];
  if (sid) params.push(`scheduleId=${encodeURIComponent(sid)}`);
  if (oid) params.push(`orderId=${encodeURIComponent(oid)}`);
  if (toid) params.push(`trainOrderId=${encodeURIComponent(toid)}`);
  
  return params.join('&');
}

function extractLastStation(row) {
  if (!row) return null;
  const st = row.lastConfirmedStation || row.lastStation || row.lastLocation;
  const tm = row.lastConfirmedTime || row.lastTime || row.arrivalTime;
  if (st) {
    return tm ? `${st} (${tm})` : st;
  }
  return null;
}

function getDelay(row) {
  if (!row) return null;
  const val = row.delay ?? row.delayMinutes ?? row.delayInMinutes;
  return val !== undefined && val !== null ? Number(val) : 0;
}

function moveTrain(e, index, direction) {
  e.stopPropagation();
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= currentTrains.length) return;
  const item = currentTrains.splice(index, 1)[0];
  currentTrains.splice(newIndex, 0, item);
  saveTrains(currentTrains);
  init();
}

function deleteTrain(e, index) {
  e.stopPropagation();
  if (confirm('Czy na pewno usunąć ten pociąg z listy?')) {
    currentTrains.splice(index, 1);
    saveTrains(currentTrains);
    init();
  }
}

function goDetails(station, number, courseQuery) {
  let url = `/train?train=${encodeURIComponent(number)}&station=${encodeURIComponent(station)}`;
  if (courseQuery) {
    url += `&${courseQuery}`;
  }
  window.location.href = url;
}


    function getAdjustedTime(timeStr, delayMinutes) {
      if (!timeStr || !delayMinutes || isNaN(delayMinutes)) return null;
      const parts = timeStr.split(":");
      if (parts.length < 2) return null;
      const d = new Date();
      d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10) + parseInt(delayMinutes, 10), 0, 0);
      const h = String(d.getHours()).padStart(2, "0");
      const m = String(d.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }
  
function renderCard(item, index, row) {
  const isLoaded = Boolean(row);

  // Pobieranie tablicy przystanków z dowolego zagnieżdżenia
  const rawStops = row ? (row.stops || row.route || (row.data && (row.data.stops || row.data.route)) || []) : [];
  const lastStop = Array.isArray(rawStops) && rawStops.length > 0 ? rawStops[rawStops.length - 1] : null;

  // Stacja docelowa
  let destStation = row ? (row.destination || row.to || row.destinationName || row.endStation || "") : "";
  if (!destStation && lastStop) {
    destStation = typeof lastStop === 'string' ? lastStop : (lastStop.stationName || lastStop.station || lastStop.name || lastStop.stopName || "");
  }

  // Czas przybycia na ostatnią stację
  let endFormattedTime = "";
  if (lastStop && typeof lastStop === 'object') {
    endFormattedTime = lastStop.arrReal || lastStop.actualTime || lastStop.arrTime || lastStop.arrivalTime || lastStop.arrPlan || lastStop.plannedTime || lastStop.time || lastStop.scheduleArrivalTime || "";
  }

  // Weryfikacja opóźnienia z uwzględnieniem ostatniego przystanku
  let delay = getDelay(row);
  if ((delay === null || delay === 0) && lastStop && typeof lastStop === 'object') {
    if (lastStop.delay !== undefined && lastStop.delay !== null && parseInt(lastStop.delay, 10) > 0) {
      delay = parseInt(lastStop.delay, 10);
    } else if (lastStop.arrReal && lastStop.arrPlan) {
      const [rH, rM] = lastStop.arrReal.split(':').map(Number);
      const [pH, pM] = lastStop.arrPlan.split(':').map(Number);
      if (!isNaN(rH) && !isNaN(pH)) {
        const diff = (rH * 60 + rM) - (pH * 60 + pM);
        if (diff > 0) delay = diff;
      }
    }
  }

  const isDelayed = delay !== null && delay > 0;
  const isFinished = row && (row.isFinished || row.status === "FINISHED" || row.status === "COMPLETED");
  const lastLoc = extractLastStation(row);

  let statusText = "⏳ Pobieranie danych...";
  if (isLoaded) {
    if (isFinished) {
      const destText = destStation ? ` w ${destStation}` : "";
      const timeText = endFormattedTime ? ` o ${endFormattedTime}` : "";
      statusText = `🏁 Pociąg skończył bieg${destText}${timeText}`;
    } else if (lastLoc) {
      const destText = destStation ? ` ➔ ${destStation}` : "";
      statusText = `📍 Ostatnio: ${lastLoc}${destText}`;
    } else {
      statusText = `Planowany odjazd: ${item.planTime || "--:--"}`;
    }
  }

  // Wyliczanie godzin
  const adjustedTime = isDelayed ? getAdjustedTime(item.planTime, delay) : null;
  const delayBadge = isDelayed ? `+${delay} min` : "0 min";

  let timeHtml = "";
  if (isDelayed && adjustedTime) {
    timeHtml = `
      <div style="font-size:1.4rem; font-weight:800; color:#ff6b6b; line-height:1.2;">${adjustedTime}</div>
      <div style="font-size:1.4rem; font-weight:800; color:#ff6b6b; margin-top:2px; line-height:1.2;">${delayBadge}</div>
      <div style="font-size:0.85rem; color:#888888; margin-top:4px; text-decoration:line-through;">plan. ${item.planTime || "--:--"}</div>
    `;
  } else {
    timeHtml = `
      <div style="font-size:1.4rem; font-weight:800; color:#51cf66; line-height:1.2;">${item.planTime || "--:--"}</div>
      <div style="font-size:1.1rem; font-weight:700; color:#51cf66; margin-top:2px;">${delayBadge}</div>
    `;
  }

  // Budowanie linku /train
  const cleanTrainNo = String(item.trainNum || '').replace(/\D+/g, '');
  const params = new URLSearchParams();
  params.set('train', cleanTrainNo || item.trainNum);

  if (row) {
    if (row.category) params.set('category', row.category);
    if (row.name) params.set('name', row.name);
    if (destStation || row.destination) params.set('destination', destStation || row.destination);
    if (row.date) params.set('date', row.date);
    
    const schedId = row.scheduleId || row.scheduledId || row.id;
    if (schedId) {
      params.set('scheduleId', schedId);
      params.set('scheduledId', schedId);
    }
    
    const ordId = row.orderId || row.trainOrderId || row.trainOrder;
    if (ordId) {
      params.set('orderId', ordId);
      params.set('trainOrderId', ordId);
    }
    
    if (row.stationId) params.set('stationId', row.stationId);
  }

  params.set('station', item.station);

  const detailsUrl = `/train?${params.toString()}`;

  const cardOpacity = isLoaded ? "1" : "0.65";
  const cardBg = isLoaded ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.02)";

  return `
    <div class="card" onclick="window.location.href='${detailsUrl}'" style="display:flex; align-items:center; justify-content:space-between; padding:14px; border-bottom:1px solid #333; cursor:pointer; background:${cardBg}; opacity:${cardOpacity}; margin-bottom:8px; border-radius:8px; transition: all 0.3s ease;">
      <div style="text-align:center; min-width:95px; padding-right:12px; border-right:1px solid rgba(255,255,255,0.1);">
        ${timeHtml}
      </div>

      <div style="flex:1; padding-left:15px;">
        <div style="font-weight:bold; font-size:1.25rem; color:#ffffff;">#${item.trainNum}</div>
        <div style="color:#f0f0f0; font-size:1.05rem; font-weight:600; margin-top:2px;">${item.station}</div>
        <div style="font-size:0.95rem; color:${isLoaded ? '#cccccc' : '#e0a82e'}; font-weight:500; margin-top:4px;">${statusText}</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;" onclick="event.stopPropagation();">
        <button onclick="moveTrain(${index}, -1)" style="padding:4px 8px; background:#2b2b2b; color:#fff; border:1px solid #444; border-radius:4px; cursor:pointer;">▲</button>
        <button onclick="moveTrain(${index}, 1)" style="padding:4px 8px; background:#2b2b2b; color:#fff; border:1px solid #444; border-radius:4px; cursor:pointer;">▼</button>
        <button onclick="removeTrain(${index})" style="padding:4px 8px; background:#2b2b2b; color:#ff6b6b; border:1px solid #444; border-radius:4px; cursor:pointer;">✕</button>
      </div>
    </div>
  `;
}
async function init() {
  const container = document.getElementById('list');
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;

  container.innerHTML = currentTrains.map((item, idx) => renderCard(item, idx, null)).join('');

  const stationMap = new Map();
  const stations = [...new Set(currentTrains.map(t => t.station))];

  for (const st of stations) {
    stationMap.set(st, await fetchStationDepartures(st));
  }

  const cardsPromises = currentTrains.map(async (item, idx) => {
    const departures = stationMap.get(item.station) || [];
    let matchedRow = departures.find(d => {
      const dNum = String(d.train || d.trainNumber || d.number || '').replace(/\D/g, '');
      const targetNum = String(item.trainNum).replace(/\D/g, '');
      return dNum && targetNum && dNum === targetNum;
    });

    // Pełne zapytanie po numerze pociągu dla pociągów poza aktywnego okna tablicy stacyjnej
    if (!matchedRow) {
      matchedRow = await fetchTrainByNumber(item.trainNum, item.station);
    }

    return renderCard(item, idx, matchedRow);
  });

  const cardsHtml = await Promise.all(cardsPromises);
  container.innerHTML = cardsHtml.join('');
  refreshBtn.disabled = false;
}

document.getElementById('addTrainForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const st = document.getElementById('addStation').value.trim();
  const num = document.getElementById('addTrainNum').value.trim();
  const tm = document.getElementById('addPlanTime').value.trim();

  if (st && num) {
    currentTrains.push({ station: st, trainNum: num, planTime: tm || '--:--' });
    saveTrains(currentTrains);
    document.getElementById('addTrainForm').reset();
    init();
  }
});

document.getElementById('refreshBtn').addEventListener('click', init);
init();
</script>
</body>
</html>
