<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Moje Pociągi V2">
  <title>Moje Pociągi V2 - Tablica PLK</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #f8fafc;
      padding: 16px 12px 80px 12px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: #ffffff;
    }
    .version-badge {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .nav-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      background: #111827;
      color: #38bdf8;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      border: 1px solid #1f2937;
    }
    .btn:hover { background: #1f2937; }
    
    .btn-action {
      padding: 8px 14px;
      border-radius: 8px;
      border: 0;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      background: #0284c7;
    }
    .add-panel {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .add-panel h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: #ffffff;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
    }
    .form-grid input {
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #27272a;
      background: #000000;
      color: #ffffff;
      font-size: 13px;
    }
    .api-panel {
      margin-top: 16px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
    }
    .api-panel h2 { text-align: center; margin: 0 0 6px 0; font-size: 1.4rem; color: #ffffff; }
    .api-meta { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      background: #111827;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      border-bottom: 2px solid #1f2937;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #18181b;
      font-size: 13px;
      vertical-align: top;
      background: #000000;
    }
    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    tr.clickable-row:hover td {
      background: #18181b !important;
    }
    tr:nth-child(even) td { background: #09090b; }
    .time-real { font-weight: 800; font-size: 15px; color: #4ade80; }
    .ontime { color: #4ade80; font-weight: 700; }
    .delay, .time-delay-low { color: #facc15; font-weight: 700; }
    .delay-mid, .time-delay-mid { color: #f87171; font-weight: 700; }
    .delay-high, .time-delay-high { color: #c084fc; font-weight: 700; }
    .train-main, .direction-main { font-weight: 700; color: #ffffff; text-decoration: none; }
    .train-name, .direction-via { color: #94a3b8; font-size: 12px; margin-top: 2px; line-height: 1.25; }
    .muted { color: #64748b; font-size: 12px; }
    .mobile-only { display: none; }
    @media(max-width:700px) {
      .desktop-cell { display: none !important; }
      .mobile-only { display: table-cell !important; width: 100%; }
      th { font-size: 12px; padding: 8px; }
      td { padding: 8px; }
      .mobile-layout { display: grid; grid-template-columns: 70px 90px 1fr 45px; gap: 6px; align-items: start; }
      .mobile-time .time-real { font-size: 16px; line-height: 1.1; }
      .mobile-train .train-main { font-size: 14px; }
      .mobile-direction .direction-main { font-size: 14px; }
      .mobile-side { text-align: center; }
      .mobile-platform { font-size: 16px; font-weight: 700; color: #ffffff; }
      .mobile-track { font-size: 11px; color: #94a3b8; }
    }
    .btn-del {
      background: #7f1d1d;
      color: #fecaca;
      border: 0;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 11px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🖥️ Tablica Monitorowania <span class="version-badge">v. 0.99.5</span></h1>

  <div class="nav-row">
    <a class="btn" href="/">⬅ Strona Główna Tablicy</a>
    <button class="btn-action" onclick="refreshAll()">🔄 Odśwież dane z API</button>
    <button class="btn" style="color: #f87171;" onclick="resetList()">⚠️ Przywróć Domyślne</button>
  </div>

  <div class="add-panel">
    <h3>⊕ DODAJ POCIĄG I STACJĘ DO ŚLEDZENIA</h3>
    <div class="form-grid">
      <input id="addStation" type="text" placeholder="Stacja (np. Kielce Główne)" />
      <input id="addTrainNum" type="text" placeholder="Numer pociągu (np. 6206 lub 63552)" />
      <button class="btn-action" onclick="addTrackedTrain()">+ Dodaj do listy</button>
    </div>
  </div>

  <div id="apiPanel" class="api-panel">
    <h2>Tablica Śledzonych Pociągów</h2>
    <div id="apiMeta" class="api-meta">Ładowanie odjazdów z API PLK...</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 14%;">Godz.</th>
            <th style="width: 18%;">Pociąg</th>
            <th style="width: 55%;">Kierunek / przez</th>
            <th style="width: 4%; text-align:center;">Per.</th>
            <th style="width: 4%; text-align:center;">Tor</th>
            <th style="width: 5%;"></th>
          </tr>
        </thead>
        <tbody id="trackedDeparturesBody">
          <tr><td colspan="6" class="muted" style="text-align:center;">Pobieranie danych z API PLK...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const TRACKED_KEY = 'myTrackedTrainsV2_musthave_v1';

const DEFAULT_TRACKED = [
  { station: 'Katowice', trainNum: '3815' },
  { station: 'Bytom Karb', trainNum: '40360' },
  { station: 'Katowice', trainNum: '38107' },
  { station: 'Katowice', trainNum: '40621' },
  { station: 'Katowice', trainNum: '63102' },
  { station: 'Tarnowskie Góry', trainNum: '40450' },
  { station: 'Miasteczko Śląskie', trainNum: '44226' },
  { station: 'Tarnowskie Góry', trainNum: '40250' },
  { station: 'Chorzów Batory', trainNum: '40858' },
  { station: 'Chorzów Batory', trainNum: '40423' },
  { station: 'Chorzów Batory', trainNum: '40211' },
  { station: 'Chorzów Batory', trainNum: '40468' }
];

document.addEventListener('DOMContentLoaded', () => {
  refreshAll();
});

function getTrackedList() {
  try {
    const data = localStorage.getItem(TRACKED_KEY);
    return data ? JSON.parse(data) : DEFAULT_TRACKED;
  } catch {
    return DEFAULT_TRACKED;
  }
}

function saveTrackedList(list) {
  localStorage.setItem(TRACKED_KEY, JSON.stringify(list));
}

function resetList() {
  localStorage.removeItem(TRACKED_KEY);
  refreshAll();
}

function addTrackedTrain() {
  const station = document.getElementById('addStation').value.trim();
  const trainNum = document.getElementById('addTrainNum').value.trim();
  if (!station && !trainNum) { alert('Podaj stację lub numer pociągu!'); return; }

  const list = getTrackedList();
  list.push({ station, trainNum });
  saveTrackedList(list);

  document.getElementById('addStation').value = '';
  document.getElementById('addTrainNum').value = '';
  refreshAll();
}

function removeTrackedTrain(event, index) {
  event.stopPropagation();
  const list = getTrackedList();
  list.splice(index, 1);
  saveTrackedList(list);
  refreshAll();
}

function goToDetail(station, trainNo, orderId) {
  const params = new URLSearchParams({ station: station || '', train: trainNo || '' });
  if (orderId) params.append('orderId', orderId);
  window.location.href = `/train?${params.toString()}`;
}

async function refreshAll() {
  const list = getTrackedList();
  const tbody = document.getElementById('trackedDeparturesBody');
  const apiMeta = document.getElementById('apiMeta');

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;">Brak zdefiniowanych pozycji. Dodaj nową powyżej!</td></tr>';
    apiMeta.textContent = 'Brak śledzonych pozycji.';
    return;
  }

  tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;">Pobieranie danych z API PLK...</td></tr>';
  apiMeta.textContent = `Aktualizacja danych dla ${list.length} pozycji...`;

  const fetchPromises = list.map(async (item, i) => {
    try {
      const ts = Date.now();
      const params = new URLSearchParams({ 
        station: item.station || '', 
        limit: '200',
        _t: ts
      });
      
      const res = await fetch('/api/departures?' + params.toString(), { 
        headers: { Accept: 'application/json' } 
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const dataDep = await res.json();
      const depList = Array.isArray(dataDep.departures) ? dataDep.departures : [];

      let filtered = [];
      if (item.trainNum) {
        const queryNum = String(item.trainNum).trim().toLowerCase();
        filtered = depList.filter(d => {
          const t1 = String(d.train || '').toLowerCase();
          const t2 = String(d.number || d.trainNumber || '').toLowerCase();
          const t3 = String(d.id || d.orderId || '').toLowerCase();
          const t4 = String(d.name || '').toLowerCase();
          return t1.includes(queryNum) || t2.includes(queryNum) || t3.includes(queryNum) || t4.includes(queryNum);
        });
      } else {
        filtered = depList.slice(0, 5);
      }

      if (filtered.length > 0) {
        return filtered.map(d => ({ ...d, _itemIndex: i, _stationSource: item.station }));
      } else {
        return [{
          _itemIndex: i,
          _stationSource: item.station,
          _noData: true,
          train: item.trainNum,
          time: '--:--',
          plannedTime: '--:--',
          destination: 'Brak aktywnego odjazdu na stacji (sprawdź bieg)',
          platform: '-',
          track: '-'
        }];
      }
    } catch (err) {
      console.error('Błąd API dla stacji:', item.station, err);
      return [{
        _itemIndex: i,
        _stationSource: item.station,
        _noData: true,
        train: item.trainNum,
        time: '--:--',
        plannedTime: '--:--',
        destination: 'Błąd połączenia z API',
        platform: '-',
        track: '-'
      }];
    }
  });

  const resultsNested = await Promise.all(fetchPromises);
  const allResults = resultsNested.flat();

  apiMeta.textContent = `Ostatnia synchronizacja: ${new Date().toLocaleTimeString('pl-PL')}`;
  renderTrackedTable(allResults);
}

function renderTrackedTable(deps) {
  const tbody = document.getElementById('trackedDeparturesBody');
  if (!deps.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center;">Brak pasujących pociągów na stacjach w tym momencie.</td></tr>';
    return;
  }

  tbody.innerHTML = deps.map(d => {
    if (d._noData) {
      return `<tr class="clickable-row" onclick="goToDetail('${escapeHtml(d._stationSource)}', '${escapeHtml(d.train || '')}', '')">
        <td class="desktop-cell"><div class="muted">--:--</div></td>
        <td class="desktop-cell"><div class="train-main">#${escapeHtml(d.train)}</div></td>
        <td class="desktop-cell"><div class="direction-main">${escapeHtml(d.destination)}</div><div class="direction-via">Stacja: ${escapeHtml(d._stationSource || 'Brak')}</div></td>
        <td class="desktop-cell" style="text-align:center;">-</td>
        <td class="desktop-cell" style="text-align:center;">-</td>
        <td class="desktop-cell" style="text-align:center;">
          <button class="btn-del" onclick="removeTrackedTrain(event, ${d._itemIndex})" title="Usuń z listy">🗑️</button>
        </td>
        <td class="mobile-only">
          <div class="mobile-layout">
            <div class="mobile-time"><div class="muted">--:--</div></div>
            <div class="mobile-train"><div class="train-main">#${escapeHtml(d.train)}</div></div>
            <div class="mobile-direction"><div class="direction-main">${escapeHtml(d.destination)}</div><div class="direction-via">Stacja: ${escapeHtml(d._stationSource || 'Brak')}</div></div>
            <div class="mobile-side"><div class="mobile-platform">-</div><div class="mobile-track">-</div></div>
          </div>
        </td>
      </tr>`;
    }

    const delay = Number(d.delay || 0);
    const tc = getTimeDelayClass(delay);
    const tr = [d.category, d.train].filter(Boolean).join(' ');
    const dest = d.destination || d.finalDestination || 'brak kierunku';
    const via = d.via ? `przez: ${d.via}` : `Stacja: ${d._stationSource}`;
    const cancelled = d.statusCode === 'X';
    const delayText = cancelled ? 'ODWOŁANY' : (delay > 0 ? '+' + delay + ' min' : '0');
    const orderId = d.orderId || d.trainOrderId || d.id || '';

    return `<tr class="clickable-row" onclick="goToDetail('${escapeHtml(d._stationSource)}', '${escapeHtml(d.train || '')}', '${escapeHtml(orderId)}')">
      <td class="desktop-cell">
        <div class="time-real ${tc}">${escapeHtml(shortTime(d.time))}</div>
        <div class="muted">${escapeHtml(shortTime(d.plannedTime))}</div>
        <div class="muted">${escapeHtml(delayText)}</div>
      </td>
      <td class="desktop-cell">
        <div class="train-main">${escapeHtml(tr)}</div>
        <div class="train-name">${escapeHtml(d.name || '')}</div>
      </td>
      <td class="desktop-cell">
        <div class="direction-main">${escapeHtml(dest)}</div>
        <div class="direction-via">${escapeHtml(via)}</div>
      </td>
      <td class="desktop-cell" style="text-align:center;">${escapeHtml(d.platform || '')}</td>
      <td class="desktop-cell" style="text-align:center;">${escapeHtml(d.track || '')}</td>
      <td class="desktop-cell" style="text-align:center;">
        <button class="btn-del" onclick="removeTrackedTrain(event, ${d._itemIndex})" title="Usuń z listy">🗑️</button>
      </td>
      <td class="mobile-only">
        <div class="mobile-layout">
          <div class="mobile-time">
            <div class="time-real ${tc}">${escapeHtml(shortTime(d.time))}</div>
            <div class="muted">${escapeHtml(delayText)}</div>
          </div>
          <div class="mobile-train">
            <div class="train-main">${escapeHtml(tr)}</div>
            <div class="train-name">${escapeHtml(d.name || '')}</div>
          </div>
          <div class="mobile-direction">
            <div class="direction-main">${escapeHtml(dest)}</div>
            <div class="direction-via">${escapeHtml(via)}</div>
          </div>
          <div class="mobile-side">
            <div class="mobile-platform">${escapeHtml(d.platform || '')}</div>
            <div class="mobile-track">${escapeHtml(d.track || '')}</div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function getTimeDelayClass(d) { return d >= 20 ? 'time-delay-high' : d > 10 ? 'time-delay-mid' : d >= 5 ? 'time-delay-low' : 'ontime'; }
function shortTime(v) { if (!v) return ''; const m = String(v).match(/(\d{2}:\d{2})/); return m ? m[1] : v; }
function escapeHtml(v) { return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'); }
</script>
</body>
</html>
