<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Moje Pociągi V2</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2b;
  --border:#263653;
  --text:#f4f7fb;
  --muted:#91a0b7;
  --cyan:#22d3ee;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#fb7185;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

.app{
  width:min(100%,700px);
  margin:0 auto;
  padding:12px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0 16px;
}

h1{
  margin:0;
  font-size:20px;
}

.refresh{
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--cyan);
  font-weight:700;
  cursor:pointer;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:12px;
  align-items:center;
}

.time-box{
  text-align:center;
  background:#0b1220;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--border);
}

.plan-time{
  font-size:14px;
  font-weight:800;
  color:var(--text);
}

.delay-tag{
  font-size:11px;
  font-weight:700;
  margin-top:2px;
}

.delay-tag.ok{ color:var(--green); }
.delay-tag.bad{ color:var(--red); }

.info-box{
  min-width:0;
}

.train-num{
  font-size:16px;
  font-weight:900;
  color:var(--cyan);
}

.station-name{
  font-size:13px;
  color:var(--muted);
  margin-top:2px;
}

.status-text{
  font-size:11px;
  color:var(--text);
  margin-top:4px;
}

.btn-open{
  border:0;
  background:rgba(34,211,238,.12);
  color:var(--cyan);
  font-weight:800;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>🚆 Moje Pociągi</h1>
  </div>
  <button class="refresh" id="refreshBtn">↻ ODŚWIEŻ</button>
</header>

<main id="list" class="list"></main>

</div>

<script>
const TARGET_TRAINS = [
  { station: 'Miasteczko Śląskie', trainNum: '44226', planTime: '04:59' },
  { station: 'Tarnowskie Góry', trainNum: '40450', planTime: '05:21' },
  { station: 'Chorzów Batory', trainNum: '40658', planTime: '06:07' },
  { station: 'Tarnowskie Góry', trainNum: '40250', planTime: '05:46' },
  { station: 'Chorzów Batory', trainNum: '40660', planTime: '06:32' },
  { station: 'Katowice', trainNum: '40921', planTime: '14:59' },
  { station: 'Katowice', trainNum: '40621', planTime: '15:35' },
  { station: 'Chorzów Batory', trainNum: '40423', planTime: '15:12' },
  { station: 'Chorzów Batory', trainNum: '40425', planTime: '16:06' },
  { station: 'Katowice', trainNum: '8330', planTime: '10:20' },
  { station: 'Katowice', trainNum: '3815', planTime: '14:40' }
];

async function fetchStationDepartures(station) {
  try {
    const res = await fetch('/api/departures?station=' + encodeURIComponent(station) + '&limit=300', { cache: 'no-store' });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.departures) ? data.departures : [];
  } catch (e) {
    return [];
  }
}

function getDelay(row) {
  if (!row) return null;
  const val = row.delayMinutes ?? row.delay ?? row.delayInMinutes;
  return val !== undefined && val !== null ? Number(val) : 0;
}

function renderCard(item, row) {
  const delay = getDelay(row);
  const isDelayed = delay !== null && delay > 0;

  return `
    <div class="card">
      <div class="time-box">
        <div class="plan-time">${item.planTime}</div>
        <div class="delay-tag ${isDelayed ? 'bad' : 'ok'}">
          ${delay === null ? 'BRAK' : (isDelayed ? '+' + delay + ' min' : '0 min')}
        </div>
      </div>
      <div class="info-box">
        <div class="train-num">#${item.trainNum}</div>
        <div class="station-name">📍 ${item.station}</div>
        <div class="status-text">${row ? (row.destination ? 'Kierunek: ' + row.destination : 'Dane pobrane z PLK') : 'Brak aktywnego kursu'}</div>
      </div>
      <button class="btn-open" onclick="goDetails('${item.station}', '${item.trainNum}')">TRASA</button>
    </div>
  `;
}

function goDetails(station, number) {
  window.location.href = `/train?train=${number}&station=${encodeURIComponent(station)}`;
}

async function init() {
  const container = document.getElementById('list');
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;

  container.innerHTML = TARGET_TRAINS.map(item => renderCard(item, null)).join('');

  const stationMap = new Map();
  const stations = [...new Set(TARGET_TRAINS.map(t => t.station))];

  for (const st of stations) {
    stationMap.set(st, await fetchStationDepartures(st));
  }

  const html = TARGET_TRAINS.map(item => {
    const departures = stationMap.get(item.station) || [];
    const matchedRow = departures.find(d => String(d.trainNumber || d.trainNo || d.number || d.train) === String(item.trainNum));
    return renderCard(item, matchedRow);
  }).join('');

  container.innerHTML = html;
  refreshBtn.disabled = false;
}

document.getElementById('refreshBtn').addEventListener('click', init);
init();
</script>
</body>
</html>
