<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bieg Pociągu</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --panel-bg: #111827;
            --panel-border: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; font-size: 14px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border); }
        h1 { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .btn-back { background: #1f293d; border: 1px solid #374151; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 700; }

        .train-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        .train-no { font-size: 1.3rem; font-weight: 900; color: #60a5fa; }
        .train-route { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 4px; }
        
        .last-report-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent-blue); color: #93c5fd; padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-weight: 700; font-size: 0.85rem; }

        .timeline { position: relative; padding-left: 20px; margin-top: 20px; border-left: 2px solid var(--panel-border); }
        .station-row { position: relative; padding: 10px 0 10px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .station-row::before { content: ''; position: absolute; left: -26px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel-border); }
        
        .station-row.passed::before { background: var(--accent-blue); }
        .station-row.current::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        
        .station-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .station-times { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; display: flex; gap: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>ℹ️ Bieg pociągu <span id="trainTitleHeader"></span></h1>
        <a href="index.html" class="btn-back">← Tablica</a>
    </header>

    <div class="train-card" id="trainCard">
        <div class="train-no" id="trainNumber">Ładowanie...</div>
        <div class="train-route" id="trainRoute"></div>
        <div class="last-report-badge" id="lastReport">📍 Pobieranie pozycji pociągu...</div>
    </div>

    <div class="timeline" id="timelineContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trainNo = urlParams.get('train');
        const queryStation = urlParams.get('station');

        async function loadTrainSchedule() {
            if (!trainNo) {
                document.getElementById('trainNumber').innerText = "Brak numeru pociągu";
                return;
            }

            document.getElementById('trainNumber').innerText = "Pociąg " + trainNo;

            try {
                // Dynamiczny strzał do backendu API po pełną trasę
                const res = await fetch(`/api/departures?train=${encodeURIComponent(trainNo)}&station=${encodeURIComponent(queryStation || '')}`);
                const data = await res.json();
                
                // Jeśli API zwraca pełną listę stacji dla pociągu:
                const stations = data.stations || data.stops || [];
                const info = data.info || {};

                if (info.origin && info.destination) {
                    document.getElementById('trainRoute').innerText = `${info.origin} ➔ ${info.destination}`;
                }
                
                if (info.lastStation) {
                    document.getElementById('lastReport').innerHTML = `📍 Ostatnie potwierdzenie: <b>${info.lastStation}</b> ${info.lastTime ? '(' + info.lastTime + ')' : ''}`;
                } else {
                    document.getElementById('lastReport').style.display = 'none';
                }

                if (stations.length === 0) {
                    document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--text-muted)">Brak szczegółowego rozkładu dla tego połączenia.</div>';
                    return;
                }

                document.getElementById('timelineContainer').innerHTML = stations.map(s => `
                    <div class="station-row ${s.passed ? 'passed' : s.isCurrent ? 'current' : ''}">
                        <div class="station-name">${s.name}</div>
                        <div class="station-times">
                            <span>Plan: <b>${s.plannedTime || '--:--'}</b></span>
                            <span>Wyjazd/Przyjazd: <b>${s.actualTime || s.plannedTime || '--:--'}</b></span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--accent-red)">Błąd ładowania szczegółów tras.</div>';
            }
        }

        loadTrainSchedule();
    </script>
</body>
</html>
