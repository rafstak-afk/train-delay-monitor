<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bieg Pociągu</title>
    <style>
        :root {
            --bg-main: #101820;
            --panel-bg: #102235;
            --panel-border: #31516f;
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --accent-green: #5dd39e;
            --accent-blue: #38bdf8;
            --accent-red: #ff6b6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; font-size: 15px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border); }
        h1 { font-size: 1.3rem; font-weight: 900; }
        .btn-back { background: #0b57d0; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 900; }

        .train-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .train-no { font-size: 1.4rem; font-weight: 900; color: var(--accent-blue); }
        .train-route { font-size: 1rem; font-weight: 800; color: #fff; }
        
        .delay-banner { background: rgba(255, 107, 107, 0.2); border: 1px solid var(--accent-red); color: #ff9999; padding: 8px 12px; border-radius: 8px; font-weight: 900; font-size: 14px; }
        .last-report-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-blue); color: #e0f2fe; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }

        .timeline { position: relative; padding-left: 24px; margin-top: 20px; border-left: 3px solid var(--panel-border); }
        .station-row { position: relative; padding: 12px 0 12px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .station-row::before { content: ''; position: absolute; left: -31px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel-border); }
        
        .station-row.passed::before { background: var(--accent-blue); }
        .station-row.current::before { background: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        
        .station-name { font-size: 1rem; font-weight: 800; color: #fff; }
        .station-times { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; display: flex; gap: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>ℹ️ Bieg pociągu <span id="trainTitleHeader"></span></h1>
        <a href="index.html" class="btn-back">← Tablica</a>
    </header>

    <div class="train-card" id="trainCard">
        <div class="train-no" id="trainNumber">Pobieranie...</div>
        <div class="train-route" id="trainRoute"></div>
        <div id="delayBannerContainer"></div>
        <div class="last-report-badge" id="lastReport">📍 Pobieranie pozycji...</div>
    </div>

    <div class="timeline" id="timelineContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trainNo = urlParams.get('train');

        async function loadTrainSchedule() {
            if (!trainNo) {
                document.getElementById('trainNumber').innerText = "Brak numeru pociągu";
                return;
            }

            document.getElementById('trainTitleHeader').innerText = trainNo;

            try {
                const res = await fetch(`/api/monitored-trains-v2?train=${encodeURIComponent(trainNo)}`);
                const data = await res.json();
                
                const info = data.info || {};
                const stops = data.stops || [];

                document.getElementById('trainNumber').innerText = `${info.category} ${info.name ? info.name + ' ' : ''}${trainNo}`;
                document.getElementById('trainRoute').innerText = `Z: ${info.origin} ➔ Do: ${info.destination}`;
                
                if (info.delay > 0) {
                    document.getElementById('delayBannerContainer').innerHTML = `
                        <div class="delay-banner">⚠️ POCIĄG OPÓŹNIONY O +${info.delay} MINUT</div>
                    `;
                }

                document.getElementById('lastReport').innerHTML = `📍 Ostatnia potwierdzona stacja: <b>${info.lastStation}</b> (${info.lastTime})`;

                if (stops.length === 0) {
                    document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--text-muted); padding:10px;">Brak danych trasy dla tego pociągu.</div>';
                    return;
                }

                document.getElementById('timelineContainer').innerHTML = stops.map(s => `
                    <div class="station-row ${s.passed ? 'passed' : s.isCurrent ? 'current' : ''}">
                        <div class="station-name">${s.name}</div>
                        <div class="station-times">
                            <span>Status: <b>${s.passed ? 'Minęły' : s.isCurrent ? 'Na stacji / Wjazd' : 'Planowany'}</b></span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--accent-red); padding:10px;">Błąd pobierania trasy z serwera.</div>';
            }
        }

        loadTrainSchedule();
    </script>
</body>
</html>
