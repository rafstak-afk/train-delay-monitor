<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bieg Pociągu - Szczegóły</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --panel-bg: #111827;
            --panel-border: #1f293d;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; max-width: 800px; margin: 0 auto; font-size: 14px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border); }
        h1 { font-size: 1.3rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .btn-back { background: #1f293d; border: 1px solid #374151; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem; }
        .btn-back:hover { background: #374151; }

        .train-summary { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .train-badge { background: #7c2d12; color: #fdba74; font-weight: 800; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin-right: 8px; }
        .train-title { font-size: 1.2rem; font-weight: 800; color: #fff; }
        .delay-status { padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; }
        .delay-status.ok { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .delay-status.delayed { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .timeline { position: relative; padding-left: 20px; margin-top: 20px; border-left: 2px solid var(--panel-border); }
        .station-row { position: relative; padding: 12px 0 12px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .station-row::before { content: ''; position: absolute; left: -27px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel-border); border: 2px solid var(--bg-main); }
        .station-row.passed::before { background: var(--accent-blue); }
        .station-row.current::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        
        .station-name { font-size: 1rem; font-weight: 700; color: #fff; }
        .station-times { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; display: flex; gap: 16px; }
        .platform-info { font-size: 0.8rem; color: #60a5fa; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <h1>ℹ️ Bieg pociągu</h1>
        <a href="index.html" class="btn-back">← Tablica</a>
    </header>

    <div class="train-summary">
        <div>
            <div><span class="train-badge">IC 3815</span><span class="train-title">MATEJKO</span></div>
            <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Katowice → Szczecin Główny</div>
        </div>
        <div class="delay-status ok">W planie (0 min)</div>
    </div>

    <div class="timeline" id="timelineContainer">
        <!-- Stacje wygenerowane dynamicznie -->
    </div>

    <script>
        const stations = [
            { name: "Katowice", time: "14:49", actual: "14:49", platform: "1/9", status: "passed" },
            { name: "Zabrze", time: "15:04", actual: "15:04", platform: "1/1", status: "passed" },
            { name: "Gliwice", time: "15:13", actual: "15:13", platform: "2/3", status: "current" },
            { name: "Kędzierzyn-Koźle", time: "15:38", actual: "15:38", platform: "1/2", status: "future" },
            { name: "Opole Główny", time: "16:05", actual: "16:05", platform: "3/1", status: "future" },
            { name: "Brzeg", time: "16:28", actual: "16:28", platform: "1/1", status: "future" },
            { name: "Oława", time: "16:40", actual: "16:40", platform: "2/1", status: "future" },
            { name: "Wrocław Główny", time: "17:02", actual: "17:05", platform: "4/8", status: "future" },
            { name: "Legnica", time: "17:48", actual: "17:48", platform: "2/1", status: "future" },
            { name: "Lubin", time: "18:05", actual: "18:05", platform: "1/2", status: "future" },
            { name: "Głogów", time: "18:32", actual: "18:32", platform: "2/2", status: "future" },
            { name: "Zielona Góra Główna", time: "19:15", actual: "19:15", platform: "1/1", status: "future" },
            { name: "Świebodzin", time: "19:42", actual: "19:42", platform: "1/2", status: "future" },
            { name: "Zbąszynek", time: "19:55", actual: "19:55", platform: "3/1", status: "future" },
            { name: "Rzepin", time: "20:25", actual: "20:25", platform: "2/1", status: "future" },
            { name: "Kostrzyn", time: "20:50", actual: "20:50", platform: "1/1", status: "future" },
            { name: "Gryfino", time: "21:35", actual: "21:35", platform: "1/2", status: "future" },
            { name: "Szczecin Główny", time: "21:54", actual: "21:54", platform: "3/1", status: "future" }
        ];

        const container = document.getElementById('timelineContainer');
        container.innerHTML = stations.map(s => `
            <div class="station-row ${s.status}">
                <div class="station-name">${s.name}</div>
                <div class="station-times">
                    <span>Plan: <b>${s.time}</b></span>
                    <span>Wyjazd/Przyjazd: <b>${s.actual}</b></span>
                </div>
                <div class="platform-info">Peron ${s.platform.split('/')[0]}, tor ${s.platform.split('/')[1] || '1'}</div>
            </div>
        `).join('');
    </script>
</body>
</html>
