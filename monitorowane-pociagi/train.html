<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szczegóły pociągu</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #090d16;
  color: #f3f4f6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.app-container {
  width: 100%;
  max-width: 650px;
  background: #0d1322;
  min-height: 100vh;
  border-left: 1px solid #1f2937;
  border-right: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
}

.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #111827;
  border-bottom: 1px solid #1f2937;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-btn {
  color: #38bdf8;
  text-decoration: none;
  font-size: 22px;
  font-weight: bold;
  padding-right: 12px;
}

.head-info { flex: 1; }
.badge { background: #1f2937; color: #38bdf8; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; border: 1px solid #374151; }
.train-id { font-size: 16px; font-weight: 900; margin-left: 6px; color: #fff; }
.route-text { font-size: 12px; color: #9ca3af; margin-top: 3px; }

.head-status { text-align: right; }
.time-big { font-size: 18px; font-weight: 900; color: #38bdf8; line-height: 1; }
.status-tag { font-size: 11px; font-weight: 900; color: #4ade80; margin-top: 4px; }
.status-tag.red { color: #f87171; }

.section-label {
  font-size: 11px;
  font-weight: 800;
  color: #6b7280;
  text-transform: uppercase;
  padding: 14px 16px 8px 16px;
  letter-spacing: 0.5px;
}

.station-list { padding: 0 12px 20px 12px; display: flex; flex-direction: column; gap: 6px; }

.st-card {
  background: #111827;
  border: 1px solid #1f2937;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.st-card.active {
  border: 1px solid #38bdf8;
  background: #0f172a;
}

.st-left { flex: 1; min-width: 0; }
.st-name { font-size: 13px; font-weight: 800; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-sub { font-size: 11px; color: #6b7280; margin-top: 2px; }

.st-right { text-align: right; margin-left: 12px; display: flex; align-items: center; gap: 8px; }
.st-times { display: flex; flex-direction: column; align-items: flex-end; }
.st-time-p { font-size: 10px; color: #6b7280; text-decoration: line-through; }
.st-time-p.clean { text-decoration: none; color: #9ca3af; }
.st-time-r { font-size: 15px; font-weight: 900; color: #38bdf8; line-height: 1.1; }

.st-badge {
  font-size: 10px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 4px;
  background: #15803d;
  color: #fff;
}
.st-badge.red { background: #b91c1c; }
</style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <a href="/monitorowane-pociagi/" class="back-btn">←</a>
    <div class="head-info">
      <div>
        <span class="badge" id="hCategory">---</span>
        <span class="train-id" id="hTrain">---</span>
      </div>
      <div class="route-text" id="hRoute">Ładowanie...</div>
    </div>
    <div class="head-status">
      <div class="time-big" id="hTime">--:--</div>
      <div class="status-tag" id="hDelay">---</div>
    </div>
  </div>

  <div class="section-label">Pełna trasa przejazdu</div>
  <div class="station-list" id="stList">
    <div style="text-align: center; color: #6b7280; padding: 30px; font-size: 13px;">Pobieranie pełnej trasy...</div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const trainNum = params.get('train') || '';
const currentStation = params.get('station') || '';
const trainOrderId = params.get('trainOrderId') || '';

document.getElementById('hTrain').innerText = trainNum;

async function load() {
  const stList = document.getElementById('stList');

  // Próba pobrania ze szczegółowego API PLK
  if (trainOrderId) {
    try {
      const res = await fetch(`/api/train-details?trainOrderId=${encodeURIComponent(trainOrderId)}`);
      if (res.ok) {
        const routeData = await res.json();
        const route = routeData.route || routeData.stations || [];
        if (route.length > 0) {
          renderRoute(route, routeData);
          return;
        }
      }
    } catch(e) {}
  }

  // Odczyt z pamięci lokalnej (fallback z pola via)
  try {
    const cached = localStorage.getItem('monitored_trains_cache');
    if (cached) {
      const { data } = JSON.parse(cached);
      const t = (data.trains || []).find(x => String(x.train) === String(trainNum));
      if (t) {
        renderFallback(t);
        return;
      }
    }
  } catch(e) {}

  stList.innerHTML = '<div style="text-align:center;padding:30px;color:#f87171;font-size:13px;">Nie udało się pobrać szczegółów trasy.</div>';
}

function renderRoute(route, meta) {
  document.getElementById('hCategory').innerText = meta.category || 'R';
  document.getElementById('hRoute').innerText = `${route[0]?.name || ''} → ${route[route.length - 1]?.name || ''}`;
  
  const activeSt = route.find(s => s.name?.toLowerCase().includes(currentStation.toLowerCase())) || route[0];
  document.getElementById('hTime').innerText = activeSt?.time || activeSt?.plannedTime || '--:--';
  
  const delay = Number(activeSt?.delay || 0);
  const delayEl = document.getElementById('hDelay');
  if (delay > 0) {
    delayEl.innerText = `+${delay} MIN`;
    delayEl.className = 'status-tag red';
  } else {
    delayEl.innerText = 'NA CZAS';
    delayEl.className = 'status-tag';
  }

  document.getElementById('stList').innerHTML = route.map(st => {
    const name = st.name || st.stationName || 'Stacja';
    const isCurrent = name.toLowerCase().includes(currentStation.toLowerCase());
    const stDelay = Number(st.delay || 0);
    const pTime = st.plannedTime || '--:--';
    const rTime = st.time || st.realTime || pTime;

    return `
      <div class="st-card ${isCurrent ? 'active' : ''}">
        <div class="st-left">
          <div class="st-name">${isCurrent ? '🎯 ' : ''}${name}</div>
          <div class="st-sub">peron ${st.platform || '-'} · tor ${st.track || '-'}</div>
        </div>
        <div class="st-right">
          <div class="st-times">
            ${stDelay > 0 && pTime !== '--:--' ? `<div class="st-time-p">${pTime}</div>` : `<div class="st-time-p clean">${pTime}</div>`}
            <div class="st-time-r" style="color:${stDelay > 0 ? '#f87171' : '#38bdf8'}">${rTime}</div>
          </div>
          <span class="st-badge ${stDelay > 0 ? 'red' : ''}">${stDelay > 0 ? '+' + stDelay : 'OK'}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderFallback(t) {
  document.getElementById('hCategory').innerText = t.category || 'R';
  document.getElementById('hRoute').innerText = `${t.station} → ${t.destination || '---'}`;
  document.getElementById('hTime').innerText = t.time || t.plannedTime || '--:--';
  
  let viaArray = [];
  if (t.via) {
    viaArray = t.via.split(',').map(s => s.trim()).filter(Boolean);
  }

  const fullPath = [t.station, ...viaArray];
  if (t.destination && !fullPath.map(s => s.toLowerCase()).includes(t.destination.toLowerCase())) {
    fullPath.push(t.destination);
  }

  document.getElementById('stList').innerHTML = fullPath.map((stName, idx) => {
    const isCurrent = stName.toLowerCase() === t.station.toLowerCase();
    const pTime = idx === 0 ? t.plannedTime : '--:--';
    const rTime = idx === 0 ? (t.time || t.plannedTime) : '--:--';

    return `
      <div class="st-card ${isCurrent ? 'active' : ''}">
        <div class="st-left">
          <div class="st-name">${isCurrent ? '🎯 ' : ''}${stName}</div>
          <div class="st-sub">${idx === 0 ? `peron ${t.platform || '-'} · tor ${t.track || '-'}` : 'stacja pośrednia'}</div>
        </div>
        <div class="st-right">
          <div class="st-times">
            <div class="st-time-p clean">${pTime}</div>
            <div class="st-time-r">${rTime}</div>
          </div>
          <span class="st-badge">OK</span>
        </div>
      </div>
    `;
  }).join('');
}

load();
</script>
</body>
</html>
