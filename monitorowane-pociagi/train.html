<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bieg Pociągu</title>
    <style>
        :root {
            --bg-main: #101820;
            --panel-bg: #102235;
            --panel-border: #31516f;
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --accent-green: #5dd39e;
            --accent-blue: #38bdf8;
            --accent-red: #ff6b6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--panel-border); }
        h1 { font-size: 1.2rem; font-weight: 900; }
        .btn-back { background: #0b57d0; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 900; }

        .train-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .train-no { font-size: 1.3rem; font-weight: 900; color: var(--accent-blue); }
        .train-route { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 6px; }
        
        .last-report-badge { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-blue); color: #e0f2fe; padding: 8px 12px; border-radius: 6px; margin-top: 10px; font-weight: 700; font-size: 0.85rem; }

        .timeline { position: relative; padding-left: 20px; margin-top: 20px; border-left: 2px solid var(--panel-border); }
        .station-row { position: relative; padding: 10px 0 10px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .station-row::before { content: ''; position: absolute; left: -26px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel-border); }
        
        .station-row.passed::before { background: var(--accent-blue); }
        .station-row.current::before { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        
        .station-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .station-times { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; display: flex; gap: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>ℹ️ Bieg pociągu <span id="trainTitleHeader"></span></h1>
        <a href="index.html" class="btn-back">← Tablica</a>
    </header>

    <div class="train-card" id="trainCard">
        <div class="train-no" id="trainNumber">Pobieranie...</div>
        <div class="train-route" id="trainRoute"></div>
        <div class="last-report-badge" id="lastReport">📍 Pobieranie pozycji...</div>
    </div>

    <div class="timeline" id="timelineContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const trainNo = urlParams.get('train');
        const queryStation = urlParams.get('station');

        async function loadTrainSchedule() {
            if (!trainNo) {
                document.getElementById('trainNumber').innerText = "Brak numeru pociągu";
                return;
            }

            document.getElementById('trainNumber').innerText = "Pociąg " + trainNo;
            document.getElementById('trainTitleHeader').innerText = trainNo;

            try {
                // Odpytanie API o trasę pociągu
                const res = await fetch(`/api/departures?train=${encodeURIComponent(trainNo)}&station=${encodeURIComponent(queryStation || '')}`);
                const data = await res.json();
                
                const stations = data.stations || data.stops || data.route || [];
                const info = data.info || data.train || {};

                if (info.origin || info.destination) {
                    document.getElementById('trainRoute').innerText = `${info.origin || '—'} ➔ ${info.destination || '—'}`;
                }
                
                if (info.lastStation || info.lastReportedStation) {
                    const lastSt = info.lastStation || info.lastReportedStation;
                    const lastTm = info.lastTime || info.lastReportedTime || '';
                    document.getElementById('lastReport').innerHTML = `📍 Ostatnie potwierdzenie: <b>${lastSt}</b> ${lastTm ? '(' + lastTm + ')' : ''}`;
                } else {
                    document.getElementById('lastReport').style.display = 'none';
                }

                if (!stations || stations.length === 0) {
                    document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--text-muted); padding:10px;">Brak danych szczegółowych trasy dla tego pociągu w żywym API.</div>';
                    return;
                }

                document.getElementById('timelineContainer').innerHTML = stations.map(s => `
                    <div class="station-row ${s.passed ? 'passed' : s.isCurrent ? 'current' : ''}">
                        <div class="station-name">${s.name || s.station}</div>
                        <div class="station-times">
                            <span>Plan: <b>${s.plannedTime || s.schedule || '--:--'}</b></span>
                            <span>Czas: <b>${s.actualTime || s.time || s.plannedTime || '--:--'}</b></span>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                document.getElementById('timelineContainer').innerHTML = '<div style="color:var(--accent-red); padding:10px;">Błąd pobierania trasy z serwera.</div>';
            }
        }

        loadTrainSchedule();
    </script>
</body>
</html>
