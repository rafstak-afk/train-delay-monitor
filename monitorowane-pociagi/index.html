<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablica Monitorowania</title>
    <style>
        :root {
            --bg-main: #101820;
            --panel-bg: #102235;
            --panel-border: #31516f;
            --text-main: #ffffff;
            --text-muted: #93c5fd;
            --accent-green: #5dd39e;
            --accent-red: #ff6b6b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; max-width: 900px; margin: 0 auto; overflow-x: hidden; }

        header { margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        h1 { font-size: 1.3rem; font-weight: 900; }

        .board-list { display: flex; flex-direction: column; gap: 8px; width: 100%; }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px 14px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .station-header {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 900;
        }

        .train-row {
            display: grid;
            grid-template-columns: 80px 80px 1fr;
            gap: 10px;
            align-items: center;
        }

        .delay {
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-green);
            line-height: 1;
        }
        .delay.bad { color: var(--accent-red); }

        .time-box {
            display: flex;
            flex-direction: column;
        }
        .time-main {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-green);
        }
        .time-sub {
            font-size: 11px;
            font-weight: 900;
            color: var(--text-muted);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            min-width: 0; /* Kluczowe dla RWD */
            overflow-wrap: anywhere;
        }

        .train-title {
            font-size: 16px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .carrier-badge {
            background: #111827;
            color: #fb923c;
            border: 1px solid #fb923c;
            font-style: italic;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 999px;
            font-weight: 900;
        }

        .destination {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 2px;
        }

        .via-line {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 2px;
            line-height: 1.25;
            word-break: break-word;
        }

        .meta-line {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }

        @media (max-width: 580px) {
            .train-row {
                grid-template-columns: 60px 70px 1fr;
                gap: 6px;
            }
            .delay { font-size: 26px; }
            .time-main { font-size: 17px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🖥️ Tablica Monitorowania</h1>
        <button style="background:#0b57d0; color:#fff; border:0; padding:8px 14px; border-radius:8px; font-weight:900; cursor:pointer;" onclick="fetchMonitoredTrains()">↻ Odśwież</button>
    </header>

    <main class="board-list" id="boardContainer">
        <div style="color: var(--text-muted); text-align:center; padding:20px;">Ładowanie listy pociągów...</div>
    </main>

    <script>
        async function fetchMonitoredTrains() {
            const container = document.getElementById('boardContainer');
            try {
                const res = await fetch('/api/monitored-trains-v2');
                const data = await res.json();
                const trains = data.trains || [];

                container.innerHTML = trains.map(t => {
                    const delay = Number(t.delay || 0);
                    const delayCls = delay > 0 ? 'delay bad' : 'delay';
                    const delayTxt = delay > 0 ? '+' + delay : '0';
                    const targetUrl = `train.html?train=${encodeURIComponent(t.train)}`;

                    return `
                        <a href="${targetUrl}" class="card">
                            <div class="station-header">${t.station}</div>
                            <div class="train-row">
                                <div class="${delayCls}">${delayTxt}</div>
                                <div class="time-box">
                                    <span class="time-main">${t.time || '--:--'}</span>
                                    <span class="time-sub">odjazd</span>
                                </div>
                                <div class="info-box">
                                    <div class="train-title">
                                        <span class="carrier-badge">${t.carrier || 'PKP'}</span>
                                        ${t.category ? t.category + ' ' : ''}${t.name ? t.name + ' ' : ''}${t.train}
                                    </div>
                                    <div class="destination">${t.destination || ''}</div>
                                    ${t.via ? `<div class="via-line">przez: ${t.via}</div>` : ''}
                                    <div class="meta-line">peron ${t.platform || '—'} · tor ${t.track || '—'}</div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div style="color:var(--accent-red); text-align:center;">Błąd ładowania danych</div>';
            }
        }
        fetchMonitoredTrains();
    </script>
</body>
</html>
