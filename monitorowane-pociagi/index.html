<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitorowane Pociągi - Train Delay Monitor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <!-- WIDOK 1: LISTA MONITOROWANYCH POCIĄGÓW -->
    <main id="listView" class="view active">
      <header class="page-header">
        <h1>Monitorowane pociągi</h1>
        <p class="subtitle">Śledź opóźnienia i bieg Twoich pociągów na żywo</p>
      </header>

      <!-- SEKCJA WYSZUKIWANIA I TABLICY ODJAZDÓW -->
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="stationInput" placeholder="Szukaj stacji..." autocomplete="off" />
          <ul id="autocompleteList" class="autocomplete-list hidden"></ul>
        </div>
        <div id="departuresSection" class="departures-section hidden">
          <div class="section-title-row">
            <h3 id="departuresTitle">Tablica odjazdów</h3>
            <button id="closeDeparturesBtn" class="btn-text">Zamknij</button>
          </div>
          <div id="departuresList" class="departures-list"></div>
        </div>
      </section>

      <!-- KAFELKI MONITOROWANYCH POCIĄGÓW -->
      <section class="monitored-section">
        <div id="monitoredList" class="monitored-grid"></div>
        <div id="emptyState" class="empty-state hidden">
          <span class="empty-icon">🚆</span>
          <p>Brak monitorowanych pociągów.</p>
          <small>Wyszukaj stację powyżej i kliknij (+), aby dodać pociąg do listy.</small>
        </div>
      </section>
    </main>

    <!-- WIDOK 2: SZCZEGÓŁY BIEGU POCIĄGU -->
    <main id="detailsView" class="view hidden">
      <header class="details-header">
        <button id="backToListBtn" class="btn-back">
          <span class="arrow">⬅</span> Powrót do monitorowanych
        </button>
        <div class="train-summary">
          <div class="train-title-group">
            <h2 id="detailTrainName">---</h2>
            <span id="detailTrainNumber" class="train-number-badge">---</span>
          </div>
          <div id="detailTotalDelay" class="total-delay-badge">---</div>
        </div>
      </header>

      <!-- OS CZASU (TRASA KROK PO KROKU) -->
      <section class="route-timeline-container">
        <h3>Bieg pociągu (Trasa krok po kroku)</h3>
        <div id="routeTimeline" class="timeline"></div>
      </section>
    </main>
  </div>

  <!-- PŁYWAJĄCY PRZYCISK ODŚWIEŻANIA (FAB) -->
  <button id="fabRefresh" class="fab" title="Odśwież dane z API" aria-label="Odśwież dane z API">
    <span class="fab-icon">🔄</span>
  </button>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
