<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor pociągów</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  padding: 4px;
  width: 100%;
  max-width: 100%;
  background: #0b131e;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

h1 { margin: 4px 6px 6px 6px; font-size: 16px; font-weight: 700; }
.info { margin: 0 6px 6px 6px; opacity: .8; font-size: 10px; }
.alerts { margin: 0 4px 6px 4px; }
.alertPanel { background: #341616; border: 1px solid #e74c3c; border-radius: 6px; padding: 4px 8px; }
.alertTitle { font-weight: 700; font-size: 11px; }
.alertItem { font-size: 10px; }
.alertOk { background: #14301f; border: 1px solid #2ecc71; border-radius: 6px; padding: 4px 8px; font-size: 11px; }

.list { display: flex; flex-direction: column; gap: 4px; width: 100%; }

/* DWUSZPAL T TABLICY PLK / DOCELOWEJ APKI Z 3 CZASAMI */
.card {
  display: grid;
  grid-template-columns: 85px 1fr auto;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: white;
  background: #111d2c;
  border: 1px solid #1e2d40;
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
}
.card:active { background: #1a2a3f; }
.ok { border-left: 4px solid #2ecc71; }
.missing { border-left: 4px solid #e74c3c; }

/* KOLUMNA 1: 3 CZASY (PLAN, RZECZYWISTY, OPÓŹNIENIE) */
.col-time {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}
.time-planned { font-size: 10px; color: #94a3b8; line-height: 1; text-decoration: line-through; }
.time-planned.no-delay { text-decoration: none; display: none; }
.time-real { font-size: 15px; font-weight: 800; line-height: 1.1; color: #38bdf8; }
.delay-badge {
  display: inline-block;
  margin-top: 2px;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 800;
  line-height: 1.1;
  white-space: nowrap;
}
.delay-badge.green { background: #14532d; color: #4ade80; }
.delay-badge.yellow { background: #713f12; color: #facc15; }
.delay-badge.orange { background: #7c2d12; color: #fb923c; }
.delay-badge.red { background: #7f1d1d; color: #f87171; }

/* KOLUMNA 2: POCIĄG, STACJA DOCELOWA I PRZEZ */
.col-main { min-width: 0; overflow: hidden; }
.train-header { display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.train-type { background: #0284c7; color: white; font-size: 9px; font-weight: 800; padding: 0 3px; border-radius: 2px; }
.train-num { font-size: 12px; font-weight: 700; color: #e2e8f0; }
.train-name { font-size: 11px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; }

.destination { font-size: 13px; font-weight: 800; color: #ffffff; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* STACJE PRZEZ */
.via-list {
  font-size: 10px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
  line-height: 1.2;
}

/* KOLUMNA 3: PERON / TOR */
.col-right {
  text-align: right;
  font-size: 10px;
  color: #cbd5e1;
  white-space: nowrap;
}
.platform-track { font-size: 11px; font-weight: 700; color: #f1f5f9; }
</style>
</head>

<body>

<h1>🚆 Monitor pociągów</h1>
<div id="info" class="info">Ładowanie...</div>
<div id="alerts" class="alerts"></div>
<div id="list" class="list"></div>

<script>
function calculateRealTime(timeStr, delayMin) {
  if (!timeStr || timeStr === '-') return '-';
  const parts = timeStr.split(':');
  if (parts.length < 2) return timeStr;
  
  let date = new Date();
  date.setHours(parseInt(parts[0], 10));
  date.setMinutes(parseInt(parts[1], 10) + parseInt(delayMin || 0, 10));
  
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

async function loadData() {
  let data = { trains: [], foundCount: 0, trainCount: 0 };
  
  try {
    const response = await fetch('/api/monitored-trains-v2');
    data = await response.json();
  } catch (e) {
    console.warn("Błąd API", e);
  }

  document.getElementById('info').innerHTML = `
    Znaleziono: <b>${data.foundCount}</b> z <b>${data.trainCount}</b> | Odświeżono: ${new Date(data.generatedAt || Date.now()).toLocaleTimeString('pl-PL')}
  `;

  const alarms = data.trains.filter(t => Number(t.delay || 0) >= 15);

  document.getElementById('alerts').innerHTML = alarms.length ? `
    <div class="alertPanel">
      <div class="alertTitle">🚨 Alarmy (${alarms.length})</div>
      ${alarms.map(t => `<div class="alertItem">${t.train} ${t.name || ''} (+${t.delay}m)</div>`).join('')}
    </div>
  ` : `
    <div class="alertOk">✅ Brak alarmów</div>
  `;

  document.getElementById('list').innerHTML = data.trains
    .sort((a,b) => Number(b.delay || 0) - Number(a.delay || 0))
    .map(t => {
      const cls = t.found ? 'ok' : 'missing';
      const delay = Number(t.delay || 0);
      let delayClass = 'green';
      let delayText = '0 min';
      
      if (delay > 30) { delayClass = 'red'; delayText = `~${delay}'`; }
      else if (delay > 15) { delayClass = 'orange'; delayText = `~${delay}'`; }
      else if (delay > 5) { delayClass = 'yellow'; delayText = `~${delay}'`; }
      else if (delay > 0) { delayClass = 'yellow'; delayText = `+${delay}'`; }

      const plannedTime = t.time || t.plannedTime || '-';
      const realTime = t.found && delay > 0 ? calculateRealTime(plannedTime, delay) : plannedTime;

      const queryParams = new URLSearchParams({
        train: t.train || '',
        station: t.station || '',
        stationId: t.stationId || '73312',
        scheduleId: t.scheduleId || '2026',
        trainOrderId: t.trainOrderId || ''
      }).toString();

      return `
      <a class="card ${cls}" href="/monitorowane-pociagi/train.html?${queryParams}">
        <!-- KOLUMNA 1: TRZY CZASY -->
        <div class="col-time">
          ${delay > 0 ? `<div class="time-planned">plan: ${plannedTime}</div>` : ''}
          <div class="time-real">${realTime}</div>
          <div class="delay-badge ${delayClass}">${delay > 0 ? delayText : 'NA CZAS'}</div>
        </div>

        <!-- KOLUMNA 2: POCIĄG, CEL I PRZEZ -->
        <div class="col-main">
          <div class="train-header">
            <span class="train-type">${t.category || 'IC'}</span>
            <span class="train-num">${t.train}</span>
            <span class="train-name">${t.name || ''}</span>
          </div>
          <div class="destination">${t.destination || '-'}</div>
          ${t.via ? `<div class="via-list">przez: ${t.via}</div>` : ''}
        </div>

        <!-- KOLUMNA 3: PERON / TOR -->
        <div class="col-right">
          ${t.found ? `
            <div class="platform-track">p. ${t.platform || '-'} · t. ${t.track || '-'}</div>
          ` : 'brak danych'}
        </div>
      </a>
      `;
    }).join('');
}

loadData();
setInterval(loadData, 60000);
</script>

</body>
</html>
