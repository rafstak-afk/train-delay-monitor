<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica Monitorowania Pociągów</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e0e1dd; font-family: sans-serif; }
    .card { background-color: #1c2541; border: 1px solid #3a506b; }
    .badge-delay { background-color: #7209b7; color: #fff; }
    .badge-on-time { background-color: #38b000; color: #fff; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

  <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-700 pb-4">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-train-subway text-3xl text-cyan-400"></i>
      <h1 class="text-2xl font-bold">Tablica Monitorowania Pociągów</h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="refresh-counter" class="text-xs text-slate-400">Odświeżenie za: <b id="timer">60</b>s</span>
      <button onclick="loadMonitoredTrains()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        <i class="fa-solid fa-rotate-right mr-1"></i> Odśwież teraz
      </button>
    </div>
  </header>

  <div id="alert-banner" class="hidden mb-6 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-xl"></i>
      <span id="alert-text" class="font-medium"></span>
    </div>
  </div>

  <div id="trains-container" class="space-y-4">
    <div class="text-center py-12 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-cyan-400"></i>
      <p>Pobieranie aktualnych rozkładów i tras...</p>
    </div>
  </div>

  <script>
    let countdown = 60;

    async function fetchAPI(endpoint) {
      try {
        const res = await fetch('/api/' + endpoint);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.error('Błąd pobierania:', endpoint, err);
        return null;
      }
    }

    async function loadMonitoredTrains() {
      const container = document.getElementById('trains-container');
      const alertBanner = document.getElementById('alert-banner');
      const alertText = document.getElementById('alert-text');
      
      const operationsData = await fetchAPI('operations');
      
      if (!operationsData || !Array.isArray(operationsData) || operationsData.length === 0) {
        container.innerHTML = `
          <div class="card p-8 rounded-xl text-center text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-amber-400"></i>
            <p>Brak aktywnych opóźnionych lub monitorowanych pociągów.</p>
          </div>`;
        alertBanner.classList.add('hidden');
        return;
      }

      let totalDelayed = 0;
      let totalMinutes = 0;
      let html = '';

      for (const train of operationsData) {
        const delay = train.delay || train.delayMinutes || 0;
        if (delay > 0) {
          totalDelayed++;
          totalMinutes += delay;
        }

        const trainName = train.trainName || train.name || `Pociąg ${train.trainNumber || ''}`;
        const trainNo = train.trainNumber || '';
        const category = train.category || 'IC';
        const fromStation = train.from || train.origin || 'Stacja początkowa';
        const toStation = train.to || train.destination || 'Stacja docelowa';
        const lastLocation = train.lastStation || train.currentStation || 'W drodze';
        const lastTime = train.lastReportTime || '--:--';

        let routeHtml = '';
        if (train.scheduleId || train.id) {
          const routeData = await fetchAPI(`schedules/route/${train.scheduleId || train.id}`);
          if (routeData && Array.isArray(routeData.stops)) {
            routeHtml = routeData.stops.map(stop => {
              const stopDelay = stop.delay > 0 ? `<span class="text-amber-400 font-bold">+${stop.delay} min</span>` : '<span class="text-emerald-400">o czasie</span>';
              const peronTor = (stop.platform || stop.track) ? `peron ${stop.platform || '-'} · tor ${stop.track || '-'}` : 'b.d.';
              const isPassed = stop.passed ? 'opacity-50' : 'font-semibold';
              
              return `
                <div class="flex items-center justify-between py-2 border-b border-slate-700/50 text-sm ${isPassed}">
                  <div class="flex items-center gap-3">
                    <i class="${stop.passed ? 'fa-regular fa-circle-check text-slate-500' : 'fa-solid fa-location-dot text-cyan-400'}"></i>
                    <div>
                      <div class="text-white">${stop.stationName}</div>
                      <div class="text-xs text-slate-400">${peronTor}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div><span class="text-slate-400 line-through text-xs mr-1">${stop.plannedTime || ''}</span> <b class="text-cyan-300">${stop.actualTime || stop.plannedTime}</b></div>
                    <div class="text-xs">${stopDelay}</div>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        if (!routeHtml) {
          routeHtml = '<p class="text-xs text-slate-400 italic py-2">Brak szczegółowych danych stacyjnych dla tej trasy.</p>';
        }

        html += `
          <div class="card rounded-xl p-5 shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700/60 pb-4 gap-4">
              <div class="flex items-center gap-4">
                <div class="text-3xl font-black ${delay > 0 ? 'text-amber-400' : 'text-emerald-400'}">
                  ${delay > 0 ? `+${delay}` : '0'}
                  <span class="text-xs block text-slate-400 font-normal">min opóźnienia</span>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded text-xs font-bold">${category}</span>
                    <h2 class="text-xl font-bold text-white">${trainName} ${trainNo}</h2>
                  </div>
                  <p class="text-sm text-slate-300 mt-1">
                    Z: <b>${fromStation}</b> ➔ Do: <b>${toStation}</b>
                  </p>
                </div>
              </div>
              <div class="text-right w-full md:w-auto bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                <div class="text-xs text-slate-400">Ostatnie zgłoszenie:</div>
                <div class="text-sm font-semibold text-cyan-300"><i class="fa-solid fa-map-pin mr-1 text-red-400"></i>${lastLocation} (${lastTime})</div>
              </div>
            </div>

            <details class="mt-4 group">
              <summary class="cursor-pointer text-sm font-semibold text-cyan-400 hover:text-cyan-300 flex items-center justify-between select-none">
                <span><i class="fa-solid fa-route mr-2"></i>Pełny bieg pociągu (Rozkład i Stacje)</span>
                <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i>
              </summary>
              <div class="mt-3 pt-3 border-t border-slate-700/40 space-y-1">
                ${routeHtml}
              </div>
            </details>
          </div>
        `;
      }

      container.innerHTML = html;

      if (totalDelayed > 0) {
        alertText.innerHTML = `UWAGA: <b>${totalDelayed}</b> pociąg(ów) opóźnionych (Łącznie +${totalMinutes} min)`;
        alertBanner.classList.remove('hidden');
      } else {
        alertBanner.classList.add('hidden');
      }
    }

    setInterval(() => {
      countdown--;
      document.getElementById('timer').innerText = countdown;
      if (countdown <= 0) {
        countdown = 60;
        loadMonitoredTrains();
      }
    }, 1000);

    loadMonitoredTrains();
  </script>
</body>
</html>
