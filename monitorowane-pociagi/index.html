<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorowane Pociągi</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b26;
            --card-border: #232d3f;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --status-ok-bg: rgba(34, 197, 94, 0.15);
            --status-ok-border: #22c55e;
            --status-ok-text: #4ade80;
            --status-delay-bg: rgba(239, 68, 68, 0.15);
            --status-delay-border: #ef4444;
            --status-delay-text: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 4px;
        }

        .trains-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .train-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .train-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .train-badge {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .status-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .status-ok {
            background: var(--status-ok-bg);
            border-color: var(--status-ok-border);
            color: var(--status-ok-text);
        }

        .status-delay {
            background: var(--status-delay-bg);
            border-color: var(--status-delay-border);
            color: var(--status-delay-text);
        }

        .route-info {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .last-update-info {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .last-update-info strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <h1>Monitorowane Pociągi</h1>
        <p class="subtitle">Podgląd na żywo pozycji i opóźnień wybranych połączeń</p>
    </header>

    <main class="trains-list" id="trainsList">
        <!-- Pociąg IC 3815 -->
        <a href="train.html?id=3815" class="train-card">
            <div class="card-header">
                <span class="train-badge">IC 3815</span>
                <span class="status-pill status-ok">W planie (0 min)</span>
            </div>
            <div class="route-info">
                Katowice → Szczecin Główny
            </div>
            <div class="last-update-info">
                <span>Ostatnia stacja: <strong>Katowice</strong></span>
                <span>Potwierdzenie: <strong>14:49</strong></span>
            </div>
        </a>
    </main>

</body>
</html>
