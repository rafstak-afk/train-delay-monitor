<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitorowane Pociągi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- WIDOK 1: MONITOROWANE POCIĄGI & WYSZUKIWARKA -->
    <main id="monitored-view" class="view active">
      <header class="page-header">
        <h1>Monitorowane Pociągi</h1>
        <p id="cache-status-text" class="status-subtitle">Ostatnia aktualizacja: --:--</p>
      </header>

      <!-- Panel Wyszukiwania Stacji -->
      <section class="search-section">
        <div class="search-box">
          <input type="text" id="station-input" placeholder="Wyszukaj stację (np. Warszawa Centralna)..." autocomplete="off">
          <ul id="autocomplete-results" class="autocomplete-list hidden"></ul>
        </div>

        <!-- Tablica Odjazdów Wybranej Stacji -->
        <div id="departures-panel" class="departures-panel hidden">
          <div class="panel-header">
            <h3>Odjazdy ze stacji: <span id="selected-station-name"></span></h3>
            <button id="btn-close-departures" class="btn-close">✕</button>
          </div>
          <ul id="departures-list" class="departures-list"></ul>
        </div>
      </section>

      <!-- Lista Kafelków Pociągów -->
      <section class="monitored-section">
        <h2>Twoja lista pociągów</h2>
        <div id="monitored-grid" class="monitored-grid">
          <!-- Kafelki generowane dynamicznie -->
        </div>
      </section>
    </main>

    <!-- WIDOK 2: SZCZEGÓŁY BIEGU POCIĄGU -->
    <main id="details-view" class="view hidden">
      <button id="btn-back" class="btn-back">⬅ Powrót do monitorowanych</button>

      <header class="details-header">
        <div class="title-group">
          <h2 id="train-title">---</h2>
          <span id="train-delay-badge" class="badge">-- min</span>
        </div>
        <p id="train-route-subtitle" class="route-subtitle">-- ➔ --</p>
      </header>

      <!-- Oś Czasu Trasy Pociągu -->
      <section class="route-timeline-section">
        <h3>Trasa i Stacje</h3>
        <div id="route-timeline" class="route-timeline">
          <!-- Wiersze stacji generowane dynamicznie z API -->
        </div>
      </section>
    </main>

  </div>

  <!-- PŁYWĄCY PRZYCISK ODŚWIEŻANIA (FAB) -->
  <button id="fab-refresh" class="fab-refresh" title="Wymuś odświeżenie danych z API">
    <span class="icon">🔄</span>
  </button>

  <script src="app.js"></script>
</body>
</html>
