<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica Monitorowania - Moje Pociągi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; min-height: 100vh; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #1c2541; padding-bottom: 15px; }
    header h1 { font-size: 1.8rem; color: #48cae4; display: flex; align-items: center; gap: 10px; }
    
    .btn-refresh { background-color: #0077b6; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-refresh:hover { background-color: #0096c7; }

    .add-box { background-color: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 15px; margin-bottom: 25px; }
    .add-box h3 { color: #48cae4; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 12px; }
    .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-group input { flex: 1; min-width: 200px; padding: 10px; background-color: #0b132b; border: 1px solid #3a506b; border-radius: 5px; color: #fff; }
    .btn-add { background-color: #00b4d8; color: #0b132b; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }

    .train-list { display: flex; flex-direction: column; gap: 12px; }
    .train-card { background-color: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    
    .badge-status { width: 50px; height: 50px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; text-align: center; }
    .status-ok { background-color: #1b4332; color: #52b788; border: 1px solid #2d6a4f; }
    .status-delay { background-color: #4a1525; color: #ff4d6d; border: 1px solid #800f2f; }

    .train-info { flex: 1; }
    .station-title { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; color: #ffffff; }
    .train-sub { font-size: 0.85rem; color: #a0aab2; margin-top: 4px; }
    .train-tag { background-color: #3a506b; color: #e0e1dd; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-left: 8px; }

    .actions { display: flex; gap: 10px; align-items: center; }
    .btn-search { background-color: #2b2d42; color: #edf2f4; border: 1px solid #8d99ae; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .btn-delete { background-color: transparent; border: none; color: #6c757d; cursor: pointer; font-size: 1.1rem; }
    .btn-delete:hover { color: #ff4d6d; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🖥️ Tablica Monitorowania</h1>
    <button class="btn-refresh" onclick="loadTrains()">🔄 Odśwież dane z API</button>
  </header>

  <div class="add-box">
    <h3>⊕ DODAJ POCIĄG I STACJĘ DO ŚLEDZENIA</h3>
    <div class="input-group">
      <input type="text" id="input-station" placeholder="Stacja (np. Katowice)">
      <input type="text" id="input-number" placeholder="Numer pociągu (np. 3815)">
      <button class="btn-add" onclick="addNewTrain()">+ Dodaj do listy</button>
    </div>
  </div>

  <div class="train-list" id="train-list">
    <!-- Lista generowana dynamicznie -->
  </div>
</div>

<script>
  const DEFAULT_TRAINS = [
    { station: 'KATOWICE', number: '3815', desc: 'Rozkład jazdy PLK dla stacji Katowice' },
    { station: 'BYTOM KARB', number: '40360', desc: 'Rozkład jazdy PLK dla stacji Bytom Karb' },
    { station: 'KATOWICE', number: '38107', desc: 'Rozkład jazdy PLK dla stacji Katowice' },
    { station: 'KATOWICE', number: '40621', desc: 'Rozkład jazdy PLK dla stacji Katowice' },
    { station: 'KATOWICE', number: '63102', desc: 'Rozkład jazdy PLK dla stacji Katowice' },
    { station: 'TARNOWSKIE GÓRY', number: '40450', desc: 'Rozkład jazdy PLK dla stacji Tarnowskie Góry' },
    { station: 'MIASTECZKO ŚLĄSKIE', number: '44226', desc: 'Rozkład jazdy PLK dla stacji Miasteczko Śląskie' },
    { station: 'TARNOWSKIE GÓRY', number: '40250', desc: 'Rozkład jazdy PLK dla stacji Tarnowskie Góry' },
    { station: 'CHORZÓW BATORY', number: '40858', desc: 'Rozkład jazdy PLK dla stacji Chorzów Batory' },
    { station: 'CHORZÓW BATORY', number: '40423', desc: 'Rozkład jazdy PLK dla stacji Chorzów Batory' },
    { station: 'CHORZÓW BATORY', number: '40211', desc: 'Rozkład jazdy PLK dla stacji Chorzów Batory' },
    { station: 'CHORZÓW BATORY', number: '40468', desc: 'Rozkład jazdy PLK dla stacji Chorzów Batory' }
  ];

  function getSavedTrains() {
    const saved = localStorage.getItem('moje_pociagi_list');
    return saved ? JSON.parse(saved) : DEFAULT_TRAINS;
  }

  function saveTrains(list) {
    localStorage.setItem('moje_pociagi_list', JSON.stringify(list));
  }

  async function loadTrains() {
    const list = getSavedTrains();
    const container = document.getElementById('train-list');
    container.innerHTML = '';

    for (const item of list) {
      let delayText = '0 min';
      let statusClass = 'status-ok';
      let infoText = item.desc;

      try {
        const res = await fetch(`/api/trains/${item.number}`);
        if (res.ok) {
          const data = await res.json();
          if (data.delayMinutes > 0) {
            delayText = `+${data.delayMinutes} min`;
            statusClass = 'status-delay';
          }
          infoText = `${data.origin || item.station} ➔ ${data.destination || 'Trasa'}`;
        }
      } catch (e) {
        // Fallback w przypadku braku połączenia / braku aktywnego kursu w API
      }

      const card = document.createElement('div');
      card.className = 'train-card';
      card.innerHTML = `
        <div class="badge-status ${statusClass}">
          <span>${delayText === '0 min' ? 'OK' : 'OPÓŹN.'}</span>
          <span style="font-size:0.7rem">${delayText}</span>
        </div>
        <div class="train-info">
          <div>
            <span class="station-title">${item.station}</span>
            <span class="train-tag">Pociąg #${item.number}</span>
          </div>
          <div class="train-sub">${infoText}</div>
        </div>
        <div class="actions">
          <button class="btn-search">Szukaj biegu</button>
          <button class="btn-delete" onclick="deleteTrain('${item.number}')">🗑️</button>
        </div>
      `;
      container.appendChild(card);
    }
  }

  function addNewTrain() {
    const st = document.getElementById('input-station').value.trim().toUpperCase();
    const num = document.getElementById('input-number').value.trim();
    if (!st || !num) return alert('Wpisz stację i numer pociągu');

    const list = getSavedTrains();
    list.push({ station: st, number: num, desc: `Rozkład jazdy PLK dla stacji ${st}` });
    saveTrains(list);
    document.getElementById('input-station').value = '';
    document.getElementById('input-number').value = '';
    loadTrains();
  }

  function deleteTrain(number) {
    let list = getSavedTrains();
    list = list.filter(t => t.number !== number);
    saveTrains(list);
    loadTrains();
  }

  document.addEventListener('DOMContentLoaded', loadTrains);
</script>
</body>
</html>
