<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje Pociągi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e0e1dd; font-family: sans-serif; }
    .card { background-color: #1c2541; border: 1px solid #3a506b; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

  <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-700 pb-4">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-train text-3xl text-cyan-400"></i>
      <h1 class="text-2xl font-bold">Moje Pociągi</h1>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="loadTrains()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
        <i class="fa-solid fa-rotate-right mr-1"></i> Odśwież
      </button>
    </div>
  </header>

  <div id="trains-container" class="space-y-4">
    <div class="text-center py-12 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-cyan-400"></i>
      <p>Ładowanie listy pociągów...</p>
    </div>
  </div>

  <script>
    async function fetchAPI(endpoint) {
      try {
        const res = await fetch('/api/' + endpoint);
        if (!res.ok) {
          const errText = await res.text();
          console.error(`Błąd HTTP ${res.status}:`, errText);
          return { _error: true, status: res.status, message: errText };
        }
        return await res.json();
      } catch (err) {
        console.error('Błąd połączenia:', endpoint, err);
        return { _error: true, message: err.message };
      }
    }

    async function loadTrainRoute(scheduleId, orderId, operatingDate, containerId) {
      const routeDiv = document.getElementById(containerId);
      routeDiv.innerHTML = '<div class="py-4 text-center text-slate-400 text-xs"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Pobieranie biegu pociągu...</div>';
      
      let data = null;
      if (scheduleId && orderId) {
        data = await fetchAPI(`schedules/route/${scheduleId}/${orderId}`);
      }
      if ((!data || data._error) && scheduleId && orderId && operatingDate) {
        data = await fetchAPI(`operations/train/${scheduleId}/${orderId}/${operatingDate}`);
      }

      const stops = data?.stops || data?.route || data?.data?.stops || data?.operations || (Array.isArray(data) ? data : null);

      if (!stops || !Array.isArray(stops) || stops.length === 0) {
        routeDiv.innerHTML = `<div class="py-3 text-amber-400 text-xs text-center"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Brak szczegółowych danych trasowych dla tego pociągu.</div>`;
        return;
      }

      let html = '<div class="mt-3 border-t border-slate-700/60 pt-3 space-y-2 text-xs">';
      html += '<div class="font-semibold text-slate-300 mb-2">Bieg pociągu:</div>';
      
      stops.forEach((stop, idx) => {
        const stationName = stop.stationName || stop.station || stop.name || `Stacja ${idx+1}`;
        const arrival = stop.arrReal || stop.arrivalTime || stop.arrPlan || stop.plannedTime || '--:--';
        const delay = stop.delay || stop.delayMinutes || 0;
        const delayBadge = delay > 0 ? `<span class="text-pink-400 font-bold ml-2">+${delay} min</span>` : '<span class="text-emerald-400 ml-2">o czasie</span>';
        
        html += `
          <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded border border-slate-700/40">
            <span class="text-slate-200"><i class="fa-solid fa-location-dot text-slate-500 mr-2"></i>${stationName}</span>
            <div>
              <span class="font-mono text-slate-300">${arrival}</span>
              ${delayBadge}
            </div>
          </div>
        `;
      });

      html += '</div>';
      routeDiv.innerHTML = html;
    }

    async function loadTrains() {
      const container = document.getElementById('trains-container');
      const resData = await fetchAPI('operations');

      if (resData && resData._error) {
        container.innerHTML = `
          <div class="card p-6 rounded-xl text-center text-amber-400 border border-amber-500/30">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
            <p class="font-bold">Problem z pobraniem danych z API PKP PLK</p>
            <p class="text-xs text-slate-400 mt-1">Kod błędu: ${resData.status || 'Błąd połączenia'}</p>
          </div>`;
        return;
      }

      // Wyciąganie listy z dowolnej możliwej struktury JSON z API
      const list = Array.isArray(resData) 
        ? resData 
        : (resData?.operations || resData?.data || resData?.items || resData?.trains || resData?.content || []);

      if (!list || list.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-400"><p>Brak dostępnych pociągów w tym momencie.</p></div>';
        return;
      }

      container.innerHTML = list.slice(0, 30).map((t, idx) => {
        const trainName = t.trainName || t.name || t.trainNo || t.number || `Pociąg ${idx + 1}`;
        const relation = (t.fromStation && t.toStation) ? `${t.fromStation} ➔ ${t.toStation}` : (t.relation || 'Trasa bieżąca');
        const delay = t.delay || t.delayMinutes || t.delayArrival || 0;
        const scheduleId = t.scheduleId || t.id || '';
        const orderId = t.orderId || t.order || 1;
        const operatingDate = t.operatingDate || new Date().toISOString().split('T')[0];
        const routeBoxId = `route-box-${idx}`;

        return `
          <div class="card p-4 rounded-xl shadow-md">
            <div class="flex justify-between items-start mb-2">
              <div>
                <h2 class="text-lg font-bold text-white">${trainName}</h2>
                <p class="text-xs text-slate-400"><i class="fa-solid fa-route mr-1"></i>${relation}</p>
              </div>
              <span class="${delay > 0 ? 'bg-purple-600' : 'bg-emerald-600'} text-white text-xs px-2.5 py-1 rounded-full font-semibold">
                ${delay > 0 ? `+${delay} min` : 'O czasie'}
              </span>
            </div>
            <button onclick="loadTrainRoute('${scheduleId}', '${orderId}', '${operatingDate}', '${routeBoxId}')" class="mt-2 text-xs text-cyan-400 hover:text-cyan-300 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-list-check"></i> Pokaż / Odśwież bieg pociągu
            </button>
            <div id="${routeBoxId}"></div>
          </div>
        `;
      }).join('');
    }

    loadTrains();
  </script>
</body>
</html>
