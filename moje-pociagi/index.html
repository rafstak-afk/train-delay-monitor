<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Moje pociągi</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2b;
  --border:#263653;
  --text:#f4f7fb;
  --muted:#91a0b7;
  --cyan:#22d3ee;
  --green:#34d399;
  --red:#fb7185;
  --gray:#64748b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
}

.app{
  width:min(100%,700px);
  margin:0 auto;
  padding:12px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 0 16px;
}

h1{ margin:0; font-size:20px; }

.refresh{
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--cyan);
  font-weight:700;
  cursor:pointer;
}

.refresh:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.refresh.danger{
  color:#fb7185;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:10px;
  align-items:center;
  cursor:pointer;
  transition:border-color 0.15s ease;
}

.card:hover{ border-color:var(--cyan); }

.time-box{
  text-align:center;
  background:#0b1220;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--border);
}

.plan-time{ font-size:14px; font-weight:800; color:var(--text); }
.delay-tag{ font-size:11px; font-weight:700; margin-top:2px; }
.delay-tag.ok{ color:var(--green); }
.delay-tag.bad{ color:var(--red); }
.delay-tag.off{ color:var(--gray); }

.info-box{ min-width:0; }
.train-num{ font-size:16px; font-weight:900; color:var(--cyan); }
.station-name{ font-size:13px; color:var(--muted); margin-top:2px; }
.status-text{ font-size:12px; color:var(--text); margin-top:4px; }
.last-loc{ font-size:12px; color:var(--cyan); margin-top:4px; font-weight:600; }

.actions{ display:flex; align-items:center; gap:6px; }
.btn-action{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
  width:32px;
  height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
}
.btn-action:hover{ background:rgba(255,255,255,0.15); }
.btn-del{
  background:rgba(251,113,133,0.15);
  border:1px solid rgba(251,113,133,0.4);
  color:var(--red);
}
.btn-del:hover{ background:rgba(251,113,133,0.3); }

.add-form{
  margin-top:20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}
.add-form h3{ margin:0 0 10px 0; font-size:15px; color:var(--cyan); }
.form-grid{ display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; }
.form-grid input{
  background:#0b1220;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  border-radius:8px;
  font-size:13px;
  width:100%;
}
.btn-add{
  background:var(--cyan);
  color:#0b1220;
  border:0;
  border-radius:8px;
  padding:8px 14px;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:600px){
  .form-grid{ grid-template-columns:1fr; }
}

/* === Poniżej: dokładnie te same reguły (i te same wartości kolorów) co
   karta pociągu na tablicy głównej (index.html) — żeby wiersz pociągu
   wyglądał identycznie na obu stronach. Reszta strony (nagłówek, formularz
   dodawania) zostaje w swojej dotychczasowej palecie (--cyan/--bg itd.),
   tylko sam wiersz pociągu przełącza się na kolory tablicy. */
.row-clickable{cursor:pointer}
.time-rows{display:flex;flex-direction:column;gap:6px}
.time-rows .muted.plan-small{color:#8b95a1;opacity:1;font-size:12px;line-height:1.1;margin:0}
.time-real{font-weight:800;font-size:15px}
.delay-val{white-space:nowrap}
.plan-strike{text-decoration:line-through}
.time-delay-low{color:#ffcc00}
.time-delay-mid{color:#ff4d4d}
.time-delay-high{color:#c084fc}
.delay{color:#ffcc00;font-weight:700}
.delay-mid{color:#ff4d4d;font-weight:700}
.delay-high{color:#c084fc;font-weight:700}
.ontime{color:#5dd39e;font-weight:700}
.muted{opacity:.65;font-size:12px}
.train-main,.direction-main{font-weight:700;color:#fff}
.train-name,.direction-via{opacity:.78;font-size:12px;margin-top:3px;line-height:1.25;color:#fff}
.train-delay-under{font-size:12px;margin-top:3px}
.cancel-badge{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:999px;background:#7f1d1d;color:#fff;font-size:11px;font-weight:900;letter-spacing:.03em;text-decoration:none!important}
.status-note{display:block;margin-top:4px;color:#ffb4b4;font-size:11px;font-weight:800}
.train-cancelled{opacity:.72;background:rgba(120,120,120,.15)!important}
.train-cancelled .direction-via{text-decoration:line-through}

.mobile-layout{display:grid;grid-template-columns:80px 36px 76px 1fr 40px;gap:6px;align-items:start}
.mobile-dcol .time-real{font-size:22px;line-height:1}
.mobile-dcol .delay-val{font-size:16px;line-height:22px;height:22px}
.mobile-dcol .plan-small{font-size:12px}
.mobile-time .time-real{font-size:22px;line-height:1}
.mobile-time .muted{font-size:13px;margin-top:2px}
.mobile-train .train-main{font-size:17px;line-height:1.05}
.mobile-train .train-name{font-size:12px;line-height:1.1}
.mobile-direction .direction-main{font-size:17px;line-height:1.05}
.mobile-direction .direction-via{font-size:12px;line-height:1.2}
.mobile-side{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mobile-platform{font-size:22px;font-weight:700;line-height:1;color:#fff}
.mobile-track{font-size:11px;opacity:.8;margin-top:3px}
.mt-star{font-size:18px;line-height:1;background:transparent;border:1px solid #8fa6bf;border-radius:7px;padding:3px 6px;cursor:pointer}
.mt-star.star-filled{color:#ffd400;text-shadow:0 0 6px rgba(255,212,0,.5)}
.reorder-row{display:flex;gap:3px}
.reorder-btn{font-size:11px;padding:2px 6px;background:transparent;border:1px solid #34495e;border-radius:6px;color:#dbeafe;cursor:pointer}
.reorder-btn:disabled{opacity:.3;cursor:default}
.status-line{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:var(--muted)}
</style>

<body>
<div class="app">

<header>
  <div>
    <h1>🚆 Moje pociągi</h1>
  </div>
  <div style="display:flex; gap:8px;">
    <a class="refresh" href="/dziennik/" style="text-decoration:none; display:inline-flex; align-items:center;" title="Dzienniczek podróży">📓</a>
    <a class="refresh" href="/profil/" style="text-decoration:none; display:inline-flex; align-items:center;">👤</a>
    <button class="refresh danger" id="clearBtn" title="Usuń wszystkie pociągi z listy">🗑️ Wyczyść</button>
    <button class="refresh" id="refreshBtn">↻ ODŚWIEŻ</button>
  </div>
</header>

<main id="list" class="list"></main>

<section class="add-form">
  <h3>➕ Dodaj pociąg do listy</h3>
  <form id="addTrainForm" class="form-grid">
    <input type="text" id="addStation" placeholder="Stacja (np. Katowice)" required>
    <input type="text" id="addTrainNum" placeholder="Nr pociągu (np. 3815)" required>
    <input type="text" id="addPlanTime" placeholder="Godzina (np. 14:40)" required>
    <button type="submit" class="btn-add">Dodaj</button>
  </form>
</section>

</div>

<script src="/profile-sync.js"></script>
<script src="/tutorial.js"></script>
<script src="/survey.js"></script>
<script src="/profile-prompt.js"></script>
<script>
const STORAGE_KEY = 'rafstakMojePociagiV4';

// === Dokładnie te same funkcje co na tablicy głównej (index.html) — budują
// identyczny HTML dla kolumny godzin/opóźnienia, żeby wiersz pociągu
// wyglądał tak samo na obu stronach. ===
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function shortTime(v){if(!v)return'';const m=String(v).match(/(\d{2}:\d{2})/);return m?m[1]:v}
function getTimeDelayClass(d){return d>=20?'time-delay-high':d>10?'time-delay-mid':d>=5?'time-delay-low':'ontime'}
function getDelayClass(d){return d>=20?'delay-high':d>10?'delay-mid':d>=5?'delay':'ontime'}
function timeRowHtml(real,planned,delay,cancelled){if(!planned)return '';const r=shortTime(real),p=shortTime(planned),d=Number(delay||0);if(!(r&&r!==p&&d>0))return '<div class="trow"><div class="time-real '+(cancelled?'delay-mid':'ontime')+'">'+escapeHtml(p)+'</div></div>';return '<div class="trow"><div class="muted plan-strike plan-small">'+escapeHtml(p)+'</div><div class="time-real '+getTimeDelayClass(d)+'">('+escapeHtml(r)+')</div></div>'}
function delayRowHtml(real,planned,delay,cancelled){if(!planned)return '';const r=shortTime(real),p=shortTime(planned),d=Number(delay||0);if(cancelled||!(r&&r!==p&&d>0))return '<div class="trow"><div class="time-real" style="visibility:hidden">0</div></div>';return '<div class="trow"><div class="muted plan-small" style="visibility:hidden">00:00</div><div class="time-real delay-val '+getTimeDelayClass(d)+'">+'+d+'</div></div>'}
function delayColHtml(d,cancelled){return '<div class="time-rows">'+delayRowHtml(d.arrivalTime,d.plannedArrivalTime,d.arrivalDelay,cancelled)+delayRowHtml(d.time,d.plannedTime,d.delay,cancelled)+'</div>'}
function timeCellHtml(d,tc,delay,delayText,cancelled){return '<div class="time-rows">'+timeRowHtml(d.arrivalTime,d.plannedArrivalTime,d.arrivalDelay,cancelled)+timeRowHtml(d.time,d.plannedTime,delay,cancelled)+(cancelled?'<div class="train-delay-under delay-mid">'+escapeHtml(delayText)+'</div>':'')+'</div>'}

// UWAGA: dawniej brak zapisanej listy (pierwsza wizyta, pusty localStorage)
// oznaczał pokazanie listy prywatnych pociągów autora jako "domyślnej" —
// każdy nowy odwiedzający dostawał cudze dane jako swoje. Pusta lista +
// czytelny stan "brak pociągów" jest poprawnym punktem startowym.
function loadTrains() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return [];
}

function saveTrains(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  if (window.ProfileSync) ProfileSync.push({ trains: list });
}

function emptyListHtml() {
  return '<div style="text-align:center;padding:28px 16px;color:#8b95a1;font-size:14px;">Nie masz jeszcze żadnych pociągów na liście.<br>Dodaj pierwszy w formularzu poniżej 👇</div>';
}

function clearAllTrains() {
  if (!currentTrains.length) return;
  if (!confirm('Usunąć wszystkie pociągi z listy? Tej operacji nie da się cofnąć.')) return;
  currentTrains = [];
  lastRows = [];
  saveTrains(currentTrains);
  renderFromCache();
}

let currentTrains = loadTrains();

// Ostatnio wyrenderowany "row" na kartę (równoległa tablica do
// currentTrains) — dzięki temu zmiana kolejności/usunięcie może
// przerysować listę z danych, które już mamy, zamiast na nowo odpytywać
// wszystkie stacje i wszystkie pociągi tylko dlatego, że ktoś kliknął ▲.
let lastRows = [];

// Kiedy ostatnio init() faktycznie skończył pobieranie danych — używane
// do decyzji "czy odświeżać po powrocie z bfcache" (patrz pageshow niżej).
let lastLoadedAt = 0;
const STALE_AFTER_MS = 5 * 60 * 1000;

// Bez timeoutu na fetch() zawieszone/bardzo wolne żądanie (słaba sieć,
// wolna odpowiedź PLK) blokowało init() w nieskończoność — strona
// zostawała na "Pobieranie danych..." bez żadnego błędu, bo fetch()
// nigdy się nie rozstrzygał ani na sukces, ani na porażkę.
async function fetchWithTimeout(url, opts = {}, timeoutMs = 15000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...opts, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function fetchStationDepartures(station) {
  try {
    const res = await fetchWithTimeout('/api/departures?station=' + encodeURIComponent(station) + '&limit=300', { cache: 'no-store' });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.departures) ? data.departures : (Array.isArray(data) ? data : []);
  } catch (e) {
    return [];
  }
}

// Cache w localStorage dla wyniku smart-lookup (scheduleId/orderId się
// nie zmieniają w ciągu dnia dla danego kursu) — na drugim i kolejnych
// odświeżeniach tego samego dnia pomijamy cały krok smart-lookup i od
// razu wołamy train-details, co wyraźnie przyspiesza karty spoza
// aktualnego okna tablicy odjazdów.
function todayKeyForCache() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function courseCacheKey(trainNum, station) {
  return 'courseCache:' + todayKeyForCache() + ':' + trainNum + ':' + station;
}

function getCachedCourse(trainNum, station) {
  try {
    const raw = localStorage.getItem(courseCacheKey(trainNum, station));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function setCachedCourse(trainNum, station, course) {
  try {
    localStorage.setItem(courseCacheKey(trainNum, station), JSON.stringify(course));
  } catch (e) {}
}

function clearCachedCourse(trainNum, station) {
  try {
    localStorage.removeItem(courseCacheKey(trainNum, station));
  } catch (e) {}
}

// Fallback: Pobieranie identyfikatorów i stanu biegu po samym numerze pociągu z PLK
async function fetchTrainByNumber(trainNum, station, _isRetry) {
  try {
    let scheduleId = "";
    let orderId = "";
    let trainOrderId = "";

    const cached = !_isRetry && getCachedCourse(trainNum, station);

    if (cached && cached.scheduleId && cached.orderId) {
      scheduleId = cached.scheduleId;
      orderId = cached.orderId;
      trainOrderId = cached.trainOrderId || "";
    } else {
      try {
        const lookupRes = await fetchWithTimeout(`/api/v2/smart-lookup?train=${encodeURIComponent(trainNum)}&station=${encodeURIComponent(station)}`, { cache: "no-store" });
        if (lookupRes.ok) {
          const lData = await lookupRes.json();
          if (lData && lData.ok) {
            scheduleId = lData.scheduleId || "";
            orderId = lData.orderId || "";
            trainOrderId = lData.trainOrderId || "";
            if (scheduleId && orderId) {
              setCachedCourse(trainNum, station, { scheduleId, orderId, trainOrderId });
            }
          }
        }
      } catch (_) {}
    }

    const query = new URLSearchParams({
      train: trainNum,
      station: station
    });
    if (scheduleId) query.set("scheduleId", scheduleId);
    if (orderId) query.set("orderId", orderId);
    if (trainOrderId) query.set("trainOrderId", trainOrderId);

    const res = await fetchWithTimeout(`/api/train-details?${query.toString()}`, { cache: "no-store" });
    if (!res.ok) {
      // Wynik z cache mógł się zdezaktualizować (np. inny dzień
      // rozkładowy) — wyczyść i spróbuj raz jeszcze ze świeżym lookupem
      // zamiast pokazywać "brak danych" mimo dostępnych informacji.
      if (cached) {
        clearCachedCourse(trainNum, station);
        return fetchTrainByNumber(trainNum, station, true);
      }
      return null;
    }
    const data = await res.json();
    if (!data) return null;

    let lastSt = data.lastConfirmedStation || data.lastStation || data.lastLocation;
    
    // Walidacja statusu - czy pociąg faktycznie zakończył bieg, czy dopiero czeka na odjazd
    const now = new Date();
    const parseTime = (timeStr) => {
      if (!timeStr) return null;
      const parts = timeStr.split(":");
      if (parts.length < 2) return null;
      const d = new Date();
      d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
      return d;
    };

    const depTime = parseTime(data.departureTime || data.scheduledDeparture);
    const arrTime = parseTime(data.arrivalTime || data.scheduledArrival);

    // Jeśli nie było jeszcze odjazdu i obecny czas jest przed/w okolicach planowego odjazdu, pociąg czeka na start
    if (depTime && now < depTime && (!data.delay || data.delay === 0) && !data.isFinished) {
      data.statusText = "Oczekuje na odjazd";
      data.isPending = true;
    }
    let lastTm = data.lastConfirmedTime || data.lastTime || data.arrivalTime;

    if (!lastSt && Array.isArray(data.timeline) && data.timeline.length > 0) {
      const confirmed = data.timeline.filter(t => t.confirmed || t.passed || t.actualTime);
      const lastPoint = confirmed.length > 0 ? confirmed[confirmed.length - 1] : data.timeline[data.timeline.length - 1];
      if (lastPoint) {
        lastSt = lastPoint.station || lastPoint.name;
        lastTm = lastPoint.actualTime || lastPoint.time || lastPoint.departureTime || lastPoint.arrivalTime;
      }
    }

    // Osobny planowy przyjazd NA TĘ stację (postój przed odjazdem) —
    // szukamy jej w pełnej trasie zwróconej przez train-details. Przy
    // okazji liczymy tu też "przez" (stacje pośrednie) i stację docelową —
    // /api/train-details (w odróżnieniu od /api/departures) nie zna ich
    // wprost, ale ma pełną trasę, z której da się je wyliczyć dokładnie
    // tak samo jak robi to enrichWithFullRoutes() na tablicy głównej.
    let arrivalTime = "", plannedArrivalTime = "", arrivalDelay = null;
    let routeDestination = "", via = "", platform = "", track = "";
    if (Array.isArray(data.route) && data.route.length) {
      const wanted = station.trim().toLowerCase();
      const stop = data.route.find(s => (s.stationName || "").trim().toLowerCase() === wanted);
      if (stop && stop.plannedArrival) {
        plannedArrivalTime = stop.plannedArrival;
        arrivalTime = stop.actualArrival || stop.plannedArrival;
        arrivalDelay = stop.arrivalDelay;
      }
      // Peron/tor z pełnej trasy — przydaje się, gdy ten kurs nie jest już
      // (albo jeszcze nie jest) w oknie /api/departures dla tej stacji.
      if (stop && stop.platform && stop.platform !== "-") platform = stop.platform;
      if (stop && stop.track && stop.track !== "-") track = stop.track;
      const destStop = data.route[data.route.length - 1];
      routeDestination = (destStop && destStop.stationName) || "";
      const idx = data.route.findIndex(s => (s.stationName || "").trim().toLowerCase() === wanted);
      if (idx >= 0) {
        via = data.route.slice(idx + 1, idx + 6)
          .map(s => s.stationName)
          .filter(Boolean)
          .filter(name => name.trim().toLowerCase() !== routeDestination.trim().toLowerCase())
          .join(", ");
      }
    }

    return {
      scheduleId: data.scheduleId || data.id,
      orderId: data.orderId,
      trainOrderId: data.trainOrderId,
      destination: data.destination || data.direction || routeDestination,
      via,
      ...(platform ? { platform } : {}),
      ...(track ? { track } : {}),
      category: data.category || "",
      name: data.name || data.trainName || "",
      status: data.status || "",
      lastConfirmedStation: lastSt,
      lastConfirmedTime: lastTm,
      delay: data.delay ?? 0,
      // Tylko gdy faktycznie znaleźliśmy postój na tej stacji — inaczej
      // scalanie {...matchedRow, ...richRow} nadpisałoby puste wartości
      // ponad ewentualny przyjazd, który matchedRow już miał z tablicy
      // odjazdów.
      ...(plannedArrivalTime ? { arrivalTime, plannedArrivalTime, arrivalDelay } : {}),
      isFinished: data.isFinished ?? true
    };
  } catch (e) {
    return null;
  }
}

function extractCourseParams(row) {
  if (!row) return '';
  const sid = row.scheduleId || row.id || '';
  const oid = row.orderId || '';
  const toid = row.trainOrderId || '';
  
  let params = [];
  if (sid) params.push(`scheduleId=${encodeURIComponent(sid)}`);
  if (oid) params.push(`orderId=${encodeURIComponent(oid)}`);
  if (toid) params.push(`trainOrderId=${encodeURIComponent(toid)}`);
  
  return params.join('&');
}

function extractLastStation(row) {
  if (!row) return null;
  const st = row.lastConfirmedStation || row.lastStation || row.lastLocation;
  const tm = row.lastConfirmedTime || row.lastTime || row.arrivalTime;
  if (st) {
    return tm ? `${st} (${tm})` : st;
  }
  return null;
}

function getDelay(row) {
  if (!row) return null;
  const val = row.delay ?? row.delayMinutes ?? row.delayInMinutes;
  return val !== undefined && val !== null ? Number(val) : 0;
}

// Czysto lokalne przerysowanie listy z danych, które już mamy w
// pamięci (lastRows) — bez żadnego zapytania sieciowego. Używane po
// zmianie kolejności/usunięciu, żeby kliknięcie ▲/▼/✕ nie odpytywało
// od nowa wszystkich stacji i wszystkich pociągów (to robi tylko
// "Odśwież" / pierwsze załadowanie strony).
function renderFromCache() {
  const container = document.getElementById('list');
  container.innerHTML = currentTrains.length ? currentTrains.map((item, idx) => renderCard(item, idx, lastRows[idx])).join('') : emptyListHtml();
}

// Wywoływane z przycisków wewnątrz karty; rodzic ma już
// onclick="event.stopPropagation()", więc same nie dostają (ani nie
// potrzebują) obiektu zdarzenia — wcześniej sygnatura zakładała `e` jako
// pierwszy argument, mimo że HTML przekazywał tylko (index, direction) /
// (index), co przy kliknięciu rzucało błędem i przycisk nic nie robił.
function moveTrain(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= currentTrains.length) return;
  const item = currentTrains.splice(index, 1)[0];
  currentTrains.splice(newIndex, 0, item);
  const row = lastRows.splice(index, 1)[0];
  lastRows.splice(newIndex, 0, row);
  saveTrains(currentTrains);
  renderFromCache();
}

// Bez potwierdzenia — ta sama, od razu działająca logika co gwiazdka
// (odznaczenie ulubionego) na tablicy głównej.
function deleteTrain(index) {
  currentTrains.splice(index, 1);
  lastRows.splice(index, 1);
  saveTrains(currentTrains);
  renderFromCache();
}

function goDetails(station, number, courseQuery) {
  let url = `/train?train=${encodeURIComponent(number)}&station=${encodeURIComponent(station)}`;
  if (courseQuery) {
    url += `&${courseQuery}`;
  }
  window.location.href = url;
}


    function getAdjustedTime(timeStr, delayMinutes) {
      if (!timeStr || !delayMinutes || isNaN(delayMinutes)) return null;
      const parts = timeStr.split(":");
      if (parts.length < 2) return null;
      const d = new Date();
      d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10) + parseInt(delayMinutes, 10), 0, 0);
      const h = String(d.getHours()).padStart(2, "0");
      const m = String(d.getMinutes()).padStart(2, "0");
      return `${h}:${m}`;
    }
  
function renderCard(item, index, row) {
  const isLoaded = Boolean(row);

  // Pobieranie tablicy przystanków z dowolego zagnieżdżenia
  const rawStops = row ? (row.stops || row.route || (row.data && (row.data.stops || row.data.route)) || []) : [];
  const lastStop = Array.isArray(rawStops) && rawStops.length > 0 ? rawStops[rawStops.length - 1] : null;

  // Stacja docelowa
  let destStation = row ? (row.destination || row.to || row.destinationName || row.endStation || "") : "";
  if (!destStation && lastStop) {
    destStation = typeof lastStop === 'string' ? lastStop : (lastStop.stationName || lastStop.station || lastStop.name || lastStop.stopName || "");
  }

  // Czas przybycia na ostatnią stację
  let endFormattedTime = "";
  if (lastStop && typeof lastStop === 'object') {
    endFormattedTime = lastStop.arrReal || lastStop.actualTime || lastStop.arrTime || lastStop.arrivalTime || lastStop.arrPlan || lastStop.plannedTime || lastStop.time || lastStop.scheduleArrivalTime || "";
  }

  // Weryfikacja opóźnienia z uwzględnieniem ostatniego przystanku
  let delay = getDelay(row);
  if ((delay === null || delay === 0) && lastStop && typeof lastStop === 'object') {
    if (lastStop.delay !== undefined && lastStop.delay !== null && parseInt(lastStop.delay, 10) > 0) {
      delay = parseInt(lastStop.delay, 10);
    } else if (lastStop.arrReal && lastStop.arrPlan) {
      const [rH, rM] = lastStop.arrReal.split(':').map(Number);
      const [pH, pM] = lastStop.arrPlan.split(':').map(Number);
      if (!isNaN(rH) && !isNaN(pH)) {
        const diff = (rH * 60 + rM) - (pH * 60 + pM);
        if (diff > 0) delay = diff;
      }
    }
  }

  const isDelayed = delay !== null && delay > 0;
  const cancelled = !!(row && row.status === 'X');
  const isFinished = row && (row.isFinished || row.status === "FINISHED" || row.status === "COMPLETED");
  const lastLoc = extractLastStation(row);

  let statusText = "⏳ Pobieranie danych...";
  if (isLoaded) {
    if (isFinished) {
      const destText = destStation ? ` w ${destStation}` : "";
      const timeText = endFormattedTime ? ` o ${endFormattedTime}` : "";
      statusText = `🏁 Pociąg skończył bieg${destText}${timeText}`;
    } else if (lastLoc) {
      const destText = destStation ? ` ➔ ${destStation}` : "";
      statusText = `📍 Ostatnio: ${lastLoc}${destText}`;
    } else {
      statusText = `Planowany odjazd: ${item.planTime || "--:--"}`;
    }
  }

  const adjustedTime = isDelayed ? getAdjustedTime(item.planTime, delay) : null;
  const hasArrival = !!(row && row.plannedArrivalTime);

  // Poniżej: dokładnie ten sam obiekt "d" i te same funkcje
  // (timeCellHtml/delayColHtml), co dla wiersza pociągu na tablicy głównej.
  const d = {
    time: adjustedTime || item.planTime || '--:--',
    plannedTime: item.planTime || '--:--',
    delay: isDelayed ? delay : 0,
    arrivalTime: hasArrival ? row.arrivalTime : '',
    plannedArrivalTime: hasArrival ? row.plannedArrivalTime : '',
    arrivalDelay: hasArrival ? row.arrivalDelay : null
  };
  const tc = getTimeDelayClass(isDelayed ? delay : 0);
  const delayText = cancelled ? 'ODWOŁANY' : (isDelayed ? '+' + delay : '0');
  const cancelBadge = cancelled ? '<span class="cancel-badge">ODWOŁANY</span>' : '';

  const trainLabel = [row && row.category, item.trainNum].filter(Boolean).join(' ');
  const trainName = (row && row.name) || '';
  const via = (row && row.via) || '';
  const platform = (row && row.platform) || '';
  const track = (row && row.track) || '';

  // Budowanie linku /train
  const cleanTrainNo = String(item.trainNum || '').replace(/\D+/g, '');
  const params = new URLSearchParams();
  params.set('train', cleanTrainNo || item.trainNum);

  if (row) {
    if (row.category) params.set('category', row.category);
    if (row.name) params.set('name', row.name);
    if (destStation || row.destination) params.set('destination', destStation || row.destination);
    if (row.date) params.set('date', row.date);

    const schedId = row.scheduleId || row.scheduledId || row.id;
    if (schedId) {
      params.set('scheduleId', schedId);
      params.set('scheduledId', schedId);
    }

    const ordId = row.orderId || row.trainOrderId || row.trainOrder;
    if (ordId) {
      params.set('orderId', ordId);
      params.set('trainOrderId', ordId);
    }

    if (row.stationId) params.set('stationId', row.stationId);
  }

  params.set('station', item.station);

  const detailsUrl = `/train?${params.toString()}`;

  return `
    <div id="card-${index}" class="row-clickable${cancelled ? ' train-cancelled' : ''}" onclick="window.location.href='${detailsUrl}'" style="background:#1c2833;border-radius:12px;margin-bottom:8px;padding:10px;border:1px solid var(--border);">
      <div class="mobile-layout">
        <div class="mobile-time">${timeCellHtml(d, tc, d.delay, delayText, cancelled)}</div>
        <div class="mobile-dcol">${delayColHtml(d, cancelled)}</div>
        <div class="mobile-train"><div class="train-main">${escapeHtml(trainLabel)}</div><div class="train-name">${escapeHtml(trainName)}</div>${cancelBadge}</div>
        <div class="mobile-direction">
          <div class="direction-main">${escapeHtml(item.station)}</div>
          <div class="direction-via">${via ? escapeHtml(via) : (destStation ? '➔ ' + escapeHtml(destStation) : '')}</div>
          ${cancelled ? '<span class="status-note">Pociąg odwołany według API PLK</span>' : ''}
        </div>
        <div class="mobile-side">
          <div class="mobile-platform">${escapeHtml(platform)}</div>
          <div class="mobile-track">${track ? 'tor ' + escapeHtml(track) : ''}</div>
          <div class="reorder-row" onclick="event.stopPropagation();">
            <button class="reorder-btn" title="Przesuń wyżej" onclick="moveTrain(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲</button>
            <button class="reorder-btn" title="Przesuń niżej" onclick="moveTrain(${index}, 1)">▼</button>
          </div>
          <button class="btn-cal mt-star star-filled" title="Usuń z Moich pociągów" onclick="event.stopPropagation();deleteTrain(${index})">★</button>
        </div>
        <div class="status-line">${statusText}</div>
      </div>
    </div>
  `;
}
async function init() {
  const container = document.getElementById('list');
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;

  container.innerHTML = currentTrains.length ? currentTrains.map((item, idx) => renderCard(item, idx, null)).join('') : emptyListHtml();

  function paintCard(idx, item, row) {
    lastRows[idx] = row || null;
    const el = document.getElementById('card-' + idx);
    if (el) el.outerHTML = renderCard(item, idx, row);
  }

  try {
    // Zapytania o stacje startują od razu, równolegle (było: sekwencyjnie,
    // jedna stacja po drugiej — czas się sumował zamiast być ograniczonym
    // przez najwolniejsze zapytanie). Karty NIE czekają, aż wszystkie 4
    // stacje odpowiedzą — każda rusza w stronę renderu, gdy tylko dostanie
    // dane dla SWOJEJ stacji.
    const stations = [...new Set(currentTrains.map(t => t.station))];
    const stationPromises = new Map(stations.map(st => [st, fetchStationDepartures(st)]));

    // Każda karta aktualizuje się w DOM niezależnie, gdy tylko jej dane są
    // gotowe — zamiast czekać, aż WSZYSTKIE karty się rozstrzygną, zanim
    // cokolwiek się pokaże (poprzednio jedna wolna karta blokowała
    // wyświetlenie reszty, które już dawno miały dane).
    const cardTasks = currentTrains.map(async (item, idx) => {
      let matchedRow = null;
      try {
        const departures = await stationPromises.get(item.station);
        matchedRow = (departures || []).find(d => {
          const dNum = String(d.train || d.trainNumber || d.number || '').replace(/\D/g, '');
          const targetNum = String(item.trainNum).replace(/\D/g, '');
          return dNum && targetNum && dNum === targetNum;
        });

        // Szybki, wstępny render z tablicy odjazdów (kategoria, peron,
        // czas) — /api/departures nie zna "ostatniej potwierdzonej
        // stacji" w całej trasie (świadomy kompromis wydajnościowy),
        // tylko status NA TEJ stacji.
        if (matchedRow) paintCard(idx, item, matchedRow);

        // Zawsze doczytujemy pełne dane trasy (train-details) i
        // nadpisujemy nimi to, czego tablica odjazdów wiedzieć nie
        // mogła — inaczej pociąg widoczny na tablicy, ale jeszcze
        // niepotwierdzony NA TEJ stacji, nigdy nie pokazywał, gdzie
        // faktycznie jest ("Planowany odjazd" zamiast "Ostatnio: ...").
        // Dzięki cache'owi ID kursu w localStorage to zwykle jedno
        // dodatkowe, szybkie zapytanie.
        const richRow = await fetchTrainByNumber(item.trainNum, item.station);
        const finalRow = richRow ? { ...matchedRow, ...richRow } : matchedRow;

        paintCard(idx, item, finalRow);
      } catch (e) {
        // Pojedyncza karta nie może zostawić się na zawsze na
        // "Pobieranie danych..." — w najgorszym razie pokaż ją jako
        // nierozwiązaną zamiast wisieć bez końca.
        paintCard(idx, item, matchedRow);
      }
    });

    await Promise.allSettled(cardTasks);
    lastLoadedAt = Date.now();
  } catch (e) {
    container.innerHTML = `<div style="padding:16px;color:#fb7185;">Błąd ładowania danych: ${String(e && e.message || e)}. Spróbuj odświeżyć.</div>`;
  } finally {
    refreshBtn.disabled = false;
  }
}

document.getElementById('addTrainForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const st = document.getElementById('addStation').value.trim();
  const num = document.getElementById('addTrainNum').value.trim();
  const tm = document.getElementById('addPlanTime').value.trim();

  if (st && num) {
    currentTrains.push({ station: st, trainNum: num, planTime: tm || '--:--' });
    saveTrains(currentTrains);
    document.getElementById('addTrainForm').reset();
    init();
    if (window.ProfilePrompt) ProfilePrompt.ask('train');
  }
});

document.getElementById('refreshBtn').addEventListener('click', init);
document.getElementById('clearBtn').addEventListener('click', clearAllTrains);

// Powrót przyciskiem Wstecz ze szczegółów pociągu czasem przywraca tę
// stronę z pamięci przeglądarki (bfcache) — wtedy skrypt się NIE
// wykonuje od nowa i init() na dole pliku nie odpala, więc bez tego
// listenera strona pokazywałaby dowolnie stary stan. event.persisted
// odróżnia taki powrót od zwykłego, pierwszego załadowania. Odświeżamy
// tylko, gdy dane mają więcej niż 5 minut — w przeciwnym razie to, co
// już jest na ekranie, i tak jest wystarczająco świeże.
window.addEventListener('pageshow', (event) => {
  if (event.persisted && Date.now() - lastLoadedAt > STALE_AFTER_MS) {
    init();
  }
});

// Jeśli na tym urządzeniu jest aktywny token profilu, dociągamy listę
// pociągów z chmury przed pierwszym init() — nadpisuje domyślną/lokalną
// listę tym, co zapisano na innym urządzeniu pod tym samym tokenem.
(async function start() {
  if (window.ProfileSync && ProfileSync.getToken()) {
    const profile = await ProfileSync.pull();
    if (profile && Array.isArray(profile.trains)) {
      currentTrains = profile.trains;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentTrains));
    } else if (profile !== null && localStorage.getItem(STORAGE_KEY)) {
      // Profil w chmurze nie ma jeszcze listy — wysyłamy lokalną.
      ProfileSync.push({ trains: currentTrains });
    }
  }
  init();
})();
</script>
