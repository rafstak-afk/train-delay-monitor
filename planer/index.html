<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planer podróży</title>
<style>
:root{--bg:#101820;--panel:#1c2833;--card:#223244;--line:#34495e;--text:#fff;--muted:#b8c3cf;--blue:#0b57d0;--green:#5dd39e;--yellow:#ffcc00;--red:#ff4d4d;--violet:#c084fc;--grey:#4b5563;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding:18px}
.wrap{max-width:720px;margin:0 auto}
a.back{display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-size:14px}
h1{text-align:center;font-size:26px;margin:6px 0 4px}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:15px;font-family:inherit}
input[type=text],input[type=date],input[type=time]{width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
.station-stack{position:relative}
.station-field{position:relative;min-width:0;margin-bottom:12px}
.input-wrap{position:relative}
.input-wrap input{padding-right:38px}
.field-clear{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--red);font-size:15px;cursor:pointer;align-items:center;justify-content:center;line-height:1}
.field-clear.show{display:flex}
.field-clear:hover{background:rgba(255,77,77,.12)}
.swap-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:6;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.swap-btn:hover{background:#2a3b4d}
.station-dropdown{display:none;position:absolute;z-index:10000;top:calc(100% + 4px);left:0;right:0;background:#172433;border:1px solid #48627c;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.45);max-height:280px;overflow:auto;text-align:left}
.station-dropdown.open{display:block}
.station-dd-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;color:#fff;padding:10px 12px;text-align:left;cursor:pointer;font-family:inherit}
.station-dd-item:hover{background:#223244}
.station-dd-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station-dd-id{opacity:.65;font-size:12px}
.date-time-row{display:flex;gap:8px;margin-bottom:12px}
.date-time-row>div{flex:1}
.trips-panel{padding:0;overflow:hidden;margin:0 0 14px;background:var(--card)}
.trips-toggle{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--text);padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit}
.trips-toggle:hover{background:rgba(255,255,255,.04)}
.trips-toggle-icon{font-size:18px}
.trips-toggle-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.trips-toggle-title{font-size:14px;font-weight:800}
.adv-dot{display:none;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:7px;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,77,77,.25)}
.adv-dot.show{display:inline-block}
.trips-toggle-summary{font-size:12px;color:var(--muted)}
.trips-chevron{display:inline-block;font-size:14px;line-height:1;transition:transform .3s ease}
.trips-panel.open .trips-chevron{transform:rotate(180deg)}
.trips-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.trips-panel.open .trips-body{grid-template-rows:1fr}
.trips-body-inner{overflow:hidden;min-height:0}
.trips-content{padding:2px 14px 14px;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.trips-body,.trips-chevron{transition:none}}
.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;font-size:15px;width:100%}
.btn:hover{background:#084298}
.btn:disabled{opacity:.6;cursor:default}
.btn-sm{border:0;border-radius:8px;padding:8px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:12.5px}
.btn-sm:hover{background:#084298}
.btn-sm.secondary{background:#4b5563}
.btn-sm.secondary:hover{background:#5b6472}
.btn-sm:disabled{opacity:.5;cursor:default}
.status{text-align:center;color:var(--muted);min-height:20px;margin:10px 0;font-size:13.5px}
.status.err{color:var(--red)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.6}
.muted-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;text-align:center}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.itin-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.itin-time{font-size:21px;font-weight:900}
.itin-arrow{color:var(--muted);font-size:16px}
.itin-dur{font-size:12.5px;color:var(--muted);margin-left:4px}
.itin-nextday{font-size:11px;color:var(--yellow);font-weight:800}
.itin-badge{margin-left:auto;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.itin-badge.direct{background:rgba(93,211,158,.18);color:var(--green)}
.itin-badge.transfer{background:rgba(192,132,252,.18);color:var(--violet)}
.itin-badge.multi-transfer{background:rgba(192,132,252,.28);color:var(--violet)}
.itin-badge.via{background:rgba(34,211,238,.18);color:var(--cyan)}
.leg-row{display:grid;grid-template-columns:56px 1fr;gap:3px 10px;align-items:center;margin-top:8px;padding:10px 11px;background:rgba(255,255,255,.04);border-radius:9px;cursor:pointer}
.leg-row:hover,.leg-row:active{background:rgba(255,255,255,.1)}
.leg-time{display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:14px;line-height:1.3}
.leg-time .leg-arr{color:var(--muted);font-size:12px;font-weight:700}
.leg-main{min-width:0}
.leg-train-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.leg-train-num{font-weight:800;font-size:13.5px}
.leg-train-name{color:var(--muted);font-size:12px}
.leg-direction{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itin-transfer{font-size:12px;color:var(--cyan);text-align:center;margin:4px 0;font-weight:700}
.risk-safe{color:var(--green);font-weight:800}
.risk-tight{color:var(--yellow);font-weight:800}
.risk-missed{color:var(--red);font-weight:900}
.ambiguous-note{font-size:12.5px;color:var(--yellow);margin:0 0 10px;text-align:center}
.itin-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:8px}
.saved-at{font-size:11.5px;color:var(--muted);margin-top:6px;font-style:italic}
.via-row{margin-bottom:8px}
.via-row .station-field{margin-bottom:0}
.via-remove{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--red);border-radius:9px;width:42px;height:42px;font-size:16px;cursor:pointer}
.via-remove:hover{background:#2a3b4d}
.carrier-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:4px}
@media(max-width:480px){.carrier-grid{grid-template-columns:1fr}}
.carrier-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#d8e2ee;cursor:pointer}
.carrier-chip input{width:auto;margin:0}
.adv-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.adv-section-title{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
</style>

</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Tablica</a>
  <h1>🧭 Planer podróży</h1>
  <div class="subtitle">Szuka połączeń bezpośrednich i z przesiadką(ami) na podstawie rozkładu PLK, z czasem rzeczywistym tam, gdzie już jest znany.</div>

  <div class="panel">
    <div class="station-stack">
      <div class="station-field">
        <label for="fromInput">Skąd</label>
        <div class="input-wrap">
          <input id="fromInput" type="text" placeholder="Nazwa stacji..." autocomplete="off">
          <button type="button" class="field-clear" data-side="from" title="Wyczyść">✕</button>
        </div>
        <div class="station-dropdown" id="fromDropdown"></div>
      </div>
      <div class="station-field">
        <label for="toInput">Dokąd</label>
        <div class="input-wrap">
          <input id="toInput" type="text" placeholder="Nazwa stacji..." autocomplete="off">
          <button type="button" class="field-clear" data-side="to" title="Wyczyść">✕</button>
        </div>
        <div class="station-dropdown" id="toDropdown"></div>
      </div>
      <button type="button" class="swap-btn" id="swapBtn" title="Zamień miejscami">⇅</button>
    </div>
    <div class="date-time-row">
      <div><label for="dateInput">Data</label><input id="dateInput" type="date"></div>
      <div><label for="timeInput">Od godziny</label><input id="timeInput" type="time"></div>
    </div>
    <div class="trips-panel" id="advPanel">
      <button type="button" class="trips-toggle" id="advToggle" aria-expanded="false" onclick="toggleAdv()">
        <span class="trips-toggle-icon" aria-hidden="true">⚙️</span>
        <span class="trips-toggle-text"><span class="trips-toggle-title">Zaawansowane<span class="adv-dot" id="advDot" title="Aktywne ustawienie niedomyślne"></span></span><span class="trips-toggle-summary" id="advSummary">Min. czas na przesiadkę: 3 min</span></span>
        <span class="trips-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="trips-body" id="advBody"><div class="trips-body-inner"><div class="trips-content">
        <label for="transferMinutesSelect">Minimalny czas na przesiadkę</label>
        <select id="transferMinutesSelect">
          <option value="0">0 min</option>
          <option value="3" selected>3 min</option>
          <option value="5">5 min</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
          <option value="25">25 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
        </select>

        <div class="adv-section">
          <label class="carrier-chip"><input type="checkbox" id="directOnlyCheckbox"> Tylko połączenia bezpośrednie (bez przesiadek)</label>
        </div>

        <div class="adv-section">
          <div class="adv-section-title">Przez stację (opcjonalnie)</div>
          <div id="viaContainer"></div>
          <button type="button" class="btn-sm secondary" id="addViaBtn" onclick="addViaStation()">➕ Dodaj kolejną stację</button>
        </div>

        <div class="adv-section">
          <div class="adv-section-title">Wyklucz przewoźników</div>
          <div class="carrier-grid" id="carrierGrid"><div class="muted-note">Ładowanie listy przewoźników...</div></div>
        </div>
      </div></div></div>
    </div>
    <button type="button" class="btn" id="searchBtn" onclick="search()">🔎 Szukaj połączeń</button>
  </div>

  <div id="resultsStatus" class="status"></div>
  <div id="resultsList"></div>

  <div class="trips-panel" id="savedPanel">
    <button type="button" class="trips-toggle" id="savedToggle" aria-expanded="false" onclick="toggleSaved()">
      <span class="trips-toggle-icon" aria-hidden="true">📌</span>
      <span class="trips-toggle-text"><span class="trips-toggle-title">Zapisane wyniki (<span id="savedCount">0</span>)</span><span class="trips-toggle-summary">Do późniejszego przejrzenia</span></span>
      <span class="trips-chevron" aria-hidden="true">▾</span>
    </button>
    <div class="trips-body" id="savedBody"><div class="trips-body-inner"><div class="trips-content">
      <div id="savedList"></div>
    </div></div></div>
  </div>
</div>

<script src="/profile-sync.js"></script>
<script src="/tutorial.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var selected={from:{id:'',name:''},to:{id:'',name:''}};
  var searchTimers={};
  var viaRows=[];
  var viaCounter=0;
  var excludedCarriers=new Set();
  var lastItineraries=[];
  var lastQuery=null;
  var SAVED_KEY='planerZapisaneTrasy';
  var CARRIERS_KEY='planerWykluczeniPrzewoznicy';

  function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}

  function todayYYYYMMDD(){
    var n=new Date();
    return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  }

  function setDefaultDateTime(){
    var n=new Date(),h=String(n.getHours()).padStart(2,'0'),i=String(n.getMinutes()).padStart(2,'0');
    $('dateInput').value=todayYYYYMMDD();
    $('timeInput').value=h+':'+i;
  }

  // Zmiana daty na inną niż dzisiejsza z pozostawioną "teraz" (np. 22:36) w
  // polu godziny w praktyce odcinała niemal wszystkie połączenia następnego
  // dnia — godzina ma sens tylko razem z datą, więc reset przy każdej
  // zmianie daty, tak samo jak domyślne zachowanie samego /api/planner.
  $('dateInput').addEventListener('change',function(){
    var n=new Date();
    if(this.value===todayYYYYMMDD()){
      $('timeInput').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    }else{
      $('timeInput').value='00:00';
    }
  });

  function toggleAdv(){
    var panel=$('advPanel');
    var open=!panel.classList.contains('open');
    panel.classList.toggle('open',open);
    $('advToggle').setAttribute('aria-expanded',open?'true':'false');
  }
  window.toggleAdv=toggleAdv;

  function toggleSaved(force){
    var panel=$('savedPanel');
    var open=typeof force==='boolean'?force:!panel.classList.contains('open');
    panel.classList.toggle('open',open);
    $('savedToggle').setAttribute('aria-expanded',open?'true':'false');
  }
  window.toggleSaved=toggleSaved;

  function updateAdvSummary(){
    $('advSummary').textContent='Min. czas na przesiadkę: '+$('transferMinutesSelect').value+' min';
  }
  $('transferMinutesSelect').addEventListener('change',function(){updateAdvSummary();updateAdvDot()});
  $('directOnlyCheckbox').addEventListener('change',updateAdvDot);

  // Czerwona kropka przy "Zaawansowane" — widoczna nawet w zwiniętej sekcji,
  // żeby było wiadomo, że coś tam zmieniono z ustawień domyślnych.
  function updateAdvDot(){
    var active=$('transferMinutesSelect').value!=='3'||excludedCarriers.size>0||viaRows.some(function(r){return r.name.trim()})||$('directOnlyCheckbox').checked;
    var el=$('advDot');
    if(el)el.classList.toggle('show',active);
  }

  function updateClearVisibility(btn,input){
    if(!btn||!input)return;
    btn.classList.toggle('show',!!input.value);
  }

  // === Skąd/Dokąd: autouzupełnianie stacji ===
  function renderDropdown(side,stations,onPick){
    var el=$(side+'Dropdown')||document.querySelector('.station-dropdown[data-key="'+side+'"]');
    if(!el)return;
    if(!stations.length){el.classList.remove('open');el.innerHTML='';return}
    el.innerHTML=stations.map(function(s){
      return '<button type="button" class="station-dd-item" data-id="'+escapeHtml(s.id)+'" data-name="'+escapeHtml(s.name)+'"><span class="station-dd-name">'+escapeHtml(s.name)+'</span><span class="station-dd-id">'+escapeHtml(s.id)+'</span></button>';
    }).join('');
    el.classList.add('open');
  }

  function hideDropdown(side){
    var el=$(side+'Dropdown')||document.querySelector('.station-dropdown[data-key="'+side+'"]');
    if(el)el.classList.remove('open');
  }

  function fetchStations(side,query){
    if(!query||query.length<2){hideDropdown(side);return}
    fetch('/api/dictionaries/stations?search='+encodeURIComponent(query)+'&pageSize=12',{headers:{Accept:'application/json'}})
      .then(function(r){return r.json()})
      .then(function(data){renderDropdown(side,Array.isArray(data.stations)?data.stations:[])})
      .catch(function(){hideDropdown(side)});
  }

  ['from','to'].forEach(function(side){
    var clearBtn=document.querySelector('.field-clear[data-side="'+side+'"]');
    $(side+'Input').addEventListener('input',function(){
      selected[side]={id:'',name:''};
      updateClearVisibility(clearBtn,this);
      var q=this.value.trim();
      clearTimeout(searchTimers[side]);
      searchTimers[side]=setTimeout(function(){fetchStations(side,q)},250);
    });
    $(side+'Input').addEventListener('focus',function(){
      var q=this.value.trim();
      if(q.length>=2)fetchStations(side,q);
    });
    $(side+'Dropdown').addEventListener('click',function(e){
      var btn=e.target.closest('.station-dd-item');
      if(!btn)return;
      selected[side]={id:btn.dataset.id,name:btn.dataset.name};
      $(side+'Input').value=btn.dataset.name;
      updateClearVisibility(clearBtn,$(side+'Input'));
      hideDropdown(side);
    });
    if(clearBtn){
      clearBtn.addEventListener('click',function(){
        selected[side]={id:'',name:''};
        $(side+'Input').value='';
        updateClearVisibility(clearBtn,$(side+'Input'));
        $(side+'Input').focus();
      });
    }
  });

  document.addEventListener('click',function(e){
    if(!e.target.closest('.station-field')){
      hideDropdown('from');hideDropdown('to');
      viaRows.forEach(function(r){hideDropdown(r.key)});
    }
  });

  $('swapBtn').addEventListener('click',function(){
    var f=selected.from,t=selected.to;
    selected.from=t;selected.to=f;
    $('fromInput').value=selected.from.name||'';
    $('toInput').value=selected.to.name||'';
  });

  // === Przez stację (opcjonalnie), do 3 ===
  var MAX_VIA=3;

  function renderViaRows(){
    var container=$('viaContainer');
    container.innerHTML=viaRows.map(function(row){
      return '<div class="station-row via-row">'+
        '<div class="station-field">'+
          '<div class="input-wrap">'+
            '<input type="text" class="via-input" data-key="'+row.key+'" placeholder="Nazwa stacji..." autocomplete="off" value="'+escapeHtml(row.name)+'">'+
            '<button type="button" class="field-clear" data-via-key="'+row.key+'" title="Wyczyść">✕</button>'+
          '</div>'+
          '<div class="station-dropdown" data-key="'+row.key+'"></div>'+
        '</div>'+
        '<button type="button" class="via-remove" data-key="'+row.key+'" title="Usuń">✕</button>'+
      '</div>';
    }).join('');
    $('addViaBtn').disabled=viaRows.length>=MAX_VIA;
    container.querySelectorAll('.field-clear').forEach(function(btn){
      var key=btn.dataset.viaKey;
      updateClearVisibility(btn, container.querySelector('.via-input[data-key="'+key+'"]'));
      btn.addEventListener('click',function(){
        var inp=container.querySelector('.via-input[data-key="'+key+'"]');
        inp.value='';
        var row=viaRows.filter(function(r){return r.key===key})[0];
        if(row){row.id='';row.name=''}
        updateClearVisibility(btn, inp);
        updateAdvDot();
        inp.focus();
      });
    });

    container.querySelectorAll('.via-input').forEach(function(inp){
      var key=inp.dataset.key;
      inp.addEventListener('input',function(){
        var row=viaRows.filter(function(r){return r.key===key})[0];
        if(!row)return;
        row.id='';row.name=this.value;
        updateClearVisibility(container.querySelector('.field-clear[data-via-key="'+key+'"]'), this);
        updateAdvDot();
        var q=this.value.trim();
        clearTimeout(searchTimers[key]);
        searchTimers[key]=setTimeout(function(){fetchStations(key,q)},250);
      });
      inp.addEventListener('focus',function(){
        var q=this.value.trim();
        if(q.length>=2)fetchStations(key,q);
      });
    });
    container.querySelectorAll('.station-dropdown').forEach(function(dd){
      var key=dd.dataset.key;
      dd.addEventListener('click',function(e){
        var btn=e.target.closest('.station-dd-item');
        if(!btn)return;
        var row=viaRows.filter(function(r){return r.key===key})[0];
        if(!row)return;
        row.id=btn.dataset.id;row.name=btn.dataset.name;
        container.querySelector('.via-input[data-key="'+key+'"]').value=btn.dataset.name;
        hideDropdown(key);
      });
    });
    container.querySelectorAll('.via-remove').forEach(function(btn){
      btn.addEventListener('click',function(){
        var key=this.dataset.key;
        viaRows=viaRows.filter(function(r){return r.key!==key});
        renderViaRows();
        updateAdvDot();
      });
    });
  }

  function addViaStation(){
    if(viaRows.length>=MAX_VIA)return;
    viaRows.push({key:'via'+(viaCounter++),id:'',name:''});
    renderViaRows();
  }
  window.addViaStation=addViaStation;

  // === Wykluczanie przewoźników ===
  function loadCarrierPrefs(){
    try{
      var raw=JSON.parse(localStorage.getItem(CARRIERS_KEY)||'[]');
      if(Array.isArray(raw))excludedCarriers=new Set(raw);
    }catch(e){}
  }
  function saveCarrierPrefs(){
    try{localStorage.setItem(CARRIERS_KEY,JSON.stringify([...excludedCarriers]))}catch(e){}
    if(window.ProfileSync)ProfileSync.push({excludedCarriers:[...excludedCarriers]});
  }
  function renderCarrierCheckboxes(carriers){
    var el=$('carrierGrid');
    if(!carriers.length){el.innerHTML='<div class="muted-note">Lista przewoźników chwilowo niedostępna.</div>';return}
    el.innerHTML=carriers.map(function(c){
      var checked=excludedCarriers.has(c.code)?' checked':'';
      return '<label class="carrier-chip"><input type="checkbox" data-code="'+escapeHtml(c.code)+'"'+checked+'> '+escapeHtml(c.name)+'</label>';
    }).join('');
    el.querySelectorAll('input[type=checkbox]').forEach(function(cb){
      cb.addEventListener('change',function(){
        var code=this.dataset.code;
        if(this.checked)excludedCarriers.add(code);else excludedCarriers.delete(code);
        saveCarrierPrefs();
        updateAdvDot();
      });
    });
  }
  function loadCarriers(){
    fetch('/api/carriers',{headers:{Accept:'application/json'}})
      .then(function(r){return r.json()})
      .then(function(data){renderCarrierCheckboxes(data.ok&&Array.isArray(data.carriers)?data.carriers:[])})
      .catch(function(){$('carrierGrid').innerHTML='<div class="muted-note">Lista przewoźników chwilowo niedostępna.</div>'});
  }

  // === Render wyników ===
  function shortDur(min){
    if(min==null)return'';
    var h=Math.floor(min/60),m=min%60;
    return h>0?(h+'h '+m+'min'):(m+' min');
  }

  // Cała "karta" nogi trasy jest klikalna (jak wiersz w Moich pociągach) i
  // ma wyglądać jak rekord z tablicy odjazdów: czas, numer/kategoria i nazwa
  // pociągu, kierunek. Kliknięcie otwiera pełne szczegóły kursu w nowej
  // karcie (ten sam URL co na tablicy), bez gubienia wyników wyszukiwania.
  function legHtml(leg){
    var tr=[leg.train.category,leg.train.number].filter(Boolean).join(' ');
    return '<div class="leg-row" data-train-url="'+escapeHtml(leg.trainUrl)+'" title="Pokaż szczegóły pociągu">'+
      '<div class="leg-time"><span>'+escapeHtml(leg.board.time)+'</span><span class="leg-arr">'+escapeHtml(leg.alight.time)+(leg.alight.nextDay?' +1':'')+'</span></div>'+
      '<div class="leg-main">'+
        '<div class="leg-train-row"><span class="leg-train-num">'+escapeHtml(tr)+'</span>'+(leg.train.name?'<span class="leg-train-name">'+escapeHtml(leg.train.name)+'</span>':'')+'</div>'+
        '<div class="leg-direction">'+escapeHtml(leg.board.stationName)+' → '+escapeHtml(leg.alight.stationName)+'</div>'+
      '</div>'+
      '</div>';
  }

  function badgeHtml(it){
    if(it.type==='direct')return '<span class="itin-badge direct">BEZPOŚREDNIO</span>';
    if(it.type==='transfer')return '<span class="itin-badge transfer">1 PRZESIADKA</span>';
    if(it.type==='multi-transfer')return '<span class="itin-badge multi-transfer">'+((it.transfers||[]).length)+' PRZESIADKI</span>';
    if(it.type==='via')return '<span class="itin-badge via">TRASA PRZEZ '+((it.transfers||[]).length)+' ST.</span>';
    return '';
  }

  function riskHtml(t){
    if(!t.liveDataAvailable)return '';
    if(t.liveRisk==='safe')return ' <span class="risk-safe">🟢 na czas</span>';
    if(t.liveRisk==='tight')return ' <span class="risk-tight">🟡 ciasno: '+t.realBufferMinutes+' min</span>';
    if(t.liveRisk==='missed')return ' <span class="risk-missed">🔴 prawdopodobnie nie zdążysz</span>';
    return '';
  }

  function itineraryHtml(it,opts){
    opts=opts||{};
    var transfers=it.transfers||[];
    var legsHtml='';
    it.legs.forEach(function(leg,idx){
      legsHtml+=legHtml(leg);
      if(idx<it.legs.length-1&&transfers[idx]){
        var t=transfers[idx];
        legsHtml+='<div class="itin-transfer">🔁 Przesiadka w '+escapeHtml(t.stationName)+': '+t.bufferMinutes+' min'+riskHtml(t)+'</div>';
      }
    });
    var actionHtml='';
    var planTitle=' title="Dodaj do planu podróży w dzienniczku — potem potwierdzisz każdy odcinek osobno"';
    if(opts.savedKey){
      actionHtml='<button type="button" class="btn-sm secondary itin-remove" data-saved-key="'+escapeHtml(opts.savedKey)+'">🗑️ Usuń</button>'+
        '<button type="button" class="btn-sm secondary itin-addplan" data-saved-key="'+escapeHtml(opts.savedKey)+'"'+planTitle+'>📋 Do dziennika</button>';
    }else if(opts.index!=null){
      actionHtml='<button type="button" class="btn-sm itin-save" data-idx="'+opts.index+'">💾 Zapisz</button>'+
        '<button type="button" class="btn-sm secondary itin-addplan" data-idx="'+opts.index+'"'+planTitle+'>📋 Do dziennika</button>';
    }
    var savedLine=opts.savedAt?'<div class="saved-at">zapisano '+escapeHtml(new Date(opts.savedAt).toLocaleString('pl-PL'))+'</div>':'';
    return '<div class="entry">'+
      '<div class="itin-head">'+
        '<span class="itin-time">'+escapeHtml(it.departureTime)+'</span><span class="itin-arrow">→</span><span class="itin-time">'+escapeHtml(it.arrivalTime)+'</span>'+
        (it.arrivalNextDay?'<span class="itin-nextday">+1 dzień</span>':'')+
        '<span class="itin-dur">'+shortDur(it.durationMinutes)+'</span>'+
        badgeHtml(it)+
      '</div>'+
      legsHtml+
      savedLine+
      (actionHtml?'<div class="itin-actions">'+actionHtml+'</div>':'')+
      '</div>';
  }

  var RESULTS_PAGE_SIZE=5;
  var visibleCount=RESULTS_PAGE_SIZE;
  var lastNotes='';

  function renderResults(data){
    var statusEl=$('resultsStatus'),listEl=$('resultsList');
    statusEl.className='status';
    lastItineraries=data.itineraries||[];
    lastQuery=data.query;
    visibleCount=RESULTS_PAGE_SIZE;

    var notes='';
    if(data.resolvedFrom&&data.resolvedFrom.ambiguous)notes+='<div class="ambiguous-note">Znaleziono więcej niż jedną stację o nazwie „'+escapeHtml(data.resolvedFrom.name)+'” — pokazano wyniki dla najbardziej prawdopodobnej. Wybierz dokładną stację z podpowiedzi, jeśli to nie ta.</div>';
    if(data.resolvedTo&&data.resolvedTo.ambiguous)notes+='<div class="ambiguous-note">Znaleziono więcej niż jedną stację o nazwie „'+escapeHtml(data.resolvedTo.name)+'” — pokazano wyniki dla najbardziej prawdopodobnej. Wybierz dokładną stację z podpowiedzi, jeśli to nie ta.</div>';
    (data.resolvedVia||[]).forEach(function(v){
      if(v.ambiguous)notes+='<div class="ambiguous-note">Znaleziono więcej niż jedną stację o nazwie „'+escapeHtml(v.name)+'” dla punktu „przez” — pokazano wyniki dla najbardziej prawdopodobnej.</div>';
    });
    lastNotes=notes;

    if(data.noConnectionFound){
      statusEl.textContent='';
      var msg;
      if(data.viaFailedAt){
        msg='Nie znaleziono połączenia przez „'+escapeHtml(data.viaFailedAt)+'” — spróbuj innej daty/godziny albo usuń ten punkt.';
      }else if(data.lastDepartureToday){
        // Rozroznienie "nic nie ma" od "bylo, ale juz odjechalo" — bez tego
        // uczciwa informacja "ostatni kurs dzis juz minal" wygladala jak awaria.
        msg='Dziś między „'+escapeHtml(data.query.from)+'” a „'+escapeHtml(data.query.to)+'” (przy tych ustawieniach) ostatnie pasujące połączenie odjechało już o '+escapeHtml(data.lastDepartureToday)+'. Wybierz jutrzejszą datę albo zmień ustawienia w „Zaawansowane”.';
      }else{
        msg='Nie znaleziono dziś połączenia między „'+escapeHtml(data.query.from)+'” a „'+escapeHtml(data.query.to)+'”. Spróbuj innej daty, godziny albo zmień ustawienia w „Zaawansowane”.';
      }
      listEl.innerHTML=notes+'<div class="empty">'+msg+'</div>';
      return;
    }

    var parts=[];
    if(data.counts.direct)parts.push(data.counts.direct+' bezpośrednich');
    if(data.counts.transfer)parts.push(data.counts.transfer+' z 1 przesiadką');
    if(data.counts.multiTransfer)parts.push(data.counts.multiTransfer+' z 2 przesiadkami');
    if(data.counts.via)parts.push(data.counts.via+' przez wskazane stacje');
    statusEl.textContent='Znaleziono: '+parts.join(', ')+'.';
    renderVisibleItineraries();
  }

  function renderVisibleItineraries(){
    var listEl=$('resultsList');
    var toShow=lastItineraries.slice(0,visibleCount);
    var remaining=lastItineraries.length-toShow.length;
    var moreHtml=remaining>0
      ? '<button type="button" class="btn-sm" id="loadMoreBtn" style="width:100%;margin-top:4px">⬇️ Pobierz kolejnych '+Math.min(RESULTS_PAGE_SIZE,remaining)+' połączeń ('+remaining+' więcej)</button>'
      : '';
    listEl.innerHTML=lastNotes+toShow.map(function(it,i){return itineraryHtml(it,{index:i})}).join('')+moreHtml;
  }

  $('resultsList').addEventListener('click',function(e){
    if(e.target.closest('#loadMoreBtn')){
      visibleCount+=RESULTS_PAGE_SIZE;
      renderVisibleItineraries();
      return;
    }
    var legRow=e.target.closest('.leg-row');
    if(legRow){
      window.open(legRow.dataset.trainUrl,'_blank');
      return;
    }
    var planBtn=e.target.closest('.itin-addplan');
    if(planBtn){
      var pIdx=Number(planBtn.dataset.idx);
      var pIt=lastItineraries[pIdx];
      if(pIt&&lastQuery){
        addItineraryToJournalPlan(pIt,lastQuery);
        planBtn.textContent='✅ Dodano do dziennika';
        planBtn.disabled=true;
      }
      return;
    }
    var btn=e.target.closest('.itin-save');
    if(!btn)return;
    var idx=Number(btn.dataset.idx);
    var it=lastItineraries[idx];
    if(it&&lastQuery)saveItinerary(it,lastQuery);
  });

  // === Zapisane wyniki ===
  function getSavedResults(){try{var v=JSON.parse(localStorage.getItem(SAVED_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function saveSavedResultsList(list){
    try{localStorage.setItem(SAVED_KEY,JSON.stringify(list))}catch(e){return false}
    if(window.ProfileSync){if(ProfileSync.pushBeacon)ProfileSync.pushBeacon({savedPlannerResults:list});else ProfileSync.push({savedPlannerResults:list})}
    return true;
  }
  function itineraryKey(it,query){
    return [query.from,query.to,query.date,it.departureTime,it.arrivalTime,it.legs.map(function(l){return l.scheduleId+'-'+l.orderId}).join('>')].join('|');
  }
  function saveItinerary(it,query){
    var list=getSavedResults();
    var key=itineraryKey(it,query);
    var entry={_key:key,createdAt:new Date().toISOString(),query:query,snapshot:it};
    var idx=-1;
    for(var i=0;i<list.length;i++){if(list[i]._key===key){idx=i;break}}
    if(idx>=0)list[idx]=entry;else list.push(entry);
    saveSavedResultsList(list);
    renderSavedPanel();
    toggleSaved(true);
  }
  // === Dodanie do planu podróży dzienniczka ===
  // Reużywa DOKŁADNIE tego samego mechanizmu co "Plan podróży" w /dziennik/
  // (ten sam klucz localStorage i pole profilu) — dzięki temu istniejący tam
  // przycisk "✅ Potwierdź" (sprawdzający rzeczywisty status po fakcie,
  // dopiero gdy pociąg naprawdę dojechał) działa bez żadnych zmian w
  // dzienniczku. Jeden wielonogowy wynik planera = jeden wpis planu NA
  // KAŻDĄ nogę (dzienniczek śledzi pojedyncze przejazdy, nie całe trasy).
  var JOURNAL_PLAN_KEY='dziennikPlanPodrozy';
  var TYPICAL_TRIPS_KEY='dziennikTrasyTypowe';
  function getJournalPlan(){try{var v=JSON.parse(localStorage.getItem(JOURNAL_PLAN_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function saveJournalPlan(list){
    try{localStorage.setItem(JOURNAL_PLAN_KEY,JSON.stringify(list))}catch(e){return false}
    if(window.ProfileSync){if(ProfileSync.pushBeacon)ProfileSync.pushBeacon({plannedTrips:list});else ProfileSync.push({plannedTrips:list})}
    return true;
  }
  function normStationPlan(s){return String(s||'').trim().toLowerCase()}
  // Ta sama logika dopasowania co na stronie biegu pociągu (matchTypicalTrip
  // w functions/train.js) — jeśli odcinek odpowiada zapisanej trasie typowej
  // (np. "do pracy"), jej nazwa i kilometraż mają PIERWSZEŃSTWO przed
  // generyczną etykietą "Skąd → Dokąd" z wyszukiwania planera. Bez tego ten
  // sam fizyczny odcinek dostawał dwie różne nazwy w zależności od tego,
  // którą drogą trafił do dzienniczka (zgłoszone na żywo: "do pracy" dla
  // nogi dodanej ręcznie na biegu pociągu, generyczna nazwa planera dla tej
  // samej nogi dodanej przez planer).
  function matchTypicalLegPlan(boardName,alightName){
    var raw;
    try{raw=JSON.parse(localStorage.getItem(TYPICAL_TRIPS_KEY))}catch(e){raw=null}
    var trips=Array.isArray(raw)?raw:(raw&&typeof raw==='object'?['domPraca','pracaDom'].filter(function(id){return raw[id]}).map(function(id){return Object.assign({id:id},raw[id])}):[]);
    var b=normStationPlan(boardName),a=normStationPlan(alightName);
    for(var i=0;i<trips.length;i++){
      var trip=trips[i];
      var legs=trip.leg1?[[1,trip.leg1],[2,trip.leg2]]:(trip.board&&trip.alight?[[1,{board:trip.board,alight:trip.alight,distanceKm:trip.distanceKm}]]:[]);
      for(var j=0;j<legs.length;j++){
        var legNumber=legs[j][0],leg=legs[j][1];
        if(!leg||!leg.board||!leg.alight)continue;
        if(normStationPlan(leg.board)===b&&normStationPlan(leg.alight)===a){
          return{name:trip.name||'trasa',legNumber:legNumber,distanceKm:(leg.distanceKm!=null&&leg.distanceKm!=='')?Number(leg.distanceKm):null};
        }
      }
    }
    return null;
  }
  function addItineraryToJournalPlan(it,query){
    var list=getJournalPlan();
    var genericLabel=(query.from||'')+' → '+(query.to||'');
    it.legs.forEach(function(leg,idx){
      var key=[query.date,leg.scheduleId,leg.orderId].join('|');
      var typical=matchTypicalLegPlan(leg.board.stationName,leg.alight.stationName);
      var entry={
        _key:key,date:query.date,scheduleId:leg.scheduleId,orderId:leg.orderId,
        trainNumber:leg.train.number,category:leg.train.category,
        boardStation:leg.board.stationName,alightStation:leg.alight.stationName,
        plannedDeparture:leg.board.time,plannedArrival:leg.alight.time,
        tripLabel:typical?typical.name:genericLabel,
        legNumber:typical?typical.legNumber:(it.legs.length===2?idx+1:null),
        distanceKm:typical?typical.distanceKm:null,
        createdAt:new Date().toISOString()
      };
      var dupIdx=-1;
      for(var i=0;i<list.length;i++){if(list[i]._key===key){dupIdx=i;break}}
      if(dupIdx>=0)list[dupIdx]=entry;else list.push(entry);
    });
    saveJournalPlan(list);
    return it.legs.length;
  }

  function removeSavedResult(key){
    saveSavedResultsList(getSavedResults().filter(function(e){return e._key!==key}));
    renderSavedPanel();
  }
  function renderSavedPanel(){
    var list=getSavedResults();
    $('savedCount').textContent=list.length;
    var el=$('savedList');
    if(!list.length){el.innerHTML='<div class="empty">Brak zapisanych wyników. Kliknij „💾 Zapisz” przy dowolnym wyniku wyszukiwania.</div>';return}
    el.innerHTML=list.slice().reverse().map(function(e){
      return itineraryHtml(e.snapshot,{savedKey:e._key,savedAt:e.createdAt});
    }).join('');
  }
  $('savedList').addEventListener('click',function(e){
    var legRow=e.target.closest('.leg-row');
    if(legRow){
      window.open(legRow.dataset.trainUrl,'_blank');
      return;
    }
    var planBtn=e.target.closest('.itin-addplan');
    if(planBtn){
      var saved=getSavedResults().find(function(x){return x._key===planBtn.dataset.savedKey});
      if(saved){
        addItineraryToJournalPlan(saved.snapshot,saved.query);
        planBtn.textContent='✅ Dodano do dziennika';
        planBtn.disabled=true;
      }
      return;
    }
    var btn=e.target.closest('.itin-remove');
    if(!btn)return;
    removeSavedResult(btn.dataset.savedKey);
  });

  async function refreshFromProfile(){
    if(window.ProfileSync&&ProfileSync.getToken()){
      try{
        var profile=await ProfileSync.pull();
        if(profile){
          if(Array.isArray(profile.savedPlannerResults)){
            var remote=profile.savedPlannerResults;
            var remoteAt=Date.parse(profile.updatedAt||'')||0;
            var remoteKeys={};
            remote.forEach(function(e){remoteKeys[e._key]=true});
            var pendingLocal=getSavedResults().filter(function(e){return !remoteKeys[e._key]&&Date.parse(e.createdAt||'')>remoteAt});
            var merged=pendingLocal.length?remote.concat(pendingLocal):remote;
            localStorage.setItem(SAVED_KEY,JSON.stringify(merged));
          }else{
            var local=getSavedResults();
            if(local.length)ProfileSync.push({savedPlannerResults:local});
          }
          if(Array.isArray(profile.excludedCarriers)){
            excludedCarriers=new Set(profile.excludedCarriers);
            updateAdvDot();
            var grid=$('carrierGrid');
            if(grid)grid.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=excludedCarriers.has(cb.dataset.code)});
          }
        }
      }catch(e){}
    }
    renderSavedPanel();
  }

  // === Szukaj ===
  function search(){
    var from=selected.from.name||$('fromInput').value.trim();
    var to=selected.to.name||$('toInput').value.trim();
    if(!from||!to){$('resultsStatus').className='status err';$('resultsStatus').textContent='Wpisz stację początkową i docelową.';return}

    hideDropdown('from');hideDropdown('to');
    viaRows.forEach(function(r){hideDropdown(r.key)});

    var btn=$('searchBtn');
    btn.disabled=true;
    $('resultsStatus').className='status';
    $('resultsStatus').textContent='Szukam połączeń...';
    $('resultsList').innerHTML='';

    var params=new URLSearchParams({from:from,to:to,date:$('dateInput').value,time:$('timeInput').value,transferMinutes:$('transferMinutesSelect').value});
    if(selected.from.id)params.set('fromId',selected.from.id);
    if(selected.to.id)params.set('toId',selected.to.id);

    var viaFiltered=viaRows.filter(function(r){return r.name.trim()});
    if(viaFiltered.length){
      params.set('via',viaFiltered.map(function(r){return r.name.trim()}).join(','));
      params.set('viaIds',viaFiltered.map(function(r){return r.id||''}).join(','));
    }
    if(excludedCarriers.size)params.set('excludeCarriers',[...excludedCarriers].join(','));
    if($('directOnlyCheckbox').checked)params.set('maxTransfers','0');

    fetch('/api/planner?'+params.toString(),{headers:{Accept:'application/json'}})
      .then(function(r){return r.json().then(function(data){return {ok:r.ok,data:data}}) })
      .then(function(res){
        btn.disabled=false;
        if(!res.ok||!res.data.ok){
          $('resultsStatus').className='status err';
          $('resultsStatus').textContent=res.data.error||'Błąd wyszukiwania połączeń.';
          return;
        }
        renderResults(res.data);
      })
      .catch(function(){
        btn.disabled=false;
        $('resultsStatus').className='status err';
        $('resultsStatus').textContent='Nie udało się połączyć z API.';
      });
  }
  window.search=search;

  setDefaultDateTime();
  updateAdvSummary();
  loadCarrierPrefs();
  updateAdvDot();
  loadCarriers();
  refreshFromProfile();
  window.addEventListener('pageshow',function(e){if(e.persisted)refreshFromProfile()});
})();
</script>
