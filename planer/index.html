<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="Planer podróży koleją – połączenia bezpośrednie i z przesiadkami w całej sieci PKP PLK, z czasem rzeczywistym tam, gdzie jest już znany." />

<style>
:root{--bg:#101820;--panel:#1c2833;--card:#223244;--line:#34495e;--text:#fff;--muted:#b8c3cf;--blue:#0b57d0;--green:#5dd39e;--yellow:#ffcc00;--red:#ff4d4d;--violet:#c084fc;--grey:#4b5563;--cyan:#22d3ee}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding:18px}
.wrap{max-width:720px;margin:0 auto}
a.back{display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-size:14px}
h1{text-align:center;font-size:26px;margin:6px 0 4px}
.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:15px;font-family:inherit}
input[type=text],input[type=date],input[type=time]{width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;font-family:inherit}
.station-stack{position:relative}
.station-field{position:relative;min-width:0;margin-bottom:12px}
.input-wrap{position:relative}
.input-wrap input{padding-right:38px}
.field-clear{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--red);font-size:15px;cursor:pointer;align-items:center;justify-content:center;line-height:1}
.field-clear.show{display:flex}
.field-clear:hover{background:rgba(255,77,77,.12)}
.swap-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:6;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.swap-btn:hover{background:#2a3b4d}
.station-dropdown{display:none;position:absolute;z-index:10000;top:calc(100% + 4px);left:0;right:0;background:#172433;border:1px solid #48627c;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.45);max-height:280px;overflow:auto;text-align:left}
.station-dropdown.open{display:block}
.station-dd-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;color:#fff;padding:10px 12px;text-align:left;cursor:pointer;font-family:inherit}
.station-dd-item:hover,.station-dd-item.active{background:#223244}
.station-dd-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station-dd-id{opacity:.65;font-size:12px}
.date-time-row{display:flex;gap:8px;margin-bottom:12px}
.date-time-row>div{flex:1}
.trips-panel{padding:0;overflow:hidden;margin:0 0 14px;background:var(--card)}
.trips-toggle{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--text);padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit}
.trips-toggle:hover{background:rgba(255,255,255,.04)}
.trips-toggle-icon{font-size:18px}
.trips-toggle-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.trips-toggle-title{font-size:14px;font-weight:800}
.adv-dot{display:none;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:7px;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,77,77,.25)}
.adv-dot.show{display:inline-block}
.trips-toggle-summary{font-size:12px;color:var(--muted)}
.trips-chevron{display:inline-block;font-size:14px;line-height:1;transition:transform .3s ease}
.trips-panel.open>.trips-toggle .trips-chevron{transform:rotate(180deg)}
.trips-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.trips-panel.open>.trips-body{grid-template-rows:1fr}
.trips-body-inner{overflow:hidden;min-height:0}
.trips-content{padding:2px 14px 14px;border-top:1px solid var(--line)}
.sub-panel{border-radius:9px;margin:12px 0 0}
.sub-panel .trips-toggle{padding:9px 11px}
.sub-panel .trips-toggle-icon{font-size:15px}
.sub-panel .trips-toggle-title{font-size:13px}
.sub-panel .trips-toggle-summary{font-size:11.5px}
.sub-panel .trips-content{padding:2px 11px 11px}
@media(prefers-reduced-motion:reduce){.trips-body,.trips-chevron{transition:none}}
.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;font-size:15px;width:100%}
#searchBtn{box-shadow:0 4px 16px rgba(11,87,208,.45);font-size:16px}
.btn:hover{background:#084298}
.btn:disabled{opacity:.6;cursor:default}
.btn-sm{border:0;border-radius:8px;padding:8px 12px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:12.5px}
.btn-sm:hover{background:#084298}
.btn-sm.secondary{background:#4b5563}
.btn-sm.secondary:hover{background:#5b6472}
.btn-sm:disabled{opacity:.5;cursor:default}
.status{text-align:center;color:var(--muted);min-height:20px;margin:10px 0;font-size:13.5px}
.status.searching{color:#ffd400;font-weight:700;font-size:15px;animation:searchingBlink 1s ease-in-out infinite}
.status.searching::before{content:"🔎 "}
@keyframes searchingBlink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.searching{animation:none}}
#resultsStatus{scroll-margin-top:8px}
.status.err{color:var(--red)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.6}
.muted-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;text-align:center}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.itin-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.itin-time{font-size:21px;font-weight:900}
.itin-arrow{color:var(--muted);font-size:16px}
.itin-dur{font-size:12.5px;color:var(--muted);margin-left:4px}
.itin-nextday{font-size:11px;color:var(--yellow);font-weight:800}
.itin-badge{margin-left:auto;border-radius:999px;padding:3px 11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.itin-badge.direct{background:rgba(93,211,158,.18);color:var(--green)}
.itin-badge.transfer{background:rgba(192,132,252,.18);color:var(--violet)}
.itin-badge.multi-transfer{background:rgba(192,132,252,.28);color:var(--violet)}
.itin-badge.via{background:rgba(34,211,238,.18);color:var(--cyan)}
.leg-row{display:grid;grid-template-columns:56px 1fr;gap:3px 10px;align-items:center;margin-top:8px;padding:10px 11px;background:rgba(255,255,255,.04);border-radius:9px;cursor:pointer}
.leg-row:hover,.leg-row:active{background:rgba(255,255,255,.1)}
.leg-time{display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:14px;line-height:1.3}
.leg-time .leg-arr{color:var(--muted);font-size:12px;font-weight:700}
.leg-main{min-width:0}
.leg-train-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.leg-train-num{font-weight:800;font-size:13.5px}
.leg-train-name{color:var(--muted);font-size:12px}
.leg-direction{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itin-transfer{font-size:12px;color:var(--cyan);text-align:center;margin:4px 0;font-weight:700}
.risk-safe{color:var(--green);font-weight:800}
.risk-tight{color:var(--yellow);font-weight:800}
.risk-missed{color:var(--red);font-weight:900}
.ambiguous-note{font-size:12.5px;color:var(--yellow);margin:0 0 10px;text-align:center}
.faster-hint{display:block;width:100%;margin-top:8px;text-align:left;background:rgba(255,212,0,.12);border:1px solid #ffd400;color:#ffd400;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;animation:fasterPulse 1.2s ease-in-out 4}
.faster-hint.transfer{background:rgba(192,132,252,.12);border-color:var(--violet);color:var(--violet);font-weight:500;animation:none}
@keyframes fasterPulse{50%{box-shadow:0 0 0 4px rgba(255,212,0,.35)}}
.entry.flash{animation:entryFlash 1.8s ease-out}
@keyframes entryFlash{0%{box-shadow:0 0 0 3px #ffd400}100%{box-shadow:0 0 0 0 rgba(255,212,0,0)}}
@media (prefers-reduced-motion:reduce){.faster-hint,.entry.flash{animation:none}}
.itin-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:8px}
.saved-at{font-size:11.5px;color:var(--muted);margin-top:6px;font-style:italic}
.history-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.history-entry:last-child{margin-bottom:0}
.history-info{min-width:0}
.history-route{font-weight:800;font-size:14px}
.history-meta{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-rerun{flex:0 0 auto;border:1.5px solid var(--blue);background:transparent;color:#8fb8f5;border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.history-rerun:hover{background:rgba(11,87,208,.18)}
.via-row{margin-bottom:8px}
.via-row .station-field{margin-bottom:0}
.via-remove{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--red);border-radius:9px;width:42px;height:42px;font-size:16px;cursor:pointer}
.via-remove:hover{background:#2a3b4d}
.via-advanced-toggle{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:9px;width:42px;height:42px;font-size:16px;cursor:pointer}
.via-advanced-toggle:hover,.via-advanced-toggle.open{background:#2a3b4d;border-color:var(--blue)}
.via-advanced{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:-2px 0 10px}
.via-advanced .carrier-grid{margin-top:4px}
.carrier-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:4px}
@media(max-width:480px){.carrier-grid{grid-template-columns:1fr}}
.carrier-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#d8e2ee;cursor:pointer}
.carrier-chip input{width:auto;margin:0}
.adv-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.adv-section-title{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
</style>

<body>
<div class="wrap">
  <a class="back" href="/" data-i18n="planer.back">← Tablica</a>
  <h1 data-i18n="planer.title">🧭 Planer podróży</h1>
  <div class="subtitle" data-i18n="planer.subtitle">Szuka połączeń bezpośrednich i z przesiadką(ami) na podstawie rozkładu PLK, z czasem rzeczywistym tam, gdzie już jest znany.</div>

  <div class="panel">
    <div class="station-stack">
      <div class="station-field">
        <label for="fromInput" data-i18n="planer.from">Skąd</label>
        <div class="input-wrap">
          <input id="fromInput" type="text" placeholder="Nazwa stacji..." data-i18n-attr="placeholder:planer.stationPlaceholder" autocomplete="off">
          <button type="button" class="field-clear" data-side="from" title="Wyczyść" data-i18n-attr="title:planer.clear">✕</button>
        </div>
        <div class="station-dropdown" id="fromDropdown"></div>
      </div>
      <div class="station-field">
        <label for="toInput" data-i18n="planer.to">Dokąd</label>
        <div class="input-wrap">
          <input id="toInput" type="text" placeholder="Nazwa stacji..." data-i18n-attr="placeholder:planer.stationPlaceholder" autocomplete="off">
          <button type="button" class="field-clear" data-side="to" title="Wyczyść" data-i18n-attr="title:planer.clear">✕</button>
        </div>
        <div class="station-dropdown" id="toDropdown"></div>
      </div>
      <button type="button" class="swap-btn" id="swapBtn" title="Zamień miejscami" data-i18n-attr="title:planer.swap">⇅</button>
    </div>
    <div class="date-time-row">
      <div><label for="dateInput" data-i18n="planer.date">Data</label><input id="dateInput" type="date"></div>
      <div><label for="timeInput" data-i18n="planer.fromTime">Od godziny</label><input id="timeInput" type="time"></div>
    </div>
    <div class="trips-panel" id="advPanel">
      <button type="button" class="trips-toggle" id="advToggle" aria-expanded="false" onclick="toggleAdv()">
        <span class="trips-toggle-icon" aria-hidden="true">⚙️</span>
        <span class="trips-toggle-text"><span class="trips-toggle-title"><span data-i18n="planer.adv">Zaawansowane</span><span class="adv-dot" id="advDot" title="Aktywne ustawienie niedomyślne" data-i18n-attr="title:planer.advDotTitle"></span></span><span class="trips-toggle-summary" id="advSummary">Min. czas na przesiadkę: 3 min</span></span>
        <span class="trips-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="trips-body" id="advBody"><div class="trips-body-inner"><div class="trips-content">
        <label for="transferMinutesSelect" data-i18n="planer.minTransfer">Minimalny czas na przesiadkę</label>
        <select id="transferMinutesSelect">
          <option value="0">0 min</option>
          <option value="3" selected>3 min</option>
          <option value="5">5 min</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
          <option value="25">25 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
        </select>

        <div class="adv-section">
          <label class="carrier-chip"><input type="checkbox" id="directOnlyCheckbox"> <span data-i18n="planer.directOnly">Tylko połączenia bezpośrednie (bez przesiadek)</span></label>
        </div>

        <div class="trips-panel sub-panel" id="viaPanel">
          <button type="button" class="trips-toggle" id="viaToggle" aria-expanded="false" onclick="toggleViaPanel()">
            <span class="trips-toggle-icon" aria-hidden="true">🔀</span>
            <span class="trips-toggle-text"><span class="trips-toggle-title" data-i18n="planer.via">Przez stację</span><span class="trips-toggle-summary" id="viaSummary">Opcjonalnie</span></span>
            <span class="trips-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="trips-body" id="viaBody"><div class="trips-body-inner"><div class="trips-content">
            <div id="viaContainer"></div>
            <button type="button" class="btn-sm secondary" id="addViaBtn" onclick="addViaStation()" data-i18n="planer.addVia">➕ Dodaj stację</button>
          </div></div></div>
        </div>

        <div class="trips-panel sub-panel" id="carrierPanel">
          <button type="button" class="trips-toggle" id="carrierToggle" aria-expanded="false" onclick="toggleCarrierPanel()">
            <span class="trips-toggle-icon" aria-hidden="true">🚫</span>
            <span class="trips-toggle-text"><span class="trips-toggle-title" data-i18n="planer.carriers">Wyklucz przewoźników</span><span class="trips-toggle-summary" id="carrierSummary">Żaden nie wykluczony</span></span>
            <span class="trips-chevron" aria-hidden="true">▾</span>
          </button>
          <div class="trips-body" id="carrierBody"><div class="trips-body-inner"><div class="trips-content">
            <div class="carrier-grid" id="carrierGrid"><div class="muted-note" data-i18n="planer.carriersLoading">Ładowanie listy przewoźników...</div></div>
          </div></div></div>
        </div>
      </div></div></div>
    </div>
    <button type="button" class="btn" id="searchBtn" onclick="search()" data-i18n="planer.searchBtn">🔎 Szukaj połączeń</button>
  </div>

  <div class="trips-panel" id="historyPanel">
    <button type="button" class="trips-toggle" id="historyToggle" aria-expanded="false" onclick="toggleHistory()">
      <span class="trips-toggle-icon" aria-hidden="true">🕘</span>
      <span class="trips-toggle-text"><span class="trips-toggle-title"><span data-i18n="planer.history">Ostatnie wyszukiwania</span> (<span id="historyCount">0</span>)</span><span class="trips-toggle-summary" data-i18n="planer.historySummary">Szybki powrót do wcześniejszych tras</span></span>
      <span class="trips-chevron" aria-hidden="true">▾</span>
    </button>
    <div class="trips-body" id="historyBody"><div class="trips-body-inner"><div class="trips-content">
      <div id="historyList"></div>
    </div></div></div>
  </div>

  <div id="resultsStatus" class="status"></div>
  <div id="resultsList"></div>

  <div class="trips-panel" id="savedPanel">
    <button type="button" class="trips-toggle" id="savedToggle" aria-expanded="false" onclick="toggleSaved()">
      <span class="trips-toggle-icon" aria-hidden="true">📌</span>
      <span class="trips-toggle-text"><span class="trips-toggle-title"><span data-i18n="planer.saved">Zapisane wyniki</span> (<span id="savedCount">0</span>)</span><span class="trips-toggle-summary" data-i18n="planer.savedSummary">Do późniejszego przejrzenia</span></span>
      <span class="trips-chevron" aria-hidden="true">▾</span>
    </button>
    <div class="trips-body" id="savedBody"><div class="trips-body-inner"><div class="trips-content">
      <div id="savedList"></div>
    </div></div></div>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/burger-menu.js"></script>
<script src="/profile-sync.js"></script>
<script src="/tutorial.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  // Tłumaczenia (i18n.js); bez słownika — sam klucz, żeby błąd był widoczny.
  function T(k,p){return window.I18n?I18n.t(k,p):k}
  function TP(k,n,p){return window.I18n?I18n.tp(k,n,p):k}
  function dateLocale(){var l=window.I18n?I18n.getLang():'pl';return {pl:'pl-PL',en:'en-GB',de:'de-DE',cs:'cs-CZ',es:'es-ES',uk:'uk-UA'}[l]||'pl-PL'}
  var selected={from:{id:'',name:''},to:{id:'',name:''}};
  var searchTimers={};
  var viaRows=[];
  var viaCounter=0;
  var excludedCarriers=new Set();
  var lastItineraries=[];
  var lastQuery=null;
  var SAVED_KEY='planerZapisaneTrasy';
  var HISTORY_KEY='planerOstatnieWyszukiwania';
  var HISTORY_MAX=5;
  var CARRIERS_KEY='planerWykluczeniPrzewoznicy';

  function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}

  function todayYYYYMMDD(){
    var n=new Date();
    return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  }

  function setDefaultDateTime(){
    var n=new Date(),h=String(n.getHours()).padStart(2,'0'),i=String(n.getMinutes()).padStart(2,'0');
    $('dateInput').value=todayYYYYMMDD();
    $('timeInput').value=h+':'+i;
  }

  // Zmiana daty na inną niż dzisiejsza z pozostawioną "teraz" (np. 22:36) w
  // polu godziny w praktyce odcinała niemal wszystkie połączenia następnego
  // dnia — godzina ma sens tylko razem z datą, więc reset przy każdej
  // zmianie daty, tak samo jak domyślne zachowanie samego /api/planner.
  $('dateInput').addEventListener('change',function(){
    var n=new Date();
    if(this.value===todayYYYYMMDD()){
      $('timeInput').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    }else{
      $('timeInput').value='00:00';
    }
  });

  function toggleAdv(){
    var panel=$('advPanel');
    var open=!panel.classList.contains('open');
    panel.classList.toggle('open',open);
    $('advToggle').setAttribute('aria-expanded',open?'true':'false');
  }
  window.toggleAdv=toggleAdv;

  function toggleSaved(force){
    var panel=$('savedPanel');
    var open=typeof force==='boolean'?force:!panel.classList.contains('open');
    panel.classList.toggle('open',open);
    $('savedToggle').setAttribute('aria-expanded',open?'true':'false');
  }

  function renderDropdown(side,stations,onPick){
    var el=$(side+'Dropdown')||document.querySelector('.station-dropdown[data-key="'+side+'"]');
    if(!el)return;

  function hideDropdown(side){

  // Klawiatura na liście podpowiedzi: ↓/↑ przesuwa zaznaczenie, Enter
  // wybiera zaznaczoną (albo pierwszą) stację, Esc zamyka listę.
  // `afterPick` — co dalej po Enterze (np. start wyszukiwania).
  function handleDropdownKey(e,side,afterPick){
    var el=$(side+'Dropdown')||document.querySelector('.station-dropdown[data-key="'+side+'"]');
    var items=el&&el.classList.contains('open')?[].slice.call(el.querySelectorAll('.station-dd-item')):[];
    var cur=items.findIndex(function(b){return b.classList.contains('active')});
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!items.length)return;
      e.preventDefault();
      var next=e.key==='ArrowDown'?Math.min(cur+1,items.length-1):Math.max(cur-1,0);
      items.forEach(function(b,i){b.classList.toggle('active',i===next)});
      items[next].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      clearTimeout(searchTimers[side]);
      if(items.length)items[cur>=0?cur:0].click();
      if(afterPick)afterPick();
    }else if(e.key==='Escape'){
      hideDropdown(side);
    }
  }

  // === Render wyników ===
  function shortDur(min){

  // Cała "karta" nogi trasy jest klikalna (jak wiersz w Moich pociągach) i
  // ma wyglądać jak rekord z tablicy odjazdów: czas, numer/kategoria i nazwa
  // pociągu, kierunek. Kliknięcie otwiera pełne szczegóły kursu w nowej
  // karcie (ten sam URL co na tablicy), bez gubienia wyników wyszukiwania.
  function legHtml(leg){
    var tr=[leg.train.category,leg.train.number].filter(Boolean).join(' ');
    return '<div class="leg-row" data-train-url="'+escapeHtml(leg.trainUrl)+'" title="'+escapeHtml(T('planer.legTitle'))+'">'+

      '<div class="leg-main">'+
        '<div class="leg-train-row"><span class="leg-train-num">'+escapeHtml(tr)+'</span>'+(leg.train.name?'<span class="leg-train-name">'+escapeHtml(leg.train.name)+'</span>':'')+'</div>'+

  function badgeHtml(it){
    if(it.type==='direct')return '<span class="itin-badge direct">'+escapeHtml(T('planer.badgeDirect'))+'</span>';
    if(it.type==='transfer')return '<span class="itin-badge transfer">'+escapeHtml(T('planer.badgeTransfer'))+'</span>';
    if(it.type==='multi-transfer')return '<span class="itin-badge multi-transfer">'+escapeHtml(TP('planer.badgeMulti',(it.transfers||[]).length))+'</span>';
    if(it.type==='via')return '<span class="itin-badge via">'+escapeHtml(T('planer.badgeVia',{n:(it.transfers||[]).length}))+'</span>';
    return '';

  function riskHtml(t){
    if(!t.liveDataAvailable)return '';
    if(t.liveRisk==='safe')return ' <span class="risk-safe">'+escapeHtml(T('planer.riskSafe'))+'</span>';
    if(t.liveRisk==='tight')return ' <span class="risk-tight">'+escapeHtml(T('planer.riskTight',{min:t.realBufferMinutes}))+'</span>';
    if(t.liveRisk==='missed')return ' <span class="risk-missed">'+escapeHtml(T('planer.riskMissed'))+'</span>';
    return '';
  }

  // Szybszy pociąg BEZPOŚREDNI w tych samych wynikach: odjeżdża później,
  // a dojeżdża wcześniej (np. Os 40678 15:01→16:57 vs OsP 40122 15:28→16:43).
  // Wolniejszego nie ukrywamy — to tylko podpowiedź. Spośród szybszych
  // wybieramy ten z najwcześniejszym przyjazdem.
  function itinMinutes(t,nextDay){var m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2])+(nextDay?1440:0):null}
  function fasterDirectFor(idx){
    var it=lastItineraries[idx];
    if(!it||it.type!=='direct')return null;
    var dep=itinMinutes(it.departureTime),arr=itinMinutes(it.arrivalTime,it.arrivalNextDay);
    if(dep==null||arr==null)return null;
    var best=null;
    lastItineraries.forEach(function(o,j){
      if(j===idx||o.type!=='direct')return;
      var oDep=itinMinutes(o.departureTime),oArr=itinMinutes(o.arrivalTime,o.arrivalNextDay);
      if(oDep==null||oArr==null||oDep<=dep||oArr>=arr)return;
      if(!best||oArr<best.arr)best={idx:j,it:o,arr:oArr,gain:arr-oArr};
    });
    return best;
  }
  function fasterHintHtml(idx){
    var f=fasterDirectFor(idx);
    if(!f)return '';
    var leg=f.it.legs[0]||{train:{}};
    var tr=[leg.train.category,leg.train.number].filter(Boolean).join(' ');
    return '<button type="button" class="faster-hint" data-target="'+f.idx+'">'+escapeHtml(T('planer.hintFaster',{train:tr,dep:f.it.departureTime,arr:f.it.arrivalTime,gain:f.gain}))+'</button>';
  }
  // Szybszy wariant Z PRZESIADKĄ (≥10 min wcześniej, odjazd nie wcześniej).
  // Słabsza podpowiedź niż ⚡ — przesiadka to opcja dla chętnych. Pomijamy
  // wariant, którego przesiadka na żywo jest oznaczona jako "nie zdążysz".
  var TRANSFER_HINT_MIN_GAIN=10;
  function fasterTransferFor(idx){
    var it=lastItineraries[idx];
    if(!it)return null;
    var dep=itinMinutes(it.departureTime),arr=itinMinutes(it.arrivalTime,it.arrivalNextDay);
    if(dep==null||arr==null)return null;
    var best=null;
    lastItineraries.forEach(function(o,j){
      if(j===idx||o.type!=='transfer')return;
      var t=(o.transfers||[])[0];
      if(t&&t.liveRisk==='missed')return;
      var oDep=itinMinutes(o.departureTime),oArr=itinMinutes(o.arrivalTime,o.arrivalNextDay);
      if(oDep==null||oArr==null||oDep<dep||arr-oArr<TRANSFER_HINT_MIN_GAIN)return;
      if(!best||oArr<best.arr)best={idx:j,it:o,arr:oArr,gain:arr-oArr};
    });
    return best;
  }
  function transferHintHtml(idx){
    var f=fasterTransferFor(idx);
    if(!f)return '';
    var it=lastItineraries[idx],o=f.it,t=(o.transfers||[])[0]||{};
    var trainOf=function(leg){return [leg.train.category,leg.train.number].filter(Boolean).join(' ')};
    var first=it.legs[0],oFirst=o.legs[0],oSecond=o.legs[1]||oFirst;
    var sameFirst=first&&oFirst&&first.scheduleId===oFirst.scheduleId&&first.orderId===oFirst.orderId;
    var text=sameFirst
      ?escapeHtml(T('planer.hintTransferSame',{station:t.stationName||'',train:trainOf(oSecond),arr:o.arrivalTime}))
      :escapeHtml(T('planer.hintTransferOther',{station:t.stationName||'',dep:o.departureTime,arr:o.arrivalTime}));
    var tight=t.liveRisk==='tight'?escapeHtml(T('planer.hintTight',{min:t.realBufferMinutes})):'';
    return '<button type="button" class="faster-hint transfer" data-target="'+f.idx+'">'+text+escapeHtml(T('planer.hintGain',{gain:f.gain}))+tight+' ›</button>';
  }
  function showItinerary(idx){
    if(idx>=visibleCount){visibleCount=Math.ceil((idx+1)/RESULTS_PAGE_SIZE)*RESULTS_PAGE_SIZE;renderVisibleItineraries()}
    var el=document.getElementById('itin-'+idx);
    if(!el)return;
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  }

  function itineraryHtml(it,opts){
    opts=opts||{};
    var transfers=it.transfers||[];
    var legsHtml='';
    it.legs.forEach(function(leg,idx){
      legsHtml+=legHtml(leg);
      if(idx<it.legs.length-1&&transfers[idx]){
        var t=transfers[idx];

  function itineraryKey(it,query){
    return [query.from,query.to,query.date,it.departureTime,it.arrivalTime,it.legs.map(function(l){return l.scheduleId+'-'+l.orderId}).join('>')].join('|');

  function saveItinerary(it,query){

  // === Dodanie do planu podróży dzienniczka ===
  // Reużywa DOKŁADNIE tego samego mechanizmu co "Plan podróży" w /dziennik/
  // (ten sam klucz localStorage i pole profilu) — dzięki temu istniejący tam
  // przycisk "✅ Potwierdź" (sprawdzający rzeczywisty status po fakcie,
  // dopiero gdy pociąg naprawdę dojechał) działa bez żadnych zmian w
  // dzienniczku. Jeden wielonogowy wynik planera = jeden wpis planu NA
  // KAŻDĄ nogę (dzienniczek śledzi pojedyncze przejazdy, nie całe trasy).
  var JOURNAL_PLAN_KEY='dziennikPlanPodrozy';
  var TYPICAL_TRIPS_KEY='dziennikTrasyTypowe';
  function getJournalPlan(){try{var v=JSON.parse(localStorage.getItem(JOURNAL_PLAN_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function saveJournalPlan(list){
    try{localStorage.setItem(JOURNAL_PLAN_KEY,JSON.stringify(list))}catch(e){return false}
    if(window.ProfileSync){if(ProfileSync.pushBeacon)ProfileSync.pushBeacon({plannedTrips:list});else ProfileSync.push({plannedTrips:list})}
    return true;
  }
  function normStationPlan(s){return String(s||'').trim().toLowerCase()}
  // Ta sama logika dopasowania co na stronie biegu pociągu (matchTypicalTrip
  // w functions/train.js) — jeśli odcinek odpowiada zapisanej trasie typowej
  // (np. "do pracy"), jej nazwa i kilometraż mają PIERWSZEŃSTWO przed
  // generyczną etykietą "Skąd → Dokąd" z wyszukiwania planera. Bez tego ten
  // sam fizyczny odcinek dostawał dwie różne nazwy w zależności od tego,
  // którą drogą trafił do dzienniczka (zgłoszone na żywo: "do pracy" dla
  // nogi dodanej ręcznie na biegu pociągu, generyczna nazwa planera dla tej
  // samej nogi dodanej przez planer).
  function matchTypicalLegPlan(boardName,alightName){
    var raw;
    try{raw=JSON.parse(localStorage.getItem(TYPICAL_TRIPS_KEY))}catch(e){raw=null}
    var trips=Array.isArray(raw)?raw:(raw&&typeof raw==='object'?['domPraca','pracaDom'].filter(function(id){return raw[id]}).map(function(id){return Object.assign({id:id},raw[id])}):[]);
    var b=normStationPlan(boardName),a=normStationPlan(alightName);
    for(var i=0;i<trips.length;i++){
      var trip=trips[i];
      var legs=trip.leg1?[[1,trip.leg1],[2,trip.leg2]]:(trip.board&&trip.alight?[[1,{board:trip.board,alight:trip.alight,distanceKm:trip.distanceKm}]]:[]);
      for(var j=0;j<legs.length;j++){
        var legNumber=legs[j][0],leg=legs[j][1];
        if(!leg||!leg.board||!leg.alight)continue;
        if(normStationPlan(leg.board)===b&&normStationPlan(leg.alight)===a){
          return{name:trip.name||'trasa',legNumber:legNumber,distanceKm:(leg.distanceKm!=null&&leg.distanceKm!=='')?Number(leg.distanceKm):null};
        }
      }
    }
    return null;
  }
  // Ten sam przejazd = ta sama data, numer pociągu i para stacji (albo ten
  // sam _key). Klucz w formacie strony biegu pociągu (journeyKey w
  // functions/train.js) — wcześniej planer używał krótszego klucza bez
  // stacji, więc potwierdzony z planu wpis nie rozpoznawał już istniejącego
  // w dzienniczku i powstawał duplikat.
  function sameJourneyPlan(a,b){
    return a._key===b._key||(a.date===b.date&&String(a.trainNumber||'')===String(b.trainNumber||'')&&
      normStationPlan(a.boardStation)===normStationPlan(b.boardStation)&&normStationPlan(a.alightStation)===normStationPlan(b.alightStation));
  }
  function getJournalEntriesPlan(){try{var v=JSON.parse(localStorage.getItem('dziennikPodrozy'));return Array.isArray(v)?v:[]}catch(e){return[]}}
  // Zwraca liczbę faktycznie dodanych nóg — nogi, które już są w
  // dzienniczku, pomijamy (nie trafiają drugi raz do planu).
  function addItineraryToJournalPlan(it,query){
    var list=getJournalPlan();
    var journal=getJournalEntriesPlan();
    var genericLabel=(query.from||'')+' → '+(query.to||'');
    var added=0;
    it.legs.forEach(function(leg,idx){
      var key=[query.date,leg.scheduleId,leg.orderId,normStationPlan(leg.board.stationName),normStationPlan(leg.alight.stationName)].join('|');
      var typical=matchTypicalLegPlan(leg.board.stationName,leg.alight.stationName);
      var entry={
        _key:key,date:query.date,scheduleId:leg.scheduleId,orderId:leg.orderId,
        trainNumber:leg.train.number,category:leg.train.category,
        boardStation:leg.board.stationName,alightStation:leg.alight.stationName,
        plannedDeparture:leg.board.time,plannedArrival:leg.alight.time,
        tripLabel:typical?typical.name:genericLabel,
        legNumber:typical?typical.legNumber:(it.legs.length===2?idx+1:null),
        distanceKm:typical?typical.distanceKm:null,
        createdAt:new Date().toISOString()
      };
      if(journal.some(function(j){return sameJourneyPlan(j,entry)}))return;
      var dupIdx=-1;
      for(var i=0;i<list.length;i++){if(sameJourneyPlan(list[i],entry)){dupIdx=i;break}}
      if(dupIdx>=0)list[dupIdx]=entry;else list.push(entry);
      added++;
    });
    saveJournalPlan(list);
    return added;
  }

  // === Ostatnie wyszukiwania ===
  function getSearchHistory(){try{var v=JSON.parse(localStorage.getItem(HISTORY_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function saveSearchHistoryList(list){
    try{localStorage.setItem(HISTORY_KEY,JSON.stringify(list))}catch(e){return false}
    if(window.ProfileSync){if(ProfileSync.pushBeacon)ProfileSync.pushBeacon({plannerSearchHistory:list});else ProfileSync.push({plannerSearchHistory:list})}
    return true;

  function historySignature(q){
    return[q.from,q.to,(q.via||[]).join('>'),q.date,q.time,q.transferMinutes,q.maxTransfers,(q.excludeCarriers||[]).slice().sort().join(',')].join('|');
  }
  function recordSearchHistory(query,resolvedFrom,resolvedTo){
    var sig=historySignature(query);
    var list=getSearchHistory().filter(function(e){return e.sig!==sig});
    list.unshift({
      sig:sig,
      query:query,
      fromId:resolvedFrom?resolvedFrom.id:'',
      toId:resolvedTo?resolvedTo.id:'',
      searchedAt:new Date().toISOString()
    });
    if(list.length>HISTORY_MAX)list=list.slice(0,HISTORY_MAX);
    saveSearchHistoryList(list);
    renderHistoryPanel();
  }
  function historyEntryHtml(e,idx){
    var q=e.query;
    var dateFmt=(function(){var p=String(q.date||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:q.date})();
    var metaBits=[];
    if(q.transferMinutes!=null&&Number(q.transferMinutes)!==3)metaBits.push(T('planer.historyBuffer',{min:q.transferMinutes}));
    if(q.maxTransfers===0||q.maxTransfers==='0')metaBits.push(T('planer.historyDirectOnly'));
    if((q.via||[]).length)metaBits.push(T('planer.historyVia',{list:q.via.join(', ')}));
    if((q.excludeCarriers||[]).length)metaBits.push(TP('planer.historyExcluded',q.excludeCarriers.length));
    var metaTxt=metaBits.length?(' · '+metaBits.join(' · ')):'';
    return '<div class="history-entry">'+
      '<div class="history-info">'+
        '<div class="history-route">'+escapeHtml(q.from)+' → '+escapeHtml(q.to)+'</div>'+
        '<div class="history-meta">'+escapeHtml(T('planer.historyWhen',{date:dateFmt,time:q.time}))+escapeHtml(metaTxt)+'</div>'+
      '</div>'+
      '<button type="button" class="history-rerun" data-idx="'+idx+'">'+escapeHtml(T('planer.rerun'))+'</button>'+
      '</div>';
  }
  function renderHistoryPanel(){
    var list=getSearchHistory();
    $('historyCount').textContent=list.length;
    var el=$('historyList');
    el.innerHTML=list.length?list.map(historyEntryHtml).join(''):'<div class="empty">'+escapeHtml(T('planer.historyEmpty'))+'</div>';

  function rerunHistoryEntry(idx){

  async function refreshFromProfile(){
    if(window.ProfileSync&&ProfileSync.getToken()){
      try{
        var profile=await ProfileSync.pull();
        if(profile){
          if(Array.isArray(profile.savedPlannerResults)){
            var remote=profile.savedPlannerResults;
            var remoteAt=Date.parse(profile.updatedAt||'')||0;
            var remoteKeys={};
            remote.forEach(function(e){remoteKeys[e._key]=true});
            var pendingLocal=getSavedResults().filter(function(e){return !remoteKeys[e._key]&&Date.parse(e.createdAt||'')>remoteAt});
            var merged=pendingLocal.length?remote.concat(pendingLocal):remote;
            localStorage.setItem(SAVED_KEY,JSON.stringify(merged));
          }else{
            var local=getSavedResults();
            if(local.length)ProfileSync.push({savedPlannerResults:local});
          }
          if(Array.isArray(profile.excludedCarriers)){
            excludedCarriers=new Set(profile.excludedCarriers);
            updateAdvDot();
            updateCarrierSummary();
            var grid=$('carrierGrid');
            if(grid)grid.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=excludedCarriers.has(cb.dataset.code)});
          }
          if(Array.isArray(profile.plannerSearchHistory)){
            var remoteH=profile.plannerSearchHistory;
            var remoteSigs={};
            remoteH.forEach(function(e){remoteSigs[e.sig]=true});
            var localOnly=getSearchHistory().filter(function(e){return !remoteSigs[e.sig]});
            var mergedH=remoteH.concat(localOnly)
              .sort(function(a,b){return(Date.parse(b.searchedAt||'')||0)-(Date.parse(a.searchedAt||'')||0)})
              .slice(0,HISTORY_MAX);
            localStorage.setItem(HISTORY_KEY,JSON.stringify(mergedH));
          }else{
            var localH=getSearchHistory();
            if(localH.length)ProfileSync.push({plannerSearchHistory:localH});
          }
        }
      }catch(e){}
    }
    renderSavedPanel();
    renderHistoryPanel();
  }

  // Linia statusu ("Szukam połączeń...", potem "Znaleziono: ...") na samą
  // górę ekranu — żeby po wyszukaniu nie przewijać ręcznie przez formularz
  // z kryteriami. requestAnimationFrame: po wyrenderowaniu wyników, gdy
  // wysokość strony jest już ostateczna.
  function scrollToResults(){
    requestAnimationFrame(function(){
      $('resultsStatus').scrollIntoView({behavior:'smooth',block:'start'});
    });
  }

  // === Szukaj ===
  function search(){
    var from=selected.from.name||$('fromInput').value.trim();
    var to=selected.to.name||$('toInput').value.trim();
    if(!from||!to){$('resultsStatus').className='status err';$('resultsStatus').textContent=T('planer.enterStations');return}

    hideDropdown('from');hideDropdown('to');
    viaRows.forEach(function(r){hideDropdown(r.key)});

    var btn=$('searchBtn');
    btn.disabled=true;
    // Mrugający, żółty napis — zwykły szary tekst łatwo przeoczyć na ekranie.
    $('resultsStatus').className='status searching';
    $('resultsStatus').textContent=T('planer.searching');
    lastCounts=null;
    $('resultsList').innerHTML='';
    scrollToResults();

    var params=new URLSearchParams({from:from,to:to,date:$('dateInput').value,time:$('timeInput').value,transferMinutes:$('transferMinutesSelect').value});
    if(selected.from.id)params.set('fromId',selected.from.id);
    if(selected.to.id)params.set('toId',selected.to.id);

    var viaFiltered=viaRows.filter(function(r){return r.name.trim()});
    if(viaFiltered.length){
      params.set('via',viaFiltered.map(function(r){return r.name.trim()}).join(','));
      params.set('viaIds',viaFiltered.map(function(r){return r.id||''}).join(','));
      params.set('viaTransferMinutes',viaFiltered.map(function(r){return r.transferMinutes==null?'':r.transferMinutes}).join(','));
      params.set('viaExcludeCarriers',viaFiltered.map(function(r){return(r.excludeCarriers||[]).join(',')}).join(';'));
    }
    if(excludedCarriers.size)params.set('excludeCarriers',[...excludedCarriers].join(','));
    if($('directOnlyCheckbox').checked)params.set('maxTransfers','0');

    // Błąd bez komunikatu z naszego API (np. przekroczony limit czasu
    // Cloudflare przy pierwszym, nieskeszowanym wyszukiwaniu długiej trasy)
    // ponawiamy raz automatycznie — druga próba korzysta z rozkładów, które
    // pierwsza zdążyła już pobrać do cache, więc zwykle przechodzi.
    function attempt(retry){
      fetch('/api/planner?'+params.toString(),{headers:{Accept:'application/json'}})
        .then(function(r){return r.json().catch(function(){return {}}).then(function(data){return {ok:r.ok,status:r.status,data:data}}) })
        .then(function(res){
          if(!res.ok||!res.data.ok){
            if(!res.data.error&&!retry){
              $('resultsStatus').textContent=T('planer.retrying');
              setTimeout(function(){attempt(true)},1500);
              return;
            }
            btn.disabled=false;
            $('resultsStatus').className='status err';
            $('resultsStatus').textContent=res.data.error||T('planer.serverError',{status:res.status});
            scrollToResults();
            return;
          }
          btn.disabled=false;
          renderResults(res.data);
          scrollToResults();
        })
        .catch(function(){
          if(!retry){setTimeout(function(){attempt(true)},1500);return}
          btn.disabled=false;
          $('resultsStatus').className='status err';
          $('resultsStatus').textContent=T('planer.apiFail');
          scrollToResults();
        });
    }
    attempt(false);
  }
  window.search=search;

  setDefaultDateTime();
  loadCarrierPrefs();
  updateAdvDot();
  function renderTexts(){
    updateAdvSummary();
    updateCarrierSummary();
    updateViaSummary();
    renderHistoryPanel();
    renderSavedPanel();
  }
  (window.I18n?I18n.ready:Promise.resolve()).then(function(){
    renderTexts();
    loadCarriers();
    refreshFromProfile();
  });
  // Zmiana języka: przerysowujemy wszystko, co budował JS (statyczne
  // napisy z data-i18n przełącza samo i18n.js).
  window.addEventListener('langchange',function(){
    renderTexts();
    if(carriersList.length)renderCarrierCheckboxes(carriersList);
    if(viaRows.length)renderViaRows();
    var st=$('resultsStatus');
    if(st.classList.contains('searching'))st.textContent=T('planer.searching');
    else if(lastCounts)renderFoundStatus();
    if(lastItineraries.length)renderVisibleItineraries();
  });
  window.addEventListener('pageshow',function(e){if(e.persisted)refreshFromProfile()});
})();
</script>
</body>
</html>
