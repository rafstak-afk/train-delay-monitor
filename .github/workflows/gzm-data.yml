name: gzm-data

# Dane „Przesiadki GZM”: codziennie pobiera rozkłady ZTM GZM (portal publikuje
# nowe pliki ok. 4:30), buduje małe pliki stacji (tools/gzm/build.mjs) i
# wypycha je na gałąź `gzm-data` — zawsze jako JEDEN commit bez historii, żeby
# repozytorium nie puchło. Aplikacja czyta je przez /api/gzm-data/…
# Raz w miesiącu (oraz ręcznie z opcją full_walk) przelicza wszystkie dojścia
# piesze z OpenStreetMap (~2–3 h). Gdy budowanie albo walidacja się nie uda,
# gałąź gzm-data zostaje bez zmian (poprzednie dane działają dalej).

# Uruchamia ją Cloudflare Worker push-tick-cron (zegar GitHuba spóźniał się o 6–8 h):
#  codziennie 7:00 czasu polskiego, 1. dnia miesiąca 2:00 z full_walk=true. Można też ręcznie.
on:
  workflow_dispatch:
    inputs:
      full_walk:
        description: "Przelicz wszystkie dojścia piesze (długo, ~2–3 h)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gzm-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Poprzedni raport (do listy zmian)
        run: |
          mkdir -p tools/gzm/out
          if git fetch --depth 1 origin gzm-data 2>/dev/null; then
            git show FETCH_HEAD:raport.json > tools/gzm/out/raport.json 2>/dev/null || true
          fi

      - name: Budowanie danych
        run: |
          FLAG=""
          if [ "${{ github.event.schedule }}" = "0 1 1 * *" ] || [ "${{ inputs.full_walk }}" = "true" ]; then FLAG="--full-walk"; fi
          node tools/gzm/build.mjs $FLAG --no-stop-walk   # przejścia między przystankami — osobny krok po publikacji

      - name: Zapis pamięci dojść na main (tylko gdy się zmieniła)
        run: |
          git config user.name "gzm-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/gzm/walk-cache.json tools/gzm/stations-osm.json tools/gzm/stop-walk-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "gzm: pamięć dojść pieszych ($(date -u +%F))"
            # main mógł się zmienić w trakcie (pełne przeliczenie trwa ~3 h) — wtedy zapis na świeżym main w osobnym katalogu
            if ! git push origin HEAD:main; then
              git fetch --depth 1 origin main && git worktree add -f /tmp/main-fresh FETCH_HEAD &&
              cp tools/gzm/walk-cache.json tools/gzm/stations-osm.json tools/gzm/stop-walk-cache.json /tmp/main-fresh/tools/gzm/ &&
              (cd /tmp/main-fresh && git add tools/gzm/walk-cache.json tools/gzm/stations-osm.json tools/gzm/stop-walk-cache.json &&
                { git diff --cached --quiet || git commit -m "gzm: pamięć dojść pieszych ($(date -u +%F))"; } && git push origin HEAD:main) ||
              echo "::warning::nie udało się zapisać walk-cache — przeliczy się następnym razem"
            fi
          fi

      - name: Publikacja na gałęzi gzm-data (jeden commit, bez historii)
        run: |
          cp tools/gzm/LICENCJE.md tools/gzm/out/LICENCJE.md   # ODbL (OpenStreetMap) i CC BY 4.0 (ZTM GZM)
          cd tools/gzm/out
          git init -q -b gzm-data
          git config user.name "gzm-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "dane GZM $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gzm-data

      # TODO 71: przejścia między przystankami po drogach z OSM — po kawałku, PO publikacji (dane dnia nie czekają);
      # wyniki trafią do plików sieci przy następnym budowaniu
      # 18.11: najpierw z pliku mapy województwa (Geofabrik, ODbL) przez osmium — cała sieć w kilka minut;
      # plik pobierany tylko, gdy są pary do policzenia (nowe przystanki) albo 1. dnia miesiąca (odświeżenie wszystkich)
      - name: Przejścia między przystankami z pliku mapy OSM (osmium)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          export ALL=$([ "$(date -u +%d)" = "01" ] && echo 1 || echo 0)
          node tools/gzm/stop-walk-pbf.mjs --need || exit 0
          sudo apt-get install -y -qq osmium-tool > /dev/null
          T=$(mktemp -d)
          curl -sSfL --retry 3 -o "$T/slaskie.osm.pbf" https://download.geofabrik.de/europe/poland/slaskie-latest.osm.pbf
          osmium extract -b 18.35,49.92,19.55,50.70 "$T/slaskie.osm.pbf" -o "$T/gzm.osm.pbf"
          osmium tags-filter "$T/gzm.osm.pbf" w/highway -o "$T/gzm-hw.osm.pbf"
          osmium cat "$T/gzm-hw.osm.pbf" -f opl,add_metadata=false -o "$T/gzm-hw.opl"
          ls -la "$T"
          NODE_OPTIONS=--max-old-space-size=6000 node tools/gzm/stop-walk-pbf.mjs "$T/gzm-hw.opl"

      - name: Przejścia między przystankami (OSM, po kawałku)
        continue-on-error: true
        timeout-minutes: 100
        run: node tools/gzm/stop-walk-run.mjs

      - name: Zapis pamięci przejść na main
        if: always()
        run: |
          git config user.name "gzm-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/gzm/stop-walk-cache.json
          git diff --cached --quiet && exit 0
          git commit -q -m "gzm: przejścia między przystankami ($(date -u +%F))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::nie udało się zapisać stop-walk-cache — przeliczy się następnym razem"
