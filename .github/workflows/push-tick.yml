name: push-tick

# Harmonogram "co 5 minut" w GitHub Actions okazal sie bardzo niemiarowy
# (potrafil odpalic sie raz na ~20-30 minut zamiast co 5) i powodowal realnie
# spoznione/pominiete powiadomienia Web Push. Cykliczne wywolywanie
# /api/push-tick przejal osobny Cloudflare Worker z natywnym Cron Triggerem
# (push-tick-cron/, patrz tamtejszy wrangler.toml) - duzo dokladniejszy.
# Ten workflow zostaje tylko do recznego uruchamiania (workflow_dispatch),
# np. do szybkiego testu bez czekania na najblizszy tick.

on:
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Wywołaj /api/push-tick
        env:
          PUSH_TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET }}
        run: |
          if [ -z "$PUSH_TICK_SECRET" ]; then
            echo "PUSH_TICK_SECRET jeszcze nie ustawiony w sekretach repo — pomijam (ustaw w Settings > Secrets and variables > Actions)."
            exit 0
          fi
          curl -sf -X POST "https://train-delay-monitor1.pages.dev/api/push-tick" \
            -H "Authorization: Bearer $PUSH_TICK_SECRET" \
            -H "Content-Type: application/json"
