<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podgląd Pociągu - Redesign</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #2ecc71;
      --accent-orange: #f39c12;
      --accent-red: #e74c3c;
      --line-past: #475569;
      --line-future: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
    }

    /* Karta Nagłówkowa */
    .train-header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .train-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .train-number {
      font-size: 1.2rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-badge.on-time { 
      background: rgba(46, 204, 113, 0.15); 
      color: var(--accent-green); 
      border: 1px solid var(--accent-green); 
    }
    
    .status-badge.delayed { 
      background: rgba(231, 76, 60, 0.15); 
      color: var(--accent-red); 
      border: 1px solid var(--accent-red); 
    }

    .train-relation {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .last-update-info {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
      margin-top: 5px;
    }

    /* Oś Czasu (Timeline) */
    .timeline-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 20px;
    }

    .timeline-item {
      display: flex;
      position: relative;
      min-height: 70px;
    }

    .timeline-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 30px;
      bottom: -10px;
      width: 3px;
      background: var(--line-past);
      z-index: 1;
    }

    .timeline-item.future:not(:last-child)::before {
      background: var(--card-border);
    }

    .timeline-marker {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 3px solid var(--line-past);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
      margin-right: 16px;
    }

    .timeline-item.passed .timeline-marker {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .timeline-item.current .timeline-marker {
      border-color: #3b82f6;
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
      animation: pulse 2s infinite;
    }

    .timeline-content {
      flex-grow: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 20px;
    }

    .station-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .station-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .time-box {
      text-align: right;
    }

    .time-plan {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .time-plan.strike {
      text-decoration: line-through;
      margin-right: 4px;
    }

    .time-real {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-red);
    }

    .time-normal {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    <!-- Zawartość generowana przez JS -->
  </div>

  <script>
    // Przykładowe dane do wygenerowania widoku
    const trainData = {
      number: "KS 40612",
      from: "Katowice",
      to: "Zwardoń",
      delay: 12,
      lastConfirmedStation: "Tychy",
      lastConfirmedTime: "14:05",
      stations: [
        { name: "Katowice", planTime: "13:45", realTime: "13:45", delay: 0, passed: true, isCurrent: false, confirmed: true },
        { name: "Katowice Ligota", planTime: "13:52", realTime: "13:54", delay: 2, passed: true, isCurrent: false, confirmed: true },
        { name: "Tychy", planTime: "14:02", realTime: "14:14", delay: 12, passed: false, isCurrent: true, confirmed: true, platform: "2" },
        { name: "Pszczyna", planTime: "14:20", realTime: "14:32", delay: 12, passed: false, isCurrent: false, confirmed: false },
        { name: "Czechowice-Dziedzice", planTime: "14:31", realTime: "14:43", delay: 12, passed: false, isCurrent: false, confirmed: false },
        { name: "Bielsko-Biała Główna", planTime: "14:45", realTime: "14:57", delay: 12, passed: false, isCurrent: false, confirmed: false }
      ]
    };

    function renderTrainView(data) {
      const container = document.getElementById('app');
      const isDelayed = data.delay > 5;
      const statusClass = isDelayed ? 'delayed' : 'on-time';
      const statusText = isDelayed ? `+${data.delay} MIN OPÓŹNIENIA` : 'NA CZAS';

      const headerHTML = `
        <div class="train-header-card">
          <div class="train-title-row">
            <span class="train-number">🚆 ${data.number}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="train-relation">
            ${data.from} ➔ ${data.to}
          </div>
          <div class="last-update-info">
            📍 Ostatnio potwierdzony: <strong>${data.lastConfirmedStation}</strong> (godz. ${data.lastConfirmedTime})
          </div>
        </div>
      `;

      const routeHTML = data.stations.map((station, index) => {
        let markerIcon = index + 1;
        let itemClass = 'future';

        if (station.passed) {
          markerIcon = '✓';
          itemClass = 'passed';
        } else if (station.isCurrent) {
          markerIcon = '📍';
          itemClass = 'current';
        }

        const hasDelay = station.delay > 0;

        return `
          <div class="timeline-item ${itemClass}">
            <div class="timeline-marker">${markerIcon}</div>
            <div class="timeline-content">
              <div class="station-info">
                <div class="station-name">${station.name}</div>
                <div class="station-meta">
                  ${station.confirmed ? '<span style="color: var(--accent-green);">✓ Potwierdzona</span>' : 'Oczekuje'}
                  ${station.platform ? ` • Peron ${station.platform}` : ''}
                </div>
              </div>
              <div class="time-box">
                ${hasDelay ? `
                  <span class="time-plan strike">${station.planTime}</span>
                  <span class="time-real">${station.realTime}</span>
                ` : `
                  <span class="time-normal">${station.planTime}</span>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = headerHTML + `<div class="timeline-container">${routeHTML}</div>`;
    }

    // Uruchomienie renderowania
    renderTrainView(trainData);
  </script>
</body>
</html>
