<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica Monitorowania Pociągów</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e0e1dd; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1c2541; border: 1px solid #3a506b; }
    .card-hover:hover { border-color: #06b6d4; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto min-h-screen flex flex-col">

  <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 border-b border-slate-700/80 pb-4">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-desktop text-2xl text-cyan-400"></i>
      <h1 class="text-2xl font-extrabold text-white tracking-wide">Tablica Monitorowania</h1>
    </div>
    
    <button onclick="renderPage()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow">
      <i class="fa-solid fa-rotate-right"></i> Odśwież dane
    </button>
  </header>

  <!-- FORMULARZ: TYLKO NUMER POCIĄGU I STACJA -->
  <section class="card p-4 rounded-xl mb-6 shadow-lg">
    <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-3 flex items-center gap-2">
      <i class="fa-solid fa-plus-circle"></i> Dodaj pociąg po numerze i stacji
    </h2>
    <form id="add-train-form" onsubmit="handleAddTrain(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <input type="text" id="input-number" placeholder="Numer pociągu (np. 40450, 3815)" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
      <input type="text" id="input-station" placeholder="Stacja (np. Tarnowskie Góry, Katowice)" required class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
      <button type="submit" id="btn-submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs py-2 px-4 rounded-lg transition shadow flex items-center justify-center gap-2">
        <span>+ Pobierz i śledź</span>
      </button>
    </form>
  </section>

  <!-- KONTENER NA POCIĄGI -->
  <main id="trains-container" class="space-y-3 flex-1">
    <div class="text-center py-12 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-cyan-400"></i>
      <p>Ładowanie monitorowanych połączeń...</p>
    </div>
  </main>

  <footer class="mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
    Train Delay Monitor &copy; 2026
  </footer>

  <script>
    const STORAGE_KEY = 'monitored_trains_v2';

    // Domyślne zestawienie (Numer + Stacja)
    const DEFAULT_ITEMS = [
      { trainNo: '3815', station: 'Katowice' },
      { trainNo: '40360', station: 'Bytom Karb' },
      { trainNo: '38107', station: 'Katowice' },
      { trainNo: '40621', station: 'Katowice' },
      { trainNo: '63102', station: 'Katowice' },
      { trainNo: '40450', station: 'Tarnowskie Góry' },
      { trainNo: '44226', station: 'Miasteczko Śląskie' },
      { trainNo: '40250', station: 'Tarnowskie Góry' },
      { trainNo: '40858', station: 'Chorzów Batory' },
      { trainNo: '40423', station: 'Chorzów Batory' },
      { trainNo: '40211', station: 'Chorzów Batory' },
      { trainNo: '40468', station: 'Chorzów Uniwersytet' }
    ];

    function getSavedList() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return DEFAULT_ITEMS;
        const parsed = JSON.parse(raw);
        return (Array.isArray(parsed) && parsed.length > 0) ? parsed : DEFAULT_ITEMS;
      } catch (e) {
        return DEFAULT_ITEMS;
      }
    }

    function saveList(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    // Bezpieczne pobieranie bez błędów 404
    async function fetchAPI(endpoint) {
      try {
        const res = await fetch('/api/' + endpoint);
        if (!res.ok) return null; // Zwracamy null zamiast wyrzucać błąd 404
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function handleAddTrain(e) {
      e.preventDefault();
      const numInput = document.getElementById('input-number');
      const stInput = document.getElementById('input-station');
      const btn = document.getElementById('btn-submit');

      const trainNo = numInput.value.trim();
      const station = stInput.value.trim();

      if (!trainNo || !station) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Szukam...';

      const list = getSavedList();
      list.unshift({ trainNo, station });
      saveList(list);

      numInput.value = '';
      stInput.value = '';
      btn.disabled = false;
      btn.innerHTML = '+ Pobierz i śledź';

      await renderPage();
    }

    function removeTrain(idx) {
      const list = getSavedList();
      list.splice(idx, 1);
      saveList(list);
      renderPage();
    }

    async function renderPage() {
      const container = document.getElementById('trains-container');
      const savedList = getSavedList();

      if (savedList.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs">Brak monitorowanych pociągów. Dodaj nowy używając formularza powyżej.</div>';
        return;
      }

      const cardsHtml = await Promise.all(savedList.map(async (item, idx) => {
        // Zaciąganie szczegółów z API na podstawie numeru pociągu
        const routeData = await fetchAPI(`operations/train/${item.trainNo}`);
        const stops = routeData?.stops || routeData?.route || (Array.isArray(routeData) ? routeData : []);

        let depTime = '--:--';
        let destination = 'Stacja docelowa';
        let cat = 'Pociąg';
        let name = `#${item.trainNo}`;
        let delay = 0;
        let viaStr = `stacja: ${item.station}`;

        if (stops.length > 0) {
          const lastStop = stops[stops.length - 1];
          destination = lastStop.stationName || lastStop.station || destination;

          const matchStop = stops.find(s => 
            (s.stationName || s.station || '').toLowerCase().includes(item.station.toLowerCase())
          );

          if (matchStop) {
            depTime = matchStop.arrPlan || matchStop.plannedTime || matchStop.time || depTime;
            delay = matchStop.delay || matchStop.delayMinutes || 0;
          } else {
            depTime = stops[0].arrPlan || stops[0].plannedTime || depTime;
          }
        }

        const detailUrl = `/train?train=${encodeURIComponent(item.trainNo)}&station=${encodeURIComponent(item.station)}&destination=${encodeURIComponent(destination)}`;
        const delayClass = delay > 0 ? 'text-pink-500 font-extrabold' : 'text-emerald-400 font-bold';

        return `
          <div class="card p-4 rounded-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4 card-hover transition">
            <div class="flex items-center gap-4 min-w-[200px]">
              <div class="text-center min-w-[45px]">
                <div class="text-xl ${delayClass}">${delay > 0 ? '+' + delay : '0'}</div>
                <div class="text-[9px] text-slate-400 uppercase">opóźn.</div>
              </div>
              <div>
                <div class="text-xs font-bold text-slate-300 uppercase tracking-wide">${item.station}</div>
                <div class="text-lg font-mono font-bold text-emerald-400">${depTime} <span class="text-[10px] text-slate-400 font-normal">odjazd</span></div>
              </div>
            </div>

            <div class="flex-1">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="bg-cyan-500/20 text-cyan-300 font-bold text-[10px] px-2 py-0.5 rounded">Pociąg ${item.trainNo}</span>
                <a href="${detailUrl}" class="text-sm font-bold text-white hover:text-cyan-300 transition">Kierunek: ${destination}</a>
              </div>
              <div class="text-[11px] text-slate-400">${viaStr}</div>
            </div>

            <div class="flex items-center gap-2 self-end md:self-auto">
              <a href="${detailUrl}" class="bg-cyan-700/60 hover:bg-cyan-600 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium">
                Pokaż bieg
              </a>
              <button onclick="removeTrain(${idx})" class="text-slate-500 hover:text-pink-400 p-1.5 transition" title="Usuń">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }));

      container.innerHTML = cardsHtml.join('');
    }

    renderPage();
  </script>
</body>
</html>
