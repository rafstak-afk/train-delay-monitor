<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bieg Pociągu - Szczegóły</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #e0e1dd; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1c2541; border: 1px solid #3a506b; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto min-h-screen flex flex-col">

  <div class="flex items-center justify-between mb-4">
    <a href="/monitorowane-pociagi/" class="inline-flex items-center text-cyan-400 hover:text-cyan-300 text-xs font-semibold">
      <i class="fa-solid fa-arrow-left mr-2"></i> Powrót do Tablicy Monitorowania
    </a>
  </div>

  <div id="train-header" class="card p-6 rounded-xl shadow-lg mb-6">
    <!-- Ładowane dynamicznie -->
  </div>

  <div class="card p-6 rounded-xl shadow-lg flex-1">
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
      <h2 class="text-base font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-route text-cyan-400"></i> Bieg Pociągu i Stacje Pośrednie
      </h2>
      <button onclick="loadRoute()" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold flex items-center gap-1">
        <i class="fa-solid fa-rotate-right"></i> Odśwież
      </button>
    </div>

    <div id="route-container">
      <div class="text-center py-8 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-cyan-400"></i>
        <p class="text-xs">Ładowanie szczegółowych przystanków z API...</p>
      </div>
    </div>
  </div>

  <footer class="mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
    Train Delay Monitor &copy; 2026
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const trainNo = params.get('train') || '';
    const station = params.get('station') || '';
    let category = params.get('category') || 'Pociąg';
    let name = params.get('name') || `Pociąg #${trainNo}`;
    let destination = params.get('destination') || 'Stacja docelowa';
    let scheduleId = params.get('scheduleId') || '';
    let orderId = params.get('orderId') || '';
    let trainOrderId = params.get('trainOrderId') || '';

    function renderHeader(statusText = 'Ładowanie danych...') {
      document.getElementById('train-header').innerHTML = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="bg-amber-600/30 border border-amber-500/50 text-amber-300 px-2.5 py-0.5 rounded text-xs font-bold">${category}</span>
              <h1 class="text-2xl font-extrabold text-white">${name}</h1>
            </div>
            <p class="text-xs text-slate-300">
              Stacja odniesienia: <b class="text-cyan-300">${station || 'Brak'}</b> ➔ Kierunek: <b class="text-white">${destination}</b>
            </p>
          </div>
          <div class="inline-flex items-center gap-2 bg-slate-800 border border-slate-700 text-cyan-300 text-xs px-3.5 py-2 rounded-lg font-bold">
            <i class="fa-solid fa-circle-info"></i> ${statusText}
          </div>
        </div>
      `;
    }

    renderHeader('Pobieranie biegu...');

    async function fetchAPI(endpoint) {
      try {
        const res = await fetch('/api/' + endpoint);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function resolveCourseIdentifiers() {
      if (!station || !trainNo) return;
      const boardData = await fetchAPI(`schedules/station/${encodeURIComponent(station)}`);
      
      let departures = [];
      if (Array.isArray(boardData)) departures = boardData;
      else if (boardData?.departures) departures = boardData.departures;
      else if (boardData?.data) departures = boardData.data;

      const found = departures.find(d => {
        const n = (d.trainNo || d.number || d.trainNumber || d.symbol || '').toString();
        const full = (d.name || d.trainName || '').toString();
        return n === trainNo || n.includes(trainNo) || full.includes(trainNo);
      });

      if (found) {
        scheduleId = found.scheduleId || scheduleId;
        orderId = found.orderId || orderId;
        trainOrderId = found.trainOrderId || trainOrderId;
        category = found.category || category;
        name = found.name || name;
        destination = found.destination || found.to || destination;
        renderHeader('Kurs zlokalizowany w API');
      }
    }

    async function loadRoute() {
      const container = document.getElementById('route-container');

      // Jeśli brakuje identyfikatorów, próba wyciągnięcia z tablicy stacji
      if (!scheduleId && !orderId && station && trainNo) {
        await resolveCourseIdentifiers();
      }

      let routeData = null;

      // 1. Próba pobrania po identyfikatorze kursu
      if (scheduleId && orderId) {
        routeData = await fetchAPI(`schedules/route/${scheduleId}/${orderId}`);
      }
      if (!routeData && scheduleId && trainOrderId) {
        routeData = await fetchAPI(`schedules/route/${scheduleId}/${trainOrderId}`);
      }
      // 2. Próba bezpośrednia po numerze pociągu
      if (!routeData && trainNo) {
        routeData = await fetchAPI(`operations/train/${trainNo}`);
      }

      let stops = [];
      if (Array.isArray(routeData)) stops = routeData;
      else if (routeData?.stops) stops = routeData.stops;
      else if (routeData?.route) stops = routeData.route;
      else if (routeData?.data?.stops) stops = routeData.data.stops;

      if (!stops || stops.length === 0) {
        container.innerHTML = `
          <div class="p-6 bg-slate-800/80 border border-slate-700 rounded-xl text-center text-slate-200">
            <div class="flex justify-center mb-3 text-cyan-400 text-3xl">
              <i class="fa-solid fa-train"></i>
            </div>
            <h3 class="font-bold text-base text-white mb-1">${name}</h3>
            <p class="text-xs text-slate-300 mb-4 max-w-md mx-auto">
              Brak dostępnego szczegółowego biegu pociągu w API PLK. Kurs może jeszcze nie posiadać nadanego sygnału GPS lub nie rozpoczął biegu ze stacji początkowej.
            </p>
          </div>`;
        renderHeader('Brak szczegółów trasy');
        return;
      }

      renderHeader('Trasa wczytana pomyślnie');

      let html = '<div class="space-y-2">';
      stops.forEach((stop, idx) => {
        const stName = stop.stationName || stop.station || stop.name || `Stacja ${idx+1}`;
        const planArr = stop.arrPlan || stop.plannedTime || stop.time || stop.arr || '--:--';
        const realArr = stop.arrReal || stop.actualTime || planArr;
        const delay = parseInt(stop.delay || stop.delayMinutes || 0, 10);
        const isCurrent = station && stName.toLowerCase().includes(station.toLowerCase());

        html += `
          <div class="flex items-center justify-between p-3 rounded-lg border ${isCurrent ? 'bg-cyan-950/40 border-cyan-500/60 ring-1 ring-cyan-500' : 'bg-slate-800/40 border-slate-700/50'}">
            <div class="flex items-center gap-3">
              <i class="fa-solid ${isCurrent ? 'fa-location-crosshairs text-cyan-400' : 'fa-location-dot text-slate-500'}"></i>
              <div class="font-bold text-xs ${isCurrent ? 'text-cyan-300' : 'text-white'}">${stName}</div>
            </div>
            <div class="text-right">
              <div class="text-xs font-mono font-bold text-cyan-300">${realArr} ${realArr !== planArr ? `<span class="text-[10px] text-slate-400 line-through">${planArr}</span>` : ''}</div>
              <div class="text-[10px] font-semibold ${delay > 0 ? 'text-pink-400' : 'text-emerald-400'}">
                ${delay > 0 ? `+${delay} min` : 'o czasie'}
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';

      container.innerHTML = html;
    }

    loadRoute();
  </script>
</body>
</html>
