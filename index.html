<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Moje Pociągi V2</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2b;
  --panel2:#162238;
  --border:#263653;
  --text:#f4f7fb;
  --muted:#91a0b7;
  --cyan:#22d3ee;
  --green:#34d399;
  --yellow:#fbbf24;
  --red:#fb7185;
  --blue:#60a5fa;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,900px);
  margin:0 auto;
  padding:12px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(11,18,32,.96);
  backdrop-filter:blur(10px);
  padding:8px 0 12px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  margin:0;
  font-size:21px;
  line-height:1.1;
}

.header-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.refresh{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:var(--cyan);
  font-size:20px;
}

.refresh:disabled{
  opacity:.5;
}

.add-panel{
  margin:8px 0 12px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
}

.add-title{
  color:var(--cyan);
  font-size:12px;
  font-weight:800;
  margin-bottom:9px;
}

.add-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
}

input{
  width:100%;
  min-width:0;
  padding:10px 11px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0b1220;
  color:var(--text);
  outline:none;
}

input:focus{
  border-color:var(--cyan);
}

.add-btn{
  border:0;
  border-radius:10px;
  padding:0 14px;
  background:var(--cyan);
  color:#06212a;
  font-weight:800;
}

.summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 2px 7px;
}

.summary-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.summary-info{
  color:var(--muted);
  font-size:12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .12s ease,border-color .12s ease;
}

.card:hover{
  border-color:var(--cyan);
}

.card:active{
  transform:scale(.985);
}

.card-main{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
}

.train{
  min-width:0;
  flex-grow:1;
}

.train-top{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.train-number{
  font-size:16px;
  font-weight:900;
  white-space:nowrap;
}

.train-name{
  color:var(--cyan);
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.route{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.position{
  margin-top:4px;
  color:#d9e2ef;
  font-size:11px;
}

.delete{
  width:32px;
  height:32px;
  border:0;
  background:transparent;
  color:#64748b;
  border-radius:8px;
  font-size:17px;
}

.delete:hover{
  color:var(--red);
  background:rgba(251,113,133,.08);
}

.loading{
  padding:24px 12px;
  text-align:center;
  color:var(--muted);
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:14px;
}
</style>

</head>

<body>
<div class="app">

<header>
  <div class="header-row">
    <div>
      <h1>🚆 Moje Pociągi</h1>
      <div class="header-sub">Aktualny status z danych PLK</div>
    </div>
    <button class="refresh" id="refreshBtn" title="Odśwież">↻</button>
  </div>
</header>

<section class="add-panel">
  <div class="add-title">＋ DODAJ POCIĄG DO MONITOROWANIA</div>
  <div class="add-row">
    <input id="stationInput" placeholder="Stacja, np. Katowice">
    <input id="trainInput" placeholder="Numer, np. 3815">
    <button class="add-btn" id="addBtn">Dodaj</button>
  </div>
</section>

<div class="summary">
  <div class="summary-title">Monitorowane</div>
  <div class="summary-info" id="summaryInfo">Ładowanie…</div>
</div>

<main id="list" class="list">
  <div class="loading">Pobieranie danych z PLK…</div>
</main>

</div>

<script>
window.onerror = function(m, u, l) { console.error("Błąd wykonania JS:", m, "linia:", l); };

const DEFAULT_TRAINS = [
  { station: 'MIASTECZKO ŚLĄSKIE', number: '44226', planTime: '04:59' },
  { station: 'TARNOWSKIE GÓRY', number: '40450', planTime: '05:21' },
  { station: 'CHORZÓW BATORY', number: '40658', planTime: '06:07' },
  { station: 'TARNOWSKIE GÓRY', number: '40250', planTime: '05:46' },
  { station: 'CHORZÓW BATORY', number: '40660', planTime: '06:32' },
  { station: 'KATOWICE', number: '40921', planTime: '14:59' },
  { station: 'KATOWICE', number: '40621', planTime: '15:35' },
  { station: 'CHORZÓW BATORY', number: '40423', planTime: '15:12' },
  { station: 'CHORZÓW BATORY', number: '40425', planTime: '16:06' },
  { station: 'KATOWICE', number: '8330', planTime: '10:20' },
  { station: 'KATOWICE', number: '3815', planTime: '14:40' }
];

const STORAGE_KEY = 'rafstakMojePociagiV3';

const STATION_IDS = {
  'KATOWICE': '73312',
  'KRAKÓW GŁÓWNY': '73302',
  'TARNOWSKIE GÓRY': '73390',
  'CHORZÓW BATORY': '73308',
  'GLIWICE': '73318',
  'BYTOM KARB': '73405',
  'MIASTECZKO ŚLĄSKIE': '73428'
};

function getList(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){}
  return DEFAULT_TRAINS.map(x => ({...x}));
}

function saveList(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function buildTrainUrl(row, station, number) {
  if (!row || !row.orderId) return null;
  const today = new Date().toISOString().split('T')[0];
  const params = new URLSearchParams({
    train: row.train || row.trainNo || row.number || number || '',
    category: row.category || row.trainCategory || 'IC',
    name: row.name || row.trainName || '',
    destination: row.destination || row.to || '',
    date: row.date || today,
    scheduleId: row.scheduleId || row.scheduledId || '2026',
    scheduledId: row.scheduledId || row.scheduleId || '2026',
    orderId: row.orderId || '',
    trainOrderId: row.trainOrderId || '',
    stationId: row.stationId || (typeof stationId === 'function' ? stationId(station) : '') || '',
    station: row.station || station || ''
  });
  return '/train?' + params.toString();
}

function stationId(name){
  return STATION_IDS[String(name || '').trim().toUpperCase()] || '';
}

function escapeHtml(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function getTrainNumber(row){
  return String(
    row.trainNumber ??
    row.trainNo ??
    row.number ??
    row.train ??
    row.train?.trainNumber ??
    row.train?.number ??
    ''
  );
}

function getDelay(row){
  const values = [
    row.delayMinutes,
    row.delay,
    row.delayInMinutes,
    row.train?.delayMinutes,
    row.operation?.delayMinutes
  ];

  for(const value of values){
    if(value !== undefined && value !== null && value !== ''){
      const n = Number(value);
      if(Number.isFinite(n)) return n;
    }
  }

  return null;
}

function getTime(row){
  return row.actualTime ||
         row.realTime ||
         row.departureTimeActual ||
         row.arrivalTimeActual ||
         row.time ||
         row.scheduledTime ||
         row.departureTime ||
         row.arrivalTime ||
         '';
}

function getScheduleId(row){
  return row.scheduleId ||
         row.scheduledId ||
         row.schedule?.id ||
         '';
}

function getOrderId(row){
  return row.orderId ||
         row.trainOrderId ||
         row.operationId ||
         '';
}

async function fetchStation(station){
  const id = stationId(station);
  const params = new URLSearchParams();
  params.set('station', station);
  params.set('limit', '300');

  const response = await fetch(
    '/api/departures?' + params.toString(),
    {
      headers:{Accept:'application/json'},
      cache:'no-store'
    }
  );

  if(!response.ok){
    throw new Error('HTTP ' + response.status);
  }

  const data = await response.json();

  return Array.isArray(data.departures)
    ? data.departures
    : [];
}

function findTrain(rows,number){
  const wanted = String(number);
  return rows.find(row => getTrainNumber(row) === wanted) || null;
}

function timeOnly(value){
  const match = String(value || '').match(/T(\d{2}:\d{2})/);
  if(match) return match[1];

  const match2 = String(value || '').match(/(\d{2}:\d{2})/);
  return match2 ? match2[1] : String(value || '');
}

function buildView(item, result){
  const row = result.row;
  const time = row ? getTime(row) : '';

  const route =
    result.routeOrigin && result.routeDestination
      ? `${result.routeOrigin} → ${result.routeDestination}`
      : (item.planTime ? `Godz. odjazdu: ${item.planTime}` : 'Brak informacji o relacji');

  const lastConfirmed =
    row && row.lastConfirmedStation
      ? `📍 Ostatnio: ${row.lastConfirmedStation}` + (row.lastConfirmedTime ? ` · ${timeOnly(row.lastConfirmedTime)}` : '')
      : '';

  const position = lastConfirmed || (time ? `Dane: ${timeOnly(time)}` : '');

  const trainName = row && (row.name || row.trainName || row.commercialName)
      ? (row.name || row.trainName || row.commercialName)
      : '';

  return `
    <article class="card" data-open="${result.index}" data-station="${escapeHtml(item.station)}" data-number="${escapeHtml(item.number)}">
      <div class="card-main" data-raw="${JSON.stringify(item).replace(/"/g, "&quot;")}">
        <div class="train">
          <div class="train-top">
            <span class="train-number">#${escapeHtml(item.number)}</span>
            ${trainName ? `<span class="train-name">${escapeHtml(trainName)}</span>` : ''}
          </div>
          <div class="route">${escapeHtml(route)}</div>
          ${position ? `<div class="position">${escapeHtml(position)}</div>` : ''}
        </div>

        <button class="delete" data-delete="${result.index}" title="Usuń z listy">×</button>
      </div>
    </article>
  `;
}

async function loadTrains(){
  const list = getList();
  const container = document.getElementById('list');
  const refresh = document.getElementById('refreshBtn');

  refresh.disabled = true;
  refresh.textContent = '…';

  document.getElementById('summaryInfo').textContent = `0 / ${list.length} załadowanych`;

  container.innerHTML = list.length
    ? list.map((item,index) =>
        buildView(item,{ row:null, index, loading:true })
      ).join('')
    : `<div class="empty">Brak monitorowanych pociągów.</div>`;

  const stationCache = new Map();
  const routeCache = new Map();
  const nameCache = new Map();

  async function getStationNames(ids){
    const wanted = [...new Set(ids.map(x => String(x || '').trim()).filter(Boolean))];
    const missing = wanted.filter(id => !nameCache.has(id));

    if(missing.length){
      try{
        const response = await fetch('/api/stations?ids=' + encodeURIComponent(missing.join(',')), {
          headers:{Accept:'application/json'}, cache:'no-store'
        });
        if(response.ok){
          const data = await response.json();
          for(const [id,name] of Object.entries(data.names || {})){
            nameCache.set(String(id),name);
          }
        }
      }catch(error){}
    }
    return wanted.map(id => nameCache.get(id) || '');
  }

  async function getRouteInfo(row){
    const scheduleId = getScheduleId(row);
    const orderId = getOrderId(row);

    if(!scheduleId || !orderId) return { origin:'', destination:'' };

    const routeKey = String(scheduleId) + ':' + String(orderId);
    if(routeCache.has(routeKey)) return routeCache.get(routeKey);

    const promise = (async()=>{
      try{
        const response = await fetch('/api/schedules/route/' + encodeURIComponent(scheduleId) + '/' + encodeURIComponent(orderId), {
          headers:{Accept:'application/json'}, cache:'no-store'
        });
        if(!response.ok) return { origin:'', destination:'' };

        const data = await response.json();
        const route = data.route || data;
        const stations = route && Array.isArray(route.stations) ? route.stations : [];
        if(!stations.length) return { origin:'', destination:'' };

        const names = await getStationNames([stations[0]?.stationId, stations[stations.length - 1]?.stationId]);
        return { origin:names[0] || '', destination:names[1] || '' };
      }catch(error){
        return { origin:'', destination:'' };
      }
    })();

    routeCache.set(routeKey,promise);
    return promise;
  }

  let loaded = 0;

  for(let index=0; index<list.length; index++){
    const item = list[index];

    try{
      if(!stationCache.has(item.station)){
        stationCache.set(item.station, fetchStation(item.station));
      }

      const rows = await stationCache.get(item.station);
      const row = findTrain(rows,item.number);
      let routeInfo = { origin:'', destination:'' };

      if(row) routeInfo = await getRouteInfo(row);

      if (row && row.orderId) {
        const _tUrl = buildTrainUrl(row, item.station, item.number);
        setTimeout(() => {
          const _card = container.children[index];
          if (_card && _tUrl) {
            _card.dataset.trainUrl = _tUrl;
            _card.style.cursor = 'pointer';
          }
        }, 50);
      }

      const oldCard = container.children[index];

      if(oldCard){
        const wrapper = document.createElement('div');
        wrapper.innerHTML = buildView(item,{
          row,
          index,
          loading:false,
          routeOrigin:routeInfo.origin,
          routeDestination:routeInfo.destination
        });

        oldCard.replaceWith(wrapper.firstElementChild);
      }

      loaded++;
      document.getElementById('summaryInfo').textContent = `${loaded} / ${list.length}`;
    }catch(error){
      const oldCard = container.children[index];
      if(oldCard){
        const wrapper = document.createElement('div');
        wrapper.innerHTML = buildView(item,{ row:null, index, loading:false });
        oldCard.replaceWith(wrapper.firstElementChild);
      }
      loaded++;
      document.getElementById('summaryInfo').textContent = `${loaded} / ${list.length}`;
    }
  }

  refresh.disabled = false;
  refresh.textContent = '↻';
  document.getElementById('summaryInfo').textContent = `${list.length} / ${list.length}`;
}

function bindActions(){
  document.querySelectorAll('[data-delete]').forEach(button => {
    button.addEventListener('click',event => {
      event.stopPropagation();
      const index = Number(button.dataset.delete);
      const list = getList();
      list.splice(index,1);
      saveList(list);
      loadTrains();
    });
  });
}

document.getElementById('refreshBtn').addEventListener('click',loadTrains);

document.getElementById('addBtn').addEventListener('click',() => {
  const station = document.getElementById('stationInput').value.trim().toUpperCase();
  const number = document.getElementById('trainInput').value.trim();

  if(!station || !number){
    alert('Podaj stację i numer pociągu.');
    return;
  }

  const list = getList();
  if(list.some(x => x.number === number && x.station === station)){
    alert('Ten pociąg jest już na liście.');
    return;
  }

  list.push({ station, number });
  saveList(list);

  document.getElementById('stationInput').value = '';
  document.getElementById('trainInput').value = '';

  loadTrains();
});

document.getElementById('trainInput').addEventListener('keydown',event => {
  if(event.key === 'Enter'){
    document.getElementById('addBtn').click();
  }
});

loadTrains();
</script>

<script>
(function() {
  function getCardKey(card) {
    return card.dataset.trainUrl || 
           card.getAttribute('data-id') || 
           card.querySelector('.train-number')?.textContent.trim() || 
           card.innerText.replace(/\s+/g, ' ').trim().slice(0, 40);
  }

  function saveTrainOrder() {
    const cards = document.querySelectorAll('.card, .train-card, .train-item, [data-train-url]');
    const order = [];
    cards.forEach(card => {
      const key = getCardKey(card);
      if (key && !order.includes(key)) order.push(key);
    });
    if (order.length > 0) {
      localStorage.setItem('trains_custom_order', JSON.stringify(order));
    }
  }

  function restoreTrainOrder() {
    const saved = localStorage.getItem('trains_custom_order');
    if (!saved) return;
    try {
      const order = JSON.parse(saved);
      const cards = Array.from(document.querySelectorAll('.card, .train-card, .train-item, [data-train-url]'));
      if (cards.length === 0) return;

      const parent = cards[0].parentNode;
      const cardMap = new Map();

      cards.forEach(card => {
        const key = getCardKey(card);
        if (key) cardMap.set(key, card);
      });

      order.forEach(key => {
        if (cardMap.has(key)) {
          parent.appendChild(cardMap.get(key));
          cardMap.delete(key);
        }
      });

      cardMap.forEach(card => parent.appendChild(card));
    } catch(e) {}
  }

  function setupFormToggle() {
    const form = document.querySelector('.add-panel, #addTrainForm, .add-train-form');
    if (form && !document.querySelector('.toggle-add-btn')) {
      form.classList.add('add-form-hidden');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'toggle-add-btn';
      btn.innerHTML = '➕ Dodaj pociąg do monitorowania';
      btn.onclick = function() {
        if (form.classList.contains('add-form-hidden')) {
          form.classList.remove('add-form-hidden');
          form.classList.add('add-form-visible');
          btn.innerHTML = '➖ Ukryj formularz';
        } else {
          form.classList.remove('add-form-visible');
          form.classList.add('add-form-hidden');
          btn.innerHTML = '➕ Dodaj pociąg do monitorowania';
        }
      };
      if (form.parentNode) {
        form.parentNode.insertBefore(btn, form);
      }
    }
  }

  let activeCard = null;

  function enableDragAndDrop(card) {
    if (card.dataset.dragEnabled === "true") return;
    card.dataset.dragEnabled = "true";

    const handle = card.querySelector('.drag-handle') || card;

    handle.addEventListener('touchstart', function(e) {
      activeCard = card;
      card.classList.add('is-dragging');
    }, { passive: true });

    handle.addEventListener('touchmove', function(e) {
      if (!activeCard) return;
      const touchY = e.touches[0].clientY;
      const touchX = e.touches[0].clientX;
      const targetEl = document.elementFromPoint(touchX, touchY);
      if (targetEl) {
        const targetCard = targetEl.closest('.card, .train-card, .train-item, [data-train-url]');
        if (targetCard && targetCard !== activeCard && targetCard.parentNode === activeCard.parentNode) {
          const rect = targetCard.getBoundingClientRect();
          const next = (touchY - rect.top) > (rect.height / 2);
          activeCard.parentNode.insertBefore(activeCard, next ? targetCard.nextSibling : targetCard);
        }
      }
    }, { passive: true });

    const endDrag = function() {
      if (activeCard) {
        activeCard.classList.remove('is-dragging');
        activeCard = null;
        saveTrainOrder();
      }
    };

    handle.addEventListener('touchend', endDrag);
    handle.addEventListener('mouseup', endDrag);
  }

  function processCards() {
    setupFormToggle();

    const cards = document.querySelectorAll('.card, .train-card, .train-item, [data-train-url]');
    cards.forEach(card => {
      // Usuwanie zbędnych etykiet tekstowych
      card.querySelectorAll('button, a, span, div, p').forEach(el => {
        const txt = (el.textContent || '').trim().toUpperCase();
        if (txt === 'SZCZEGÓŁY' || txt === 'OPÓŹNIONY' || txt === 'PLANOWO' || txt === 'BRAK DANYCH' || txt === 'BRAK OPERACJI' || txt === 'ŁADOWANIE') {
          el.style.display = 'none';
        }
      });

      let stationName = card.dataset.station || '';

      // Wyciąganie opóźnienia
      let delayText = '';
      card.querySelectorAll('p, div, span').forEach(el => {
        if (el.closest('.card-top-row')) return;
        const txt = (el.textContent || '').trim();
        if ((txt.includes('min') || txt.startsWith('+')) && txt.length < 15 && !txt.includes('Ostatnio') && !txt.includes('Dane:')) {
          delayText = txt;
          el.style.display = 'none';
        }
      });

      // Formatowanie relacji i stacji
      card.querySelectorAll('p, div, span').forEach(el => {
        if (el.closest('.card-top-row')) return;
        const txt = (el.textContent || '').trim();
        if (txt.includes('→') || txt.includes('->') || txt.includes('Godz.')) {
          el.className = 'train-route-line';
        } else if (txt.includes('Ostatnio') || txt.includes('Dane:')) {
          el.className = 'train-status-line';
        }
      });

      // Generowanie paska nagłówka (uchwyt + plakietka opóźnienia + tag stacji)
      let topRow = card.querySelector('.card-top-row');
      if (!topRow) {
        topRow = document.createElement('div');
        topRow.className = 'card-top-row';

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '⋮⋮';
        topRow.appendChild(handle);

        if (delayText && delayText !== '0 min' && delayText !== '+0') {
          const isRed = !(delayText.includes('0 min') || delayText === '+0');
          const badge = document.createElement('span');
          badge.className = 'delay-badge ' + (isRed ? 'delay-red' : 'delay-green');
          badge.textContent = delayText;
          topRow.appendChild(badge);
        }

        card.insertBefore(topRow, card.firstChild);
      }

      if (stationName && !topRow.querySelector('.station-mini-tag')) {
        const tag = document.createElement('span');
        tag.className = 'station-mini-tag';
        tag.textContent = stationName.toUpperCase();
        topRow.appendChild(tag);
      }

      enableDragAndDrop(card);
    });

    restoreTrainOrder();
  }

  let timer = null;
  const observer = new MutationObserver(function() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(processCards, 50);
  });

  document.addEventListener('DOMContentLoaded', function() {
    processCards();
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
</body>
</html>
