<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Moje Pociągi V2</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111a2b;
  --border:#263653;
  --text:#f4f7fb;
  --muted:#91a0b7;
  --cyan:#22d3ee;
  --green:#34d399;
  --red:#fb7185;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding:6px;
}

button,input{font:inherit}
button{cursor:pointer}

.app{
  width:min(100%,900px);
  margin:0 auto;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(10px);
  padding:8px 0 12px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h1{margin:0;font-size:21px;line-height:1.1}
.header-sub{color:var(--muted);font-size:12px;margin-top:4px}

.refresh{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  color:var(--cyan);
  font-size:20px;
}

.summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 2px 7px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.card{
  background:#0f172a;
  border:1.5px solid #334155;
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.drag-handle{
  color:#475569;
  font-size:1.4rem;
  font-weight:900;
  cursor:grab;
  padding-right:6px;
  user-select:none;
  touch-action:none;
}

.train-content{
  flex-grow:1;
  min-width:0;
}

.train-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.train-number{
  font-size:16px;
  font-weight:900;
}

.train-name{
  color:var(--cyan);
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.station-mini-tag{
  margin-left:auto;
  font-size:0.7rem;
  font-weight:700;
  color:#64748b;
  background:#1e293b;
  padding:2px 6px;
  border-radius:4px;
  text-transform:uppercase;
}

.route{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.position{
  margin-top:4px;
  color:#d9e2ef;
  font-size:11px;
}

.delete{
  border:0;
  background:transparent;
  color:#64748b;
  font-size:18px;
  padding:0 6px;
}
.delete:hover{color:var(--red)}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="header-row">
    <div>
      <h1>🚆 Moje Pociągi</h1>
      <div class="header-sub">Aktualny status z danych PLK</div>
    </div>
    <button class="refresh" id="refreshBtn" title="Odśwież">↻</button>
  </div>
</header>

<div class="summary">
  <span>MONITOROWANE</span>
  <span id="summaryInfo">Ładowanie…</span>
</div>

<main id="list" class="list"></main>

</div>

<script>
// Dokładny wykaz podany przez Ciebie
const EXACT_TRAINS = [
  { station: 'Miasteczko Śląskie', trainNum: '44226', planTime: '04:59' },
  { station: 'Tarnowskie Góry', trainNum: '40450', planTime: '05:21' },
  { station: 'Chorzów Batory', trainNum: '40658', planTime: '06:07' },
  { station: 'Tarnowskie Góry', trainNum: '40250', planTime: '05:46' },
  { station: 'Chorzów Batory', trainNum: '40660', planTime: '06:32' },
  { station: 'Katowice', trainNum: '40921', planTime: '14:59' },
  { station: 'Katowice', trainNum: '40621', planTime: '15:35' },
  { station: 'Chorzów Batory', trainNum: '40423', planTime: '15:12' },
  { station: 'Chorzów Batory', trainNum: '40425', planTime: '16:06' },
  { station: 'Katowice', trainNum: '8330', planTime: '10:20' },
  { station: 'Katowice', trainNum: '3815', planTime: '14:40' }
];

const STORAGE_KEY = 'rafstakMojePociagiV5_EXACT';
const ORDER_KEY = 'trains_custom_order_v5';

// Wymuszenie czyszczenia starych kluczy z pamięci podręcznej przeglądarki
localStorage.removeItem('rafstakMojePociagiV3');
localStorage.removeItem('rafstakMojePociagiV4_STABLE');

function getList(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){}
  return EXACT_TRAINS.map(x => ({...x}));
}

function saveList(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function getTrainNumber(row){
  return String(row.trainNumber || row.trainNo || row.number || row.train || row.trainNum || '');
}

function timeOnly(value){
  const match = String(value || '').match(/(\d{2}:\d{2})/);
  return match ? match[1] : String(value || '');
}

async function fetchStation(station){
  const params = new URLSearchParams({ station, limit: '300' });
  const res = await fetch('/api/departures?' + params.toString(), { cache:'no-store' });
  if(!res.ok) return [];
  const data = await res.json();
  return Array.isArray(data.departures) ? data.departures : [];
}

function buildCard(item, row, routeInfo, index){
  const num = item.trainNum || item.number;
  const trainName = row ? (row.name || row.trainName || row.commercialName || '') : '';
  const route = routeInfo.origin && routeInfo.destination 
    ? `${routeInfo.origin} → ${routeInfo.destination}`
    : (item.planTime ? `Godz. odjazdu: ${item.planTime}` : 'Brak danych o trasie');

  const lastPos = row && row.lastConfirmedStation 
    ? `📍 Ostatnio: ${row.lastConfirmedStation}` + (row.lastConfirmedTime ? ` · ${timeOnly(row.lastConfirmedTime)}` : '')
    : '';

  return `
    <article class="card" data-key="${item.station}-${num}" data-index="${index}">
      <span class="drag-handle">⋮⋮</span>
      <div class="train-content">
        <div class="train-top">
          <span class="train-number">#${num}</span>
          ${trainName ? `<span class="train-name">${trainName}</span>` : ''}
          <span class="station-mini-tag">${item.station}</span>
        </div>
        <div class="route">${route}</div>
        ${lastPos ? `<div class="position">${lastPos}</div>` : ''}
      </div>
      <button class="delete" data-index="${index}">×</button>
    </article>
  `;
}

async function loadTrains(){
  const list = getList();
  const container = document.getElementById('list');
  const refresh = document.getElementById('refreshBtn');

  refresh.disabled = true;
  document.getElementById('summaryInfo').textContent = `0 / ${list.length}`;

  const stationCache = new Map();
  const htmls = [];

  for(let i = 0; i < list.length; i++){
    const item = list[i];
    const num = item.trainNum || item.number;
    try {
      if(!stationCache.has(item.station)){
        stationCache.set(item.station, fetchStation(item.station));
      }
      const rows = await stationCache.get(item.station);
      const row = rows.find(r => getTrainNumber(r) === String(num)) || null;
      
      let routeInfo = { origin:'', destination:'' };
      if(row && row.scheduleId && row.orderId){
        try{
          const rRes = await fetch(`/api/schedules/route/${row.scheduleId}/${row.orderId}`);
          if(rRes.ok){
            const rData = await rRes.json();
            const st = rData.route?.stations || rData.stations || [];
            if(st.length >= 2){
              const namesRes = await fetch(`/api/stations?ids=${st[0].stationId},${st[st.length-1].stationId}`);
              if(namesRes.ok){
                const nData = await namesRes.json();
                routeInfo.origin = nData.names?.[st[0].stationId] || '';
                routeInfo.destination = nData.names?.[st[st.length-1].stationId] || '';
              }
            }
          }
        }catch(e){}
      }

      htmls.push(buildCard(item, row, routeInfo, i));
    } catch(e) {
      htmls.push(buildCard(item, null, {origin:'',destination:''}, i));
    }
    document.getElementById('summaryInfo').textContent = `${i+1} / ${list.length}`;
  }

  container.innerHTML = htmls.join('');
  restoreOrder();
  bindEvents();
  refresh.disabled = false;
}

function saveOrder(){
  const keys = Array.from(document.querySelectorAll('.card')).map(c => c.dataset.key);
  localStorage.setItem(ORDER_KEY, JSON.stringify(keys));
}

function restoreOrder(){
  const saved = localStorage.getItem(ORDER_KEY);
  if(!saved) return;
  try{
    const keys = JSON.parse(saved);
    const container = document.getElementById('list');
    keys.forEach(key => {
      const el = container.querySelector(`[data-key="${key}"]`);
      if(el) container.appendChild(el);
    });
  }catch(e){}
}

function bindEvents(){
  document.querySelectorAll('.delete').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const idx = Number(btn.dataset.index);
      const list = getList();
      list.splice(idx, 1);
      saveList(list);
      loadTrains();
    };
  });

  let activeCard = null;
  document.querySelectorAll('.drag-handle').forEach(handle => {
    const card = handle.closest('.card');
    handle.addEventListener('touchstart', () => { activeCard = card; }, { passive: true });
    handle.addEventListener('touchmove', (e) => {
      if (!activeCard) return;
      const touchY = e.touches[0].clientY;
      const touchX = e.touches[0].clientX;
      const targetEl = document.elementFromPoint(touchX, touchY);
      if (targetEl) {
        const targetCard = targetEl.closest('.card');
        if (targetCard && targetCard !== activeCard && targetCard.parentNode === activeCard.parentNode) {
          const rect = targetCard.getBoundingClientRect();
          const next = (touchY - rect.top) > (rect.height / 2);
          activeCard.parentNode.insertBefore(activeCard, next ? targetCard.nextSibling : targetCard);
        }
      }
    }, { passive: true });

    const endDrag = () => {
      if (activeCard) {
        activeCard = null;
        saveOrder();
      }
    };
    handle.addEventListener('touchend', endDrag);
    handle.addEventListener('mouseup', endDrag);
  });
}

document.getElementById('refreshBtn').onclick = loadTrains;

loadTrains();
</script>
</body>
</html>
