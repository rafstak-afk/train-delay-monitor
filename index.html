<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Moje Pociągi V2</title>

<style>
:root{
  --bg:#000000;
  --panel:#0f172a;
  --border:#334155;
  --text:#ffffff;
  --muted:#94a3b8;
  --cyan:#22d3ee;
  --red:#fb7185;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  padding:6px;
}

.app{
  width:min(100%,900px);
  margin:0 auto;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(0,0,0,.95);
  backdrop-filter:blur(10px);
  padding:8px 0 12px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h1{margin:0;font-size:20px;line-height:1.1}
.header-sub{color:var(--muted);font-size:12px;margin-top:2px}

.refresh{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  color:var(--cyan);
  font-size:18px;
  cursor:pointer;
}

.summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 2px 8px;
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.card{
  background:var(--panel);
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.train-content{
  flex-grow:1;
  min-width:0;
}

.train-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.train-number{
  font-size:16px;
  font-weight:900;
}

.train-name{
  color:var(--cyan);
  font-size:13px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.station-mini-tag{
  margin-left:auto;
  font-size:0.7rem;
  font-weight:700;
  color:#64748b;
  background:#1e293b;
  padding:2px 6px;
  border-radius:4px;
  text-transform:uppercase;
}

.route{
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.position{
  margin-top:4px;
  color:#e2e8f0;
  font-size:11px;
}

.status-badge{
  font-size:12px;
  font-weight:800;
  padding:2px 6px;
  border-radius:4px;
  background:#1e293b;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="header-row">
    <div>
      <h1>🚆 Moje Pociągi</h1>
      <div class="header-sub">Wykaz bezpośredni</div>
    </div>
    <button class="refresh" id="refreshBtn" title="Odśwież">↻</button>
  </div>
</header>

<div class="summary">
  <span>MONITOROWANE (11)</span>
  <span id="summaryInfo">Inicjalizacja…</span>
</div>

<main id="list" class="list"></main>

</div>

<script>
// Czyszczenie pamięci podręcznej w przeglądarce
localStorage.clear();

const TARGET_TRAINS = [
  { station: 'Miasteczko Śląskie', trainNum: '44226', planTime: '04:59' },
  { station: 'Tarnowskie Góry', trainNum: '40450', planTime: '05:21' },
  { station: 'Chorzów Batory', trainNum: '40658', planTime: '06:07' },
  { station: 'Tarnowskie Góry', trainNum: '40250', planTime: '05:46' },
  { station: 'Chorzów Batory', trainNum: '40660', planTime: '06:32' },
  { station: 'Katowice', trainNum: '40921', planTime: '14:59' },
  { station: 'Katowice', trainNum: '40621', planTime: '15:35' },
  { station: 'Chorzów Batory', trainNum: '40423', planTime: '15:12' },
  { station: 'Chorzów Batory', trainNum: '40425', planTime: '16:06' },
  { station: 'Katowice', trainNum: '8330', planTime: '10:20' },
  { station: 'Katowice', trainNum: '3815', planTime: '14:40' }
];

function getTrainNumber(row){
  return String(row.trainNumber || row.trainNo || row.number || row.train || row.trainNum || '');
}

function timeOnly(value){
  const match = String(value || '').match(/(\d{2}:\d{2})/);
  return match ? match[1] : String(value || '');
}

async function fetchStation(station){
  try {
    const params = new URLSearchParams({ station, limit: '300' });
    const res = await fetch('/api/departures?' + params.toString(), { cache:'no-store' });
    if(!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data.departures) ? data.departures : [];
  } catch(e) {
    return [];
  }
}

function renderSkeleton(){
  const container = document.getElementById('list');
  container.innerHTML = TARGET_TRAINS.map(item => `
    <article class="card">
      <div class="train-content">
        <div class="train-top">
          <span class="train-number">#${item.trainNum}</span>
          <span class="station-mini-tag">${item.station}</span>
        </div>
        <div class="route">Planowy odjazd: ${item.planTime}</div>
        <div class="position">Ładowanie danych PLK…</div>
      </div>
    </article>
  `).join('');
}

async function loadTrains(){
  renderSkeleton();
  const refresh = document.getElementById('refreshBtn');
  refresh.disabled = true;

  const stationNames = [...new Set(TARGET_TRAINS.map(t => t.station))];
  const stationData = new Map();

  for(const st of stationNames){
    stationData.set(st, await fetchStation(st));
  }

  const container = document.getElementById('list');
  const cards = [];

  for(const item of TARGET_TRAINS){
    const rows = stationData.get(item.station) || [];
    const row = rows.find(r => getTrainNumber(r) === item.trainNum);

    const trainName = row ? (row.name || row.trainName || row.commercialName || '') : '';
    const lastPos = row && row.lastConfirmedStation 
      ? `📍 Ostatnio: ${row.lastConfirmedStation}` + (row.lastConfirmedTime ? ` · ${timeOnly(row.lastConfirmedTime)}` : '')
      : 'Brak aktualnych danych o położeniu';

    cards.push(`
      <article class="card">
        <div class="train-content">
          <div class="train-top">
            <span class="train-number">#${item.trainNum}</span>
            ${trainName ? `<span class="train-name">${trainName}</span>` : ''}
            <span class="station-mini-tag">${item.station}</span>
          </div>
          <div class="route">Godzina z rozkładu: ${item.planTime}</div>
          <div class="position">${lastPos}</div>
        </div>
      </article>
    `);
  }

  container.innerHTML = cards.join('');
  document.getElementById('summaryInfo').textContent = `Załadowano ${TARGET_TRAINS.length} z ${TARGET_TRAINS.length}`;
  refresh.disabled = false;
}

document.getElementById('refreshBtn').onclick = loadTrains;
loadTrains();
</script>
</body>
</html>
